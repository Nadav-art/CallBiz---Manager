  <script>
  /* מבטיח viewport רספונסיבי גם כשהעמוד מוגש בתוך מעטפת (Artifact) שלא מגדירה אותו —
     בלי זה הדפדפן בנייד מרנדר ברוחב דסקטופ וגורם לגלישה אופקית ולשטח מת. */
  (function () { try {
    var m = document.querySelector('meta[name="viewport"]');
    if (!m) { m = document.createElement('meta'); m.name = 'viewport'; (document.head || document.documentElement).appendChild(m); }
    m.setAttribute('content', 'width=device-width, initial-scale=1, viewport-fit=cover');
  } catch (e) {} })();
  /* זיהוי מובייל לפי הרוחב האמיתי + חיווי דיבאג (מופיע רק במסך צר) — משלים את ה-@media */
  (function () {
    var DBG_SHOW = false;   /* רצועת הדיבאג מוסתרת — להחזרה לבקרת מסכים: שנה ל-true */
    function upd() { try {
      var cw = document.documentElement.clientWidth, ww = window.innerWidth, sw = document.body ? document.body.scrollWidth : 0;
      var mobile = cw <= 820;
      document.documentElement.classList.toggle('cb-mobile', mobile);
      document.documentElement.classList.toggle('cb-portrait', (window.innerHeight || 0) >= cw);
      var d = document.getElementById('cbdbg');
      if (d) { d.textContent = 'DBG · client=' + cw + ' win=' + ww + ' scroll=' + sw + ' · mobile=' + mobile; d.style.display = (DBG_SHOW && mobile) ? 'block' : 'none'; }
    } catch (e) {} }
    window.addEventListener('resize', upd); window.addEventListener('orientationchange', upd);
    window.addEventListener('load', upd); document.addEventListener('DOMContentLoaded', upd);
    setTimeout(upd, 200); setTimeout(upd, 800); upd();
  })();
  </script>
