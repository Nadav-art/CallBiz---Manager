    ${COORD_TREATMENTS.map(t => `<span class="cl-item"><span class="dot ${t.color}"></span>${t.label}</span>`).join('')}
    <span class="cl-sep"></span>
    <span class="cl-item"><span class="cg-busy sm">תפוס</span> מועד שנתפס</span>
    <span class="cl-item">${ic('plus')} מועד פנוי — לחיצה מתאמת</span>
  </div>`;
}

/* ============================================================
   חיווט
   ============================================================ */
function coordSelect(id) {
  const wasOpen = coordState.open;
  coordState.selected = id;
  coordState.open = true;
  if (!wasOpen) {
    // הפאנל היה סגור (נסגר ב-X) → פתיחת ליד חדש ישירות, בלי לשייך לליד הקודם
    coordState.caller = null; coordState.leadSearch = ''; coordState.allowDup = false; coordState.panelTab = 'lead';
    coordState.newLead = { name: '', phone: '', idnum: '', mail: '', org: '', entity: 'lead', journey: 'sales', source: 'קמפיין גוגל', prio: 'medium', subject: '' };
  } else if (!coordState.caller) {
    coordState.panelTab = 'lead';
  }
  renderCoordView();
}
function coordBook() {
  const s = coordPool().find(x => x.id === coordState.selected); if (!s) return;
  if (coordIsPast(s)) { toast('לא ניתן לקבוע תור למועד שכבר עבר'); coordState.selected = null; renderCoordView(); return; }
  const r = coordState.caller;
  if (r) return coordAskBook(r, s);   // ליד פתוח — אישור: החלפה אם יש תור, אחרת קביעה
  doCoordBook(s, false);
}
function doCoordBook(s, replaced) {
  const st = coordState, r = st.caller, doc = cDoc(s.doc), tr = cTreat(s.treatment);
  const who = r ? r.name : (st.newLead.name || 'הפונה');
  if (r && r.coordSlotId) { const old = coordPool().find(x => x.id === r.coordSlotId); if (old) old.booked = false; }   // שחרור התור הישן חזרה ליומן
  s.booked = true;
  if (r) {
    r.meeting = { date: cDayLbl(s.date), time: fmtH(s.h), dur: Math.round(s.dur * 60), channel: cBranch(s.branch).short, with: doc.name };
    r.coordSlotId = s.id;   // עדכון התור החדש בתוך הליד
  }
  st.selected = null; st.open = false;
  renderCoordView();
  toast(replaced
    ? `התור הוחלף: ${who} · ${doc.name} · ${fmtH(s.h)} ✓ התור הישן שוחרר ליומן, אישור חדש נשלח`
    : `התור נקבע: ${who} · ${tr.label} · ${doc.name} · ${fmtH(s.h)} ✓ אישור נשלח`);
}
function closeCoordConfirm() { $('#cpConfirm')?.remove(); }
function coordAskBook(r, s) {
  closeCoordConfirm();
  const m = r.meeting, hasMeeting = !!m;
  const newWhen = `<b>${cDayLbl(s.date)} · ${fmtH(s.h)}</b> עם ${cDoc(s.doc).name}`;
  const pop = document.createElement('div');
  pop.className = 'cp-confirm-wrap'; pop.id = 'cpConfirm';
  pop.innerHTML = `<div class="cp-confirm-box">
    <div class="cpc-t">${ic(hasMeeting ? 'alert' : 'calendar')} ${hasMeeting ? `כבר קיים תור ל${r.name}` : `קביעת תור ל${r.name}`}</div>
    <div class="cpc-body">${hasMeeting
      ? `התור הקיים: <b>${esc(m.date)} · ${esc(m.time)}</b>${m.with ? ' עם ' + esc(m.with) : ''}.<br>להחליף אותו במועד החדש — ${newWhen}? התור הישן ישוחרר חזרה ליומן.`
      : `לקבוע ל${r.name} תור חדש — ${newWhen}?`}</div>
    <div class="cpc-act"><button class="btn primary" data-cpc-yes>${ic('check')} ${hasMeeting ? 'כן, החלף תור' : 'כן, קבע תור'}</button>
      <button class="btn" data-cpc-no>ביטול</button></div>
  </div>`;
  document.body.appendChild(pop);
  pop.querySelector('[data-cpc-yes]').addEventListener('click', () => { closeCoordConfirm(); doCoordBook(s, hasMeeting); });
  pop.querySelector('[data-cpc-no]').addEventListener('click', closeCoordConfirm);
  pop.addEventListener('click', e => { if (e.target === pop) closeCoordConfirm(); });
}
/* פנייה חדשה מתוך לוח התיאום — אותו תהליך של יצירת ליד (+ קביעת תור אם נבחר מועד) */
function coordCreateAndBook() {
  const st = coordState;
  const v = readLeadForm($('.coord-panel'));
  if (!v.name || !v.phone) { toast('נא למלא שם וטלפון בטאב פרטי ליד'); st.panelTab = 'lead'; renderCoordView(); return; }
  const dup = st.allowDup ? null : findLeadDup(v.phone);   // "חדש לאותו לקוח" — מותר ליצור פנייה נוספת
  if (dup) {
    const d = $('#coordDup');
    if (d) { d.className = 'dup-hint warn';
      d.innerHTML = `${ic('alert')} קיימת כבר רשומה עם טלפון זה: <b>${dup.name}</b>. <button class="btn sm" data-coorddup>פתח קיימת</button>`;
      const b = $('[data-coorddup]'); if (b) b.addEventListener('click', () => { st.caller = dup; st.panelTab = 'flow'; renderCoordView(); }); }
    return;
  }
  const rec = buildLeadRecord(v);
  RECORDS.unshift(rec);
  let msg = `נוצרה פנייה: ${rec.name}`;
  const s = st.selected ? coordPool().find(x => x.id === st.selected) : null;
  if (s && !coordIsPast(s)) {
    s.booked = true;
    rec.meeting = { date: cDayLbl(s.date), time: fmtH(s.h), dur: Math.round(s.dur * 60), channel: cBranch(s.branch).short, with: cDoc(s.doc).name };
    msg += ` · נקבע תור ${fmtH(s.h)} עם ${cDoc(s.doc).name}`;
  }
  // נשאר inline בתוך היומן — הליד החדש נטען לאותו פאנל (בלי overlay מחשיך)
  st.caller = rec; st.selected = null; st.panelTab = 'flow'; st.leadSearch = ''; st.allowDup = false;
  st.newLead = { name: '', phone: '', mail: '', org: '', entity: 'lead', journey: 'sales', source: 'קמפיין גוגל', prio: 'medium', subject: '' };
  if (typeof renderList === 'function' && $('#listBody')) { renderSummary(); renderList(); }
  renderCoordView();
  toast(msg + ' ✓');
}
function coordBind() {
  const st = coordState;
  // ליד קיים — ציר הטיפול הוא אותו קוד כמו ה-Drawer, מחייב את אותה קשירת אירועים
  if (st.caller && st.panelTab === 'flow' && typeof bindFlow === 'function') { try { bindFlow(st.caller); } catch (e) {} }
  // תצוגה / ניווט
  $$('[data-cv]').forEach(b => b.addEventListener('click', () => { st.view = b.dataset.cv; renderCoordView(); }));
  $$('[data-cmob]').forEach(b => b.addEventListener('click', () => { st.mobileCal = b.dataset.cmob === 'cal'; renderCoordView(); }));
  $$('[data-cnav]').forEach(b => b.addEventListener('click', () => {
    const days = coordAvailDays(); if (!days.length) return;   // רק ימים עם חלונות פנויים
    const dir = +b.dataset.cnav, i = days.findIndex(d => d.date === st.date);
    const ni = Math.max(0, Math.min(days.length - 1, (i < 0 ? 0 : i) + dir));
    st.date = days[ni].date; renderCoordView();
  }));
  const only = $('[data-conly]'); if (only) only.addEventListener('click', () => { st.onlyAvailable = !st.onlyAvailable; renderCoordView(); });
  // "הוסף תיאום" — אותו טופס/פקודות כמו "פנייה חדשה", אבל בתוך היומן נפתח inline (דוחף את התורים הצידה, לא overlay מחשיך)
  const nw = $('[data-cnew]'); if (nw) nw.addEventListener('click', () => {
    st.open = true; st.caller = null; st.selected = null; st.panelTab = 'lead'; st.leadSearch = ''; st.allowDup = false;
    st.newLead = { name: '', phone: '', mail: '', org: '', entity: 'lead', journey: 'sales', source: 'קמפיין גוגל', prio: 'medium', subject: '' };
    renderCoordView();
  });
  // חיפוש ליד/לקוח קיים למעלה בפאנל
  const sInp = $('[data-leadsearch]');
  if (sInp) {
    const populate = () => { const res = $('#cpSearchRes'); if (res) { res.innerHTML = coordSearchResults(sInp.value); bindCoordSearchResults(); } };
    sInp.addEventListener('input', () => { st.leadSearch = sInp.value; populate(); });
    if (st.leadSearch) populate();
  }
  // חיפוש בסרגל העליון של הלוח — שיוך ישיר לליד/לקוח
  const tInp = $('[data-topsearch]');
  if (tInp) {
    const populateTop = () => { const res = $('#ctSearchRes'); if (res) { res.innerHTML = coordSearchResults(tInp.value); bindCoordSearchResults(); } };
    tInp.addEventListener('input', () => { st.topSearch = tInp.value; populateTop(); });
    if (st.topSearch) populateTop();
  }
  const pc = $('[data-cpanel-close]'); if (pc) pc.addEventListener('click', () => { st.open = false; renderCoordView(); });
  $$('[data-openslot]').forEach(b => b.addEventListener('click', () => coordSelect(b.dataset.openslot)));
  // טופס פרטי ליד — אותו טופס כמו "פנייה חדשה" (שמירה למצב בלי רינדור מחדש כדי לא לאבד פוקוס)
  $$('.coord-panel [data-nl]').forEach(el => el.addEventListener('input', () => { st.newLead[el.dataset.nl] = el.value; }));
  $$('.coord-panel [data-nl]').forEach(el => el.addEventListener('change', () => { st.newLead[el.dataset.nl] = el.value; }));
  const create = $('[data-ccreate]'); if (create) create.addEventListener('click', coordCreateAndBook);
  const chg = $('[data-cchange]'); if (chg) chg.addEventListener('click', () => { st.selected = null; renderCoordView(); });
  // טאבים בפאנל (מבנה כמו חלון הליד)
  $$('[data-ptab]').forEach(b => b.addEventListener('click', () => { st.panelTab = b.dataset.ptab; renderCoordView(); }));
  // פעולות מהירות בזמן שיחה
  $$('[data-cq]').forEach(b => b.addEventListener('click', () => {
    const q = b.dataset.cq, who = st.caller ? st.caller.name : (st.newLead.name || 'הפונה');
    if (q === 'call') dialTel(st.caller ? st.caller.phone : st.newLead.phone, who);
    if (q === 'wa')   toast(`נפתחת שיחת וואטסאפ עם ${who}`);
    if (q === 'note') toast('נפתחה הערה לתיאום');
    if (q === 'hist') { st.panelTab = 'history'; renderCoordView(); }
  }));
  // אקורדיון קריטריונים — בנייד: פתיחה סוגרת את השאר וממקמת את הכותרת גבוה (לא קופץ למעלה)
  $$('[data-critacc]').forEach(b => b.addEventListener('click', () => {
    const k = b.dataset.critacc;
    const mobile = document.documentElement.classList.contains('cb-mobile');
    const wasOpen = st.critOpen.has(k);
    if (mobile) { st.critOpen.clear(); if (!wasOpen) st.critOpen.add(k); }
    else { wasOpen ? st.critOpen.delete(k) : st.critOpen.add(k); }
    renderCoordView();
    if (mobile && !wasOpen) requestAnimationFrame(() => scrollCritHeadTop(k));
  }));
  $$('[data-adv]').forEach(c => c.addEventListener('change', () => { st.adv[c.dataset.adv] = c.checked; renderCoordView(); }));
  // קריטריונים
  const toggle = (set, k) => { set.has(k) ? set.delete(k) : set.add(k); renderCoordView(); };
  $$('[data-cb]').forEach(c => c.addEventListener('change', () => toggle(st.branches, c.dataset.cb)));
  $$('[data-cd]').forEach(c => c.addEventListener('change', () => toggle(st.doctors, c.dataset.cd)));
  $$('[data-ct]').forEach(c => c.addEventListener('change', () => toggle(st.treatments, c.dataset.ct)));
  $$('[data-cg]').forEach(b => b.addEventListener('click', () => { st.gender = b.dataset.cg; renderCoordView(); }));
  $$('[data-cmore]').forEach(b => b.addEventListener('click', () => { st[b.dataset.cmore] = !st[b.dataset.cmore]; renderCoordView(); }));
  $$('[data-cday]').forEach(b => b.addEventListener('click', () => toggle(st.days, +b.dataset.cday)));
  $$('[data-cdur]').forEach(r => r.addEventListener('input', () => {
    const v = +r.value;
    if (r.dataset.cdur === 'min') st.durMin = Math.min(v, st.durMax); else st.durMax = Math.max(v, st.durMin);
    renderCoordView();
  }));
  $$('[data-cdate]').forEach(d => d.addEventListener('change', () => { st[d.dataset.cdate === 'from' ? 'dateFrom' : 'dateTo'] = d.value; renderCoordView(); }));
  $$('[data-chour]').forEach(n => n.addEventListener('change', () => { st[n.dataset.chour === 'start' ? 'hourStart' : 'hourEnd'] = +n.value; renderCoordView(); }));
  const search = $('[data-csearch]'); if (search) search.addEventListener('click', () => { renderCoordView(); toast(`${coordAvailable().length} מועדים זמינים תואמים לקריטריונים`); });
  // בחירת מועד
  $$('[data-cselect]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); coordSelect(b.dataset.cselect); }));
  $$('[data-slot]').forEach(el => el.addEventListener('click', () => coordSelect(el.dataset.slot)));
  const slotMore = $('[data-cslotmore]'); if (slotMore) slotMore.addEventListener('click', () => { st.slotLimit += 8; renderCoordView(); });
  // אישור
  const book = $('[data-cbook]'); if (book) book.addEventListener('click', coordBook);
  const unsel = $('[data-cunsel]'); if (unsel) unsel.addEventListener('click', () => { st.selected = null; renderCoordView(); });
}

</script>
  <script>
/* ============================================================
   CallBiz Manager – חלון צ'אט (הצלבה עם "צ'אט צוות · קוליביז")
   מצב לקוח (חיצוני) + מצב התייעצות פנימית · עיצוב oklch כחול
   דורס את openWhatsApp מ-flows.js
   ============================================================ */

/* עמיתים להתייעצות פנימית (מבוסס על פלטפורמת הצ'אט) */
const CHAT_COLLEAGUES = [
  { id: 'ml',  name: 'מיכל רוזן', role: 'נציגת מכירות', presence: 'available', shared: 'מטפלת יחד בליד' },
  { id: 'dvd', name: 'דוד לוי',   role: 'מנהל מוקד',    presence: 'available', shared: 'מנהל ישיר' },
  { id: 'sa',  name: 'שרון אביב', role: 'שירות',        presence: 'active',    shared: null, needsRequest: true },
  { id: 'rl',  name: 'רותם לוי',  role: 'נציג',         presence: 'offline',   shared: 'צוות מכירות' },
];
const PRESENCE = {
  available: { c: 'oklch(60% 0.16 145)', label: 'זמין בפורטל' },
  active:    { c: 'oklch(58% 0.16 250)', label: 'פעיל · לא בדף' },
  offline:   { c: 'oklch(72% 0.02 250)', label: 'לא מחובר' },
};
const CHAT_EMOJIS = ['👍','🙏','✅','😊','💪','📅','📞','⏰','🔥','❗','💬','🤝'];

let chat = null;

/* ---- עזרים משותפים לכל הצ'אטים ---- */
/* עדכון "מגע אחרון" בשיחה — הצ'אט העדכני תמיד עולה למעלה */
function touchConv(c) { if (!c) return; c.ts = Date.now(); c.time = 'עכשיו'; }

/* גדילה אוטומטית עד ~4 שורות ואז גלילה; "שלח" נשאר בגובה שורה */
function autoGrowTA(ta, cap = 112) {
  ta.style.height = 'auto';
  const h = Math.min(ta.scrollHeight, cap);
  ta.style.height = h + 'px';
  ta.style.overflowY = ta.scrollHeight > cap ? 'auto' : 'hidden';
}
function unreadDivHTML() {
  return `<div class="unread-div"><i></i><span>הודעה שלא נקראה</span><i></i></div>`;
}
/* צליל התראה על הודעה נכנסת — נשמע גם כשנמצאים במסך/מערכת אחרת */
function playChatSound() {
  try {
    const ctx = window.__chatAC || (window.__chatAC = new (window.AudioContext || window.webkitAudioContext)());
    if (ctx.state === 'suspended') ctx.resume();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine'; o.frequency.value = 880; g.gain.value = 0.07;
    o.frequency.setValueAtTime(1174, ctx.currentTime + 0.09);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.28);
    o.start(); o.stop(ctx.currentTime + 0.3);
  } catch (e) { /* דפדפן חוסם אודיו לפני אינטראקציה */ }
  // חיווי גם בכותרת הטאב — למי שנמצא במערכת אחרת
  const t0 = 'CallBiz Manager – מסך עבודה אחוד';
  document.title = '💬 הודעה חדשה · CallBiz';
  clearTimeout(window.__titleT);
  window.__titleT = setTimeout(() => document.title = t0, 4000);
}

/* סנכרון מלא עם רשימת הצ'אטים: פתיחה בפופ-אפ = שיחה פתוחה בצ'אט צוות */
function nextConvId() { return Math.max(0, ...CONVERSATIONS.map(x => x.id)) + 1; }
function ensureConv(r, mode, colleague) {
  let c;
  if (mode === 'client') {
    c = CONVERSATIONS.find(x => x.kind === 'client' && x.recordId === r.id);
    if (!c) {
      c = { id: nextConvId(), name: r.name, kind: 'client', activity: 'לקוח · WhatsApp', recordId: r.id,
        presence: 'offline', unread: 0, last: '', time: 'עכשיו', status: 'open', thread: buildClientThread(r) };
      CONVERSATIONS.unshift(c);
    }
  } else {
    c = CONVERSATIONS.find(x => x.kind === 'internal' && x.name === colleague.name && x.recordId === r.id);
    if (!c) {
      c = { id: nextConvId(), name: colleague.name, kind: 'internal', activity: `התייעצות · ליד ${r.name}`, recordId: r.id,
        presence: colleague.presence || 'available', unread: 0, last: '', time: 'עכשיו', status: 'open', thread: [] };
      CONVERSATIONS.unshift(c);
    }
  }
  if (c.status === 'closed') c.status = 'open';   // פתיחה מחדש מהפופ-אפ
  touchConv(c);
  return c;
}
function syncChatUIs() {
  if (typeof renderDock === 'function' && document.querySelector('.dock-panel')) renderDock();
  if (document.querySelector('#viewHost .plat')) renderChatPlatform();
}

/* נקודת הכניסה – דורסת את openWhatsApp */
function openChat(r, mode = 'client') {
  chat = { r, mode, colleague: null, conv: null, thread: [], internalThread: [] };
  if (mode === 'client') {
    chat.conv = ensureConv(r, 'client', null);
    chat.thread = chat.conv.thread;             // אותו תיל — מסונכרן דו-כיוונית
    syncChatUIs();
  }
  $('#modal').style.maxWidth = '460px';
  $('#modal').style.height = '600px';
  renderChat();
  $('#modalWrap').classList.add('open');
}
function openWhatsApp(r) { openChat(r, 'client'); }        // שמירת תאימות לקריאות קיימות
function openConsult(r)  { openChat(r, 'internal'); }

/* ---- בניית שיחת לקוח לפי הזמנים בפועל של הרשומה ---- */
function ctxTime(r) {
  if (r.meeting) return `${r.meeting.date === '22/05/24' ? 'היום' : r.meeting.date} בשעה ${r.meeting.time}`;
  if (r.next?.at) return r.next.at;
  return 'בהקדם';
}
function buildClientThread(r) {
  const when = ctxTime(r);
  const chan = r.meeting?.channel || 'טלפון';
  return [
    { me: false, text: 'שלום, קיבלתי את הפרטים. מתי אפשר להיפגש?', who: r.name, time: '09:02' },
    { me: true,  text: `היי ${r.name.split(' ')[0]}, זה יואב. אשמח לתאם ${r.meeting ? 'פגישה' : 'שיחה'} ${when} ✅`, who: 'יואב', time: '09:03' },
    { me: false, text: 'מעולה, מתאים לי 👍', who: r.name, time: '09:04' },
    { me: true,  text: `שלחתי לך זימון ופרטים ל-${chan}. נתראה!`, who: 'יואב', time: '09:05' },
    ...(r.meeting ? [{ notice: true, kind: 'meeting', recordId: r.id, title: 'תזכורת פגישה', text: `${when} · ${chan}` }] : []),
  ];
}

function chatContext(r) {
  if (r.meeting) return `פגישה · ${ctxTime(r)}`;
  const na = NEXT_ACTIONS[r.next?.type];
  return na ? `${na.label} · ${r.next.at}` : 'פנייה פעילה';
}

/* ---- רינדור החלון ---- */
function renderChat() {
  const r = chat.r;
  const isInt = chat.mode === 'internal';
  $('#modal').innerHTML = `
    <div class="cbchat">
      <!-- טאבים: לקוח / התייעצות פנימית -->
      <div class="cc-tabs">
        <button class="cc-tab ${!isInt ? 'on' : ''}" data-cmode="client">${ic('whatsapp')} לקוח</button>
        <button class="cc-tab ${isInt ? 'on' : ''}" data-cmode="internal">${ic('clients')} התייעצות פנימית</button>
        <button class="close-btn cc-close" id="closeModal">${ic('close')}</button>
      </div>
      ${isInt ? internalHTML(r) : clientHTML(r)}
    </div>`;
  bindChat();
}

/* ---- מצב לקוח ---- */

function bindChat() {
  $('#closeModal').addEventListener('click', closeModal);
  $$('.cc-tab').forEach(b => b.addEventListener('click', () => { chat.mode = b.dataset.cmode; renderChat(); }));
  $$('[data-notice-rec]').forEach(b => b.addEventListener('click', () => openRecordFromChat(b.dataset.noticeRec)));
  $$('.cbchat [data-goto-lead]').forEach(b => b.addEventListener('click', () => openRecordFromChat(b.dataset.gotoLead)));
  // סיים שיחה → עוברת ישר ל"סגורות" בצ'אט צוות
  const fin = $('#ccFinish');
  if (fin) fin.addEventListener('click', () => {
    if (chat.conv) { chat.conv.status = 'closed'; chat.conv.time = 'עכשיו'; syncChatUIs(); }
    closeModal();
    toast('השיחה הסתיימה והועברה ל"סגורות" ✓');
  });
  const back = $('#ccBack'); if (back) back.addEventListener('click', () => { chat.colleague = null; renderChat(); });
  $$('.cc-col').forEach(b => b.addEventListener('click', () => {
    const col = CHAT_COLLEAGUES.find(c => c.id === b.dataset.col);
    chat.colleague = col;
    chat.conv = ensureConv(chat.r, 'internal', col);
    chat.internalThread = chat.conv.thread;     // מסונכרן לרשימת הצ'אטים
    if (col.needsRequest && !chat.conv.thread.length) {
      chat.conv.thread.push({ me: true, text: `שלחתי בקשת שיחה בנושא "${chat.r.subject}"`, who: 'יואב', time: 'עכשיו', req: true });
      chat.conv.last = 'בקשת שיחה נשלחה';
      toast(`בקשת שיחה נשלחה ל${col.name} (אין פעילות משותפת)`);
    }
    syncChatUIs();
    renderChat();
  }));
  $$('.cc-emoji').forEach(b => b.addEventListener('click', () => { const i = $('#ccInput'); if (i) i.value += b.dataset.emoji; i.focus(); }));
  const send = $('#ccSend'); if (send) send.addEventListener('click', sendChatMsg);
  const inp = $('#ccInput');
  if (inp) {
    inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMsg(); } });
    inp.addEventListener('input', () => autoGrowTA(inp));
  }
  const th = $('#ccThread'); if (th) th.scrollTop = th.scrollHeight;
}

function sendChatMsg() {
  const inp = $('#ccInput'); const txt = inp.value.trim(); if (!txt) return;
  const list = chat.mode === 'internal' ? chat.internalThread : chat.thread;
  list.push({ me: true, text: txt, who: 'יואב', time: 'עכשיו' });
  if (chat.conv) { chat.conv.last = txt; touchConv(chat.conv); syncChatUIs(); }
  inp.value = '';
  renderChat();
  // תגובה מדומה מהצד השני
  setTimeout(() => {
    const who = chat.mode === 'internal' ? (chat.colleague?.name || 'עמית') : chat.r.name;
    const reply = chat.mode === 'internal' ? 'קיבלתי, אני בודק ומעדכן 👍' : 'תודה! מאשר ✅';
    list.push({ me: false, text: reply, who, time: 'עכשיו' });
    if (chat && chat.conv) { chat.conv.last = reply; touchConv(chat.conv); syncChatUIs(); }
    playChatSound();
    if ($('#ccThread')) renderChat();
  }, 900);
}

let supState = null;
function buildSupChats(r) {
  // אורי שמבה — נתונים מלאים מהמופעים (empStatus=active → אין צ'אט לייב)

      { me: false, text: 'דרך מסך הדיווח. אליאור לא הסביר?', time: '10:22' },
      { me: true,  text: 'הסביר, לא הסתדרתי 😅', time: '10:24' },
    ] },
  ];
  // רון לובסי — מקליד כרגע מול טל אבני (הצ'אט הנוכחי היחיד)
  if (r.emp === 'רון לובסי') return [
    { name: 'טל אבני (נציג)', status: 'open', current: true, last: 'עכשיו', thread: [
      { me: true, text: 'היי, צריך תשובה על ההחלפה', time: '22:10' },
      { me: true, text: '?', time: '22:40' },
      { me: true, text: 'למה אתה מתעלם ממני? תענה כבר', time: '23:41' },
      { me: true, text: 'אני אמשיך לכתוב עד שתגיב', time: '23:47' },
    ] },
    { name: 'נדב כהן (מנהל)', status: 'open', last: 'לפני 20 דק\'', thread: [
      { me: true, text: 'נדב, מתי מגיעים הלידים החדשים?', time: '11:30' },
      { me: false, text: 'בודק ומעדכן אותך', time: '11:40' },
    ] },
    { name: 'עידן ברק (גיוס)', status: 'open', last: 'לפני שעה', thread: [
      { me: false, text: 'שלחתי לך את פרטי המועמד', time: '12:10' },
    ] },
    { name: 'לקוח — עודד מ.', status: 'closed', last: 'אתמול', thread: [
      { me: false, text: 'אתם גנבים, אני אדאג שתסגרו', time: '10:22' },
      { me: false, text: 'תיזהר ממני', time: '10:35' },
      { me: true, text: 'אני מבין את התסכול, מעביר למנהל', time: '10:36' },
    ] },
  ];
  // עובדים אחרים — נבנה מהסימונים הקיימים
  const convs = [];
  if (r.harassFlagged) convs.push({ name: r.withName || 'לקוח', status: 'open', last: r.last, thread: [
    { me: true, text: 'שלום, איך אפשר לעזור?', time: '10:15' },
    ...r.harassFlagged.map(f => ({ me: false, text: f.text, time: f.time })),
    { me: true, text: 'אני מבין את התסכול, אבדוק את זה מיד', time: '10:36' },
  ] });
  if (r.repeatedDetail) convs.push({ name: r.withName || 'לקוח', status: 'open', last: r.last, thread:
    r.repeatedDetail.flatMap(it => Array.from({ length: it.times }, (_, k) => ({ me: false, text: it.q, time: `${9 + k}:1${k}` }))).slice(0, 6)
      .concat([{ me: true, text: 'עונה לך מיד', time: '12:00' }]) });

  if (['live', 'typing'].includes(r.empStatus)) { const cur = convs.find(c => c.status === 'open'); if (cur) cur.current = true; }
  return convs;

/* לוגיקת סטטוס לשיחה: רק צ'אט אחד "נוכחי" — מקליד גובר על לייב, השאר פתוחה/נסגרה */
function supConvStatus(c, emp) {
  if (c.status === 'closed') return { label: 'נסגרה', cls: 'closed' };
  if (c.current && ['live', 'typing'].includes(emp.empStatus))
    return emp.empStatus === 'typing' ? { label: 'מקליד/ה', cls: 'typing' } : { label: 'לייב', cls: 'live' };
  return { label: 'פתוחה', cls: 'open' };
}
function openSupervisorChat(r, hlText) {
  supState = { emp: r, convs: buildSupChats(r), active: null, hl: hlText || '', tab: 'open' };
  // עדיפות: השיחה עם ההודעה המסומנת → הצ'אט הנוכחי (לייב/מקליד) → הראשונה
  const hlIdx = supState.convs.findIndex(c => c.thread.some(m => hlMatch(m.text, supState.hl)));
  const curIdx = supState.convs.findIndex(c => c.current);
  supState.active = hlIdx >= 0 ? hlIdx : (curIdx >= 0 ? curIdx : 0);
  $('#modal').style.maxWidth = '900px'; $('#modal').style.height = '600px';
  renderSupChat();
  $('#modalWrap').classList.add('open');
}
function hlMatch(msgText, hl) {
  if (!hl) return false;
  const clean = s => s.replace(/["״]/g, '').trim();
  return clean(msgText).includes(clean(hl)) || clean(hl).includes(clean(msgText));
}
function renderSupChat() {

/* ---- קומפוזר חכם: גדילה עד 4 שורות → גלילה · הרחבה ידנית עד חצי מסך ---- */
let cfManual = false;
const CF_AUTO_CAP = 112;   // ≈ 4 שורות
function autoGrowCF(ta) {
  if (cfManual) { ta.style.overflowY = ta.scrollHeight > ta.offsetHeight ? 'auto' : 'hidden'; return; }
  ta.style.height = 'auto';
  const h = Math.min(ta.scrollHeight, CF_AUTO_CAP);
  ta.style.height = h + 'px';
  ta.style.overflowY = ta.scrollHeight > CF_AUTO_CAP ? 'auto' : 'hidden';
}
function startCfDrag(e) {
  e.preventDefault();
  const ta = $('#cfInput'); if (!ta) return;
  const startY = e.clientY, startH = ta.offsetHeight;
  cfManual = true;
  const move = ev => {
    let h = startH + (startY - ev.clientY);                       // גרירה למעלה = הגדלה
    h = Math.max(46, Math.min(Math.round(window.innerHeight / 2), h));   // עד אמצע המסך
    ta.style.height = h + 'px';
    ta.style.overflowY = ta.scrollHeight > h ? 'auto' : 'hidden';
  };
  const up = () => { document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}

function platSend() {
  const inp = $('#cfInput'); const txt = inp.value.trim(); if (!txt) return;
  const c = CONVERSATIONS.find(x => x.id === platActive);
  c.thread.push({ me: true, text: txt, who: 'יואב', time: 'עכשיו' }); c.last = txt; touchConv(c); inp.value = '';
  platTyping = true; renderChatPlatform();
  setTimeout(() => { platTyping = false; c.thread.push({ me: false, text: c.kind === 'client' ? 'תודה! ✅' : 'קיבלתי, מטפל 👍', who: c.name, time: 'עכשיו' }); c.last = 'תגובה'; touchConv(c); playChatSound(); if (platView === 'conv') renderChatPlatform(); else { c.unread = (c.unread || 0) + 1; } }, 1100);
}
function platDefaultReply() {
  const c = CONVERSATIONS.find(x => x.id === platActive);
  c.thread.push({ me: false, text: 'שלום, קיבלתי את פנייתך ואחזור אליך בהקדם 🙏', who: c.name, time: 'עכשיו' });
  platTyping = false; renderChatPlatform();
}

  { key: 'meeting',  label: 'פגישה',        c: 'green',  icon: 'calendar' },
  { key: 'internal', label: 'פגישה פנימית', c: 'blue',   icon: 'clients'  },
  { key: 'private',  label: 'אירוע פרטי',   c: 'brand',  icon: 'user'     },
  { key: 'block',    label: 'חסימת יומן',   c: 'gray',   icon: 'clock'    },
];

/* מי מהעובדים גלוי לפי התפקיד */
function meetVisibleOwners() {
  if (meetRole === 'emp') return [CURRENT_USER];
  if (meetRole === 'mgr') return meetPickOwner ? [meetPickOwner] : CAL_OWNERS;
  return CAL_OWNERS;   // super
}
/* האם רואים פירוט מלא ביומן של owner (אחרת "תפוס" בלבד) */
function meetCanSeeDetail(owner) {
  if (owner === CURRENT_USER) return true;
  return meetRole === 'mgr' || meetRole === 'super';
}

/* משבצות תפוסות של משתתף בטווch שעות — לזיהוי התנגשויות כמו Google */
function meetBusyRanges(name, startH, endH) {
  const evs = CAL_EVENTS[name] || [];
  return evs.filter(e => e.h < endH && (e.h + e.dur) > startH)
            .map(e => `${fmtH(e.h)}–${fmtH(e.h + e.dur)}`);
}

/* מתג התפקיד מוגבל להרשאת המשתמש: נציג=אין מתג · מנהל סניף=עובד+מנהל · מנהל רשת/אדמין=הכל */
function allowedMeetRoles() {
  const me = (typeof STAFF !== 'undefined') && STAFF.find(s => s.name === CURRENT_USER);
  const perm = me ? me.perm : 'נציג';
  if (perm === 'מנהל רשת' || perm === 'אדמין') return ['emp', 'mgr', 'super'];
  if (perm === 'מנהל סניף') return ['emp', 'mgr'];
  return ['emp'];
}
/* ---------- המסך הראשי ---------- */
let meetView = 'cal';   // בנייד: cal = יומן · agenda = לוח זמנים (מתג עליון במקום גלילה)
function renderMeetingsView() {
  const mobile = document.documentElement.classList.contains('cb-mobile');
  const allowed = allowedMeetRoles();
  if (!allowed.includes(meetRole)) meetRole = allowed[0];   // הגבלה להרשאה
  const roleOptions = MEET_ROLES.filter(r => allowed.includes(r.key));
  const showCal = !mobile || meetView === 'cal';        // בדסקטופ מציגים הכל; בנייד לפי המתג
  const showAgenda = !mobile || meetView === 'agenda';
  $('#viewHost').innerHTML = `
    <div class="meet-head">
      <div class="vh-title"><span class="num">${ic('calendar')}</span> יומן פגישות</div>
      ${roleOptions.length > 1 ? `<div class="meet-roles" role="tablist">
        ${roleOptions.map(r => `<button class="meet-role ${r.key === meetRole ? 'on' : ''}" data-mrole="${r.key}" title="${r.desc}">${ic(r.icon)}<span>${r.label}</span></button>`).join('')}
      </div>` : ''}
    </div>
    ${mobile ? `<div class="meet-vtoggle">
      <button class="mv-btn ${meetView==='cal'?'on':''}" data-mview="cal">${ic('calendar')} יומן</button>
      <button class="mv-btn ${meetView==='agenda'?'on':''}" data-mview="agenda">${ic('tasks')} לוח זמנים</button>
    </div>` : ''}
    ${showCal ? `<div class="meet-toolbar">
      <div class="seg">
        <button class="seg-btn ${calMode==='day'?'on':''}" data-mmode="day">יום</button>
        <button class="seg-btn ${calMode==='week'?'on':''}" data-mmode="week">שבוע</button>
        <button class="seg-btn ${calMode==='month'?'on':''}" data-mmode="month">חודש</button>
      </div>
      <div class="cal-nav">
        <button class="icon-btn" data-mnav="-1" title="הקודם">${ic('chevronR')}</button>
        <button class="btn sm" data-mnav="today">היום</button>
        <button class="icon-btn" data-mnav="1" title="הבא">${ic('chevronL')}</button>
      </div>
      <span class="cal-label">${calLabel()}</span>
      ${meetRole === 'mgr' ? `<div class="meet-ownerpick">
        <button class="chip-pick ${!meetPickOwner?'on':''}" data-mpick="">כל הצוות</button>
        ${CAL_OWNERS.map(o => `<button class="chip-pick ${meetPickOwner===o?'on':''}" data-mpick="${o}">${o}</button>`).join('')}
      </div>` : ''}
      <div class="spacer"></div>
      <button class="btn sm primary" data-madd>${ic('plus')} הוסף</button>
    </div>` : ''}
    <div class="meet-body">
      ${showCal ? `<section class="card meet-cal">${meetCalHTML()}</section>` : ''}
      ${showAgenda ? `<aside class="meet-side">
        ${mobile ? `<div class="meet-agenda-add"><button class="btn sm primary" data-madd>${ic('plus')} פגישה / אירוע חדש</button></div>` : ''}
        ${meetRole === 'emp' ? meetTasksHTML() : meetTeamHTML()}
        ${meetSourcesHTML()}
      </aside>` : ''}
    </div>`;
  bindMeetings();
}

/* ---------- חיפוש אירועים ביומן (פנייה / שם אירוע / סוג · עבר ועתיד) ---------- */
function meetSearchEvents(q) {
  q = q.toLowerCase(); const out = [];
  Object.keys(CAL_EVENTS || {}).forEach(owner => {
    (CAL_EVENTS[owner] || []).forEach(e => {
      const rec = e.recId && RECORDS.find(r => r.id === e.recId);
      const hay = ((e.t || '') + ' ' + owner + ' ' + (rec ? rec.name + ' ' + (rec.org || '') : '')).toLowerCase();
      if (hay.includes(q)) out.push({ owner, t: e.t, h: e.h, dur: e.dur, recId: e.recId });
    });
  });
  return out.slice(0, 12);
}
function closeMeetSearchResults() { $('#meetSearchRes')?.remove(); }
function bindMeetSearch() {
  const inp = document.querySelector('.topbar .search input'); if (!inp) return;
  inp.setAttribute('placeholder', 'חיפוש אירוע ביומן — פנייה / שם / סוג…');
  inp.oninput = () => {
    const q = inp.value.trim(); closeMeetSearchResults();
    if (q.length < 2) return;
    const res = meetSearchEvents(q);
    const pop = document.createElement('div'); pop.id = 'meetSearchRes'; pop.className = 'meet-search-res';
    pop.innerHTML = res.length ? res.map(e => `<button class="msr-item" data-msr="${e.recId || ''}">
        <span class="msr-time">${fmtH(e.h)}</span>
        <span class="msr-body"><b>${esc(e.t)}</b><small>${e.owner}</small></span>${e.recId ? ic('chevronL') : ''}</button>`).join('')
      : `<div class="msr-empty">לא נמצאו אירועים תואמים</div>`;
    const r = inp.getBoundingClientRect();
    pop.style.top = (r.bottom + 4) + 'px'; pop.style.right = '10px'; pop.style.left = '10px';
    document.body.appendChild(pop);
    $$('[data-msr]', pop).forEach(b => b.addEventListener('click', () => {
      const id = +b.dataset.msr; closeMeetSearchResults(); inp.blur();
      const rec = RECORDS.find(x => x.id === id); if (rec) openDrawer(rec); else toast('אירוע: ' + b.querySelector('b').textContent);
    }));
  };
  inp.addEventListener('blur', () => setTimeout(closeMeetSearchResults, 200));
}

/* ---------- לוח היומן לפי תצוגה + תפקיד ---------- */
function meetCalHTML() {
  if (calMode === 'month') return calMonthHTML();     // חוזר לרינדור החודשי הקיים
  const owners = meetVisibleOwners();
  const hours = []; for (let h = 8; h <= 18; h++) hours.push(h);
  const cols = calMode === 'week'
    ? Array.from({ length: 7 }, (_, i) => addDays(startOfWeek(calDate), i))
    : owners;
  const head = calMode === 'week'
    ? cols.map(d => `<div class="mcal-owner ${dkey(d)===DEMO_DAY?'is-today':''}">${HEB_DAYS_S[d.getDay()]}<small>${d.getDate()}/${d.getMonth()+1}</small></div>`).join('')
    : cols.map(o => `<div class="mcal-owner">${o}${o===CURRENT_USER?' <small>(אני)</small>':''}</div>`).join('');
  const isDemo = dkey(calDate) === DEMO_DAY;
  return `<div class="mcal" style="grid-template-columns:52px repeat(${cols.length}, 1fr)">
    <div class="mcal-corner"></div>${head}
    ${hours.map(h => `
      <div class="mcal-hour">${String(h).padStart(2,'0')}:00</div>
      ${cols.map(col => {
        const owner = calMode === 'week' ? CURRENT_USER : col;
        const dayKey = calMode === 'week' ? dkey(col) : dkey(calDate);
        const onDemo = dayKey === DEMO_DAY;
        const evs = onDemo ? (CAL_EVENTS[owner] || []).filter(e => Math.floor(e.h) === h) : [];
        if (evs.length) {
          const detail = meetCanSeeDetail(owner);
          return `<div class="mcal-cell filled">${evs.map(ev => detail
            ? calEvHTML(ev, calMode === 'week', owner)
            : `<div class="mcal-ev busy" title="תפוס — יומן של ${owner}"><span class="ev-t">תפוס</span></div>`).join('')}</div>`;
        }
        if (onDemo && (h + 1) * 60 <= nowHM()) return `<div class="mcal-cell past"></div>`;
        return `<div class="mcal-cell slot-free" data-mslot data-o="${owner}" data-h="${h}" data-d="${dayKey}"></div>`;
      }).join('')}
    `).join('')}
  </div>`;
}

/* ---------- המשימות הבאות שלי (עובד) ---------- */
function meetTasksHTML() {
  const mine = (CAL_EVENTS[CURRENT_USER] || []).slice().sort((a, b) => a.h - b.h);
  return `<div class="meet-panel">
    <div class="mp-head">${ic('tasks')} המשימות הבאות שלי</div>
    <div class="mp-list">
      ${mine.map(e => `<div class="mp-task">
        <span class="mt-time">${fmtH(e.h)}</span>
        <span class="mt-dot ${e.c}"></span>
        <span class="mt-t">${e.t}</span>
        ${e.recId ? `<button class="mt-open" data-mopen="${e.recId}" title="פתח ליד">${ic('chevronL')}</button>` : ''}
      </div>`).join('') || '<div class="mp-empty">אין משימות להיום 🎉</div>'}
    </div>
    <div class="mp-quick">
      ${MEET_EVENT_TYPES.map(t => `<button class="mp-qbtn" data-madd data-mtype="${t.key}">${ic(t.icon)} ${t.label}</button>`).join('')}
    </div>

}

/* ---------- צוות (מנהל / מנהל-על) ---------- */
function meetTeamHTML() {
  const owners = CAL_OWNERS;
  return `<div class="meet-panel">
    <div class="mp-head">${ic('clients')} יומני הצוות ${meetRole==='super' ? '· כל הארגון' : ''}</div>
    <div class="mp-list">
      ${owners.map(o => {
        const evs = CAL_EVENTS[o] || [];
        const busy = evs.length, free = 11 - busy;
        return `<button class="mp-owner ${meetPickOwner===o?'on':''}" data-mpick="${o}">
          <span class="mo-name">${o}${o===CURRENT_USER?' (אני)':''}</span>
          <span class="mo-stat"><b>${busy}</b> תפוס · <b>${Math.max(0,free)}</b> פנוי</span>
        </button>`;
      }).join('')}
    </div>
    <div class="mp-note">${ic('eye')} ${meetRole==='super' ? 'מנהל-על רואה פירוט מלא בכל היומנים.' : 'מנהל רואה את יומני הצוות שלו בפירוט מלא.'}</div>
  </div>`;
}

/* ---------- מקורות יומן — Gmail / Outlook ---------- */
function meetSourcesHTML() {
  return `<div class="meet-panel">
    <div class="mp-head">${ic('sync')} מקורות יומן</div>
    <div class="mp-sources">
      ${MEET_SOURCES.map(s => `<div class="mp-source">
        <span class="ms-dot" style="background:${s.color}"></span>
        <span class="ms-name">${s.label}<small>${s.sub}</small></span>
        <button class="ms-btn ${s.connected?'on':''}" data-msrc="${s.key}">${s.connected ? ic('check') + ' מחובר' : 'חבר'}</button>
      </div>`).join('')}
    </div>
    <div class="mp-note">${ic('bolt')} דו-כיווני: אירועים מ-CallBiz יסונכרנו ליומן החיצוני ולהיפך.</div>
  </div>`;
}

/* ---------- הוספת אירוע ידני + זיהוי משתתפים תפוסים ---------- */
let meetDraft = null;
function openMeetAddModal(presetType) {
  meetDraft = { title: '', type: presetType || 'meeting', date: DEMO_DAY, start: 10, end: 11, participants: [] };
  renderMeetAddModal();
  $('#modalWrap').classList.add('open');
}
function renderMeetAddModal() {
  const d = meetDraft;
  const staffOptions = STAFF.filter(s => s.name !== CURRENT_USER);
  $('#modal').style.maxWidth = '560px'; $('#modal').style.height = '';
  $('#modal').innerHTML = `
    <div class="modal-head"><div class="title"><span class="num">${ic('plus')}</span> אירוע חדש ביומן</div>
      <button class="close-btn" id="closeModal">${ic('close')}</button></div>
    <div class="modal-body meet-add">
      <div class="ma-types">
        ${MEET_EVENT_TYPES.map(t => `<button class="ma-type ${d.type===t.key?'on':''}" data-matype="${t.key}"><span class="mt-dot ${t.c}"></span>${t.label}</button>`).join('')}
      </div>
      <label class="lf-lbl">כותרת</label>
      <input class="cc-inp" id="maTitle" placeholder="${MEET_EVENT_TYPES.find(t=>t.key===d.type).label}…" value="${esc(d.title)}">
      <div class="ma-row">
        <div><label class="lf-lbl">תאריך</label><input type="date" class="cc-inp" id="maDate" value="${d.date}"></div>
        <div><label class="lf-lbl">משעה</label><input type="number" class="cc-inp" id="maStart" min="6" max="22" step="1" value="${d.start}"></div>
        <div><label class="lf-lbl">עד שעה</label><input type="number" class="cc-inp" id="maEnd" min="7" max="23" step="1" value="${d.end}"></div>
      </div>
      ${d.type === 'block' || d.type === 'private' ? '' : `
      <label class="lf-lbl">משתתפים ${ic('clients')}</label>
      <div class="ma-parts">
        ${staffOptions.map(s => {
          const on = d.participants.includes(s.name);
          const busy = on ? meetBusyRanges(s.name, d.start, d.end) : [];
          return `<button class="ma-part ${on?'on':''} ${busy.length?'busy':''}" data-mpart="${s.name}">
            <span class="mpa-name">${s.name}</span>
            ${on ? (busy.length ? `<span class="mpa-busy">${ic('alert')} תפוס ${busy.join(', ')}</span>` : `<span class="mpa-free">${ic('check')} פנוי</span>`) : `<span class="mpa-role">${s.role}</span>`}
          </button>`;
        }).join('')}
      </div>
      ${d.participants.some(n => meetBusyRanges(n, d.start, d.end).length) ? `<div class="ma-warn">${ic('alert')} חלק מהמשתתפים תפוסים בזמן שנבחר — שקול זמן אחר.</div>` : ''}`}
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="maCancel">ביטול</button>
      <button class="btn primary" id="maSave">${ic('check')} שמור ביומן</button>
    </div>`;
  const sync = () => { d.title = $('#maTitle').value; d.date = $('#maDate').value; d.start = +$('#maStart').value; d.end = Math.max(+$('#maStart').value + 1, +$('#maEnd').value); };
  $('#closeModal').addEventListener('click', closeModal);
  $('#maCancel').addEventListener('click', closeModal);
  $$('[data-matype]').forEach(b => b.addEventListener('click', () => { sync(); d.type = b.dataset.matype; renderMeetAddModal(); }));
  $$('[data-mpart]').forEach(b => b.addEventListener('click', () => {
    sync(); const n = b.dataset.mpart;
    d.participants.includes(n) ? d.participants.splice(d.participants.indexOf(n), 1) : d.participants.push(n);
    renderMeetAddModal();
  }));
  ['maStart', 'maEnd', 'maDate'].forEach(id => { const el = $('#' + id); if (el) el.addEventListener('change', () => { sync(); renderMeetAddModal(); }); });
  $('#maSave').addEventListener('click', () => {
    sync();
    const type = MEET_EVENT_TYPES.find(t => t.key === d.type);
    (CAL_EVENTS[CURRENT_USER] = CAL_EVENTS[CURRENT_USER] || []).push({
      h: d.start, dur: Math.max(0.5, d.end - d.start), t: d.title || type.label, c: type.c,
    });
    closeModal(); renderMeetingsView();
    toast(`נוסף ליומן: ${d.title || type.label} · ${fmtH(d.start)}–${fmtH(d.end)}${d.participants.length ? ' · ' + d.participants.length + ' משתתפים' : ''}`);
  });
}

/* ---------- קשירת אירועים ---------- */
function bindMeetings() {
  $$('[data-mview]').forEach(b => b.addEventListener('click', () => { meetView = b.dataset.mview; renderMeetingsView(); }));
  $$('[data-mrole]').forEach(b => b.addEventListener('click', () => {
    meetRole = b.dataset.mrole; meetPickOwner = null; renderMeetingsView();
    toast('תצוגת ' + MEET_ROLES.find(r => r.key === meetRole).label);
  }));
  $$('[data-mmode]').forEach(b => b.addEventListener('click', () => { calMode = b.dataset.mmode; renderMeetingsView(); }));
  $$('[data-mnav]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.mnav === 'today') calDate = new Date(2024, 4, 22); else calShift(+b.dataset.mnav);
    renderMeetingsView();
  }));
  $$('[data-mpick]').forEach(b => b.addEventListener('click', () => { meetPickOwner = b.dataset.mpick || null; renderMeetingsView(); }));
  $$('[data-madd]').forEach(b => b.addEventListener('click', () => openMeetAddModal(b.dataset.mtype)));
  $$('[data-mslot]').forEach(c => c.addEventListener('click', () => {
    if (!meetCanSeeDetail(c.dataset.o)) return toast('יומן של עובד אחר — אין הרשאת עריכה');
    meetDraft = { title: '', type: 'meeting', date: c.dataset.d, start: +c.dataset.h, end: +c.dataset.h + 1, participants: [] };
    renderMeetAddModal(); $('#modalWrap').classList.add('open');
  }));
  $$('[data-mopen]').forEach(b => b.addEventListener('click', () => { const r = RECORDS.find(x => x.id === +b.dataset.mopen); if (r) openDrawer(r); }));
  $$('[data-msrc]').forEach(b => b.addEventListener('click', () => {
    const s = MEET_SOURCES.find(x => x.key === b.dataset.msrc); if (!s) return;
    s.connected = !s.connected; renderMeetingsView();
    toast(s.connected ? `${s.label} חובר · הסנכרון יתחיל` : `${s.label} נותק`);
  }));
  $$('.mcal-ev', $('#viewHost')).forEach(e => e.addEventListener('click', ev => {
    ev.stopPropagation();
    if (e.classList.contains('busy')) return toast('הזמן תפוס · פרטי האירוע חסויים');
    if (e.dataset.rec) openCalEvPopover(e); else toast(`אירוע: ${e.dataset.t || ''}`);
  }));
}

</script>
  <script>
/* ============================================================
   CallBiz Manager – "הצע זמנים" לנייד: מסך ייעודי של זמנים מוצעים בלבד
   • בלי יומן פיזי / גרירה — רק רשימת מועדים מוצעים + סינון לפי יום + חץ חזרה לליד
   • נוהל התעדוף מוגדר פר-עובד (יומן לפי עובד/סניף) — קובע איך יוצעו הזמנים
   ============================================================ */
const SCHED_MODES = [
  { key: 'adjacent', label: 'צמוד לפגישה הקודמת', desc: 'ממלא פערים — קרוב ככל האפשר לפגישה שלפני', gap: false },
  { key: 'lastDay',  label: 'אחרון ביום',          desc: 'בסוף היום, אחרי הפגישות הקיימות', gap: false },
  { key: 'gapStart', label: 'רווח מתחילת היום',     desc: 'לפחות X דקות אחרי תחילת יום העבודה', gap: true },
  { key: 'gapPrev',  label: 'רווח מהפגישה הקודמת',   desc: 'לפחות X דקות אחרי הפגישה שלפני', gap: true },
];
function staffByName(n) { return (typeof STAFF !== 'undefined') && STAFF.find(s => s.name === n); }
function staffById(id) { return (typeof STAFF !== 'undefined') && STAFF.find(s => s.id === id); }
function schedPrefOf(st) { if (!st.schedPref) st.schedPref = { mode: 'adjacent', gap: 15 }; return st.schedPref; }
let proposeState = { dayFilter: 'all', rec: null, services: [], mode: 'consolidated' };

/* מטפלים שיכולים לבצע את *כל* השירותים שנבחרו → ריכוז אצל מטפל אחד */
function eligibleDocs(services) { return services.length ? COORD_DOCTORS.filter(d => services.every(k => d.skills.includes(k))) : []; }
function docsForOne(key) { return COORD_DOCTORS.filter(d => d.skills.includes(key)); }
function svcDur(keys) { return keys.reduce((s, k) => s + (cTreat(k) ? cTreat(k).dur : 30), 0); }

/* דירוג משבצות פנויות לפי נוהל התעדוף של המטפל */
function rankedSlots(docKeys) {
  const pool = coordPool();
  let free = pool.filter(s => docKeys.includes(s.doc) && !s.booked && !coordIsPast(s));
  if (proposeState.dayFilter !== 'all') free = free.filter(s => s.date === proposeState.dayFilter);
  const booked = {};
  pool.filter(s => docKeys.includes(s.doc) && s.booked).forEach(s => { const k = s.doc + '|' + s.date; (booked[k] = booked[k] || []).push(s); });
  const DS = 8;
  return free.map(s => {
    const st = staffById(s.doc); const pref = st ? schedPrefOf(st) : { mode: 'adjacent', gap: 15 };
    const bk = (booked[s.doc + '|' + s.date] || []).filter(b => b.h + b.dur <= s.h).sort((a, b) => b.h - a.h);
    const prevEnd = bk.length ? bk[0].h + bk[0].dur : DS;
    let score, reason;
    if (pref.mode === 'adjacent') { score = s.h - prevEnd; reason = bk.length ? `צמוד ל-${fmtH(prevEnd)}` : 'ראשון ביום'; }
    else if (pref.mode === 'lastDay') { score = -s.h; reason = 'מאוחר ביום'; }
    else if (pref.mode === 'gapStart') { const g = pref.gap / 60; score = s.h >= DS + g ? Math.abs(s.h - (DS + g)) : 90; reason = `רווח ${pref.gap} ד׳ מהבוקר`; }
    else { const g = pref.gap / 60; score = s.h >= prevEnd + g ? Math.abs(s.h - (prevEnd + g)) : 90; reason = `רווח ${pref.gap} ד׳ מ-${fmtH(prevEnd)}`; }
    return { ...s, score, reason, docName: st ? st.name : s.doc };
  }).sort((a, b) => a.date === b.date ? a.score - b.score : a.date.localeCompare(b.date));
}

function openProposedTimes(r) {

      ${slots.length ? slots.map(s => ptSlotHTML(s, svcLabel)).join('') : `<div class="pt-empty">${ic('clock')} אין מועד מרוכז פנוי — נסה לפצל</div>`}`;
  } else {

    body = banner + services.map(k => {

      return `<div class="pt-svc-group"><div class="pt-svc-head">${ic('tasks')} ${cTreat(k).label} <small>${cTreat(k).dur} ד׳</small></div>
        ${slots.length ? slots.map(s => ptSlotHTML(s, cTreat(k).label)).join('') : `<div class="pt-empty sm">${ic('clock')} אין זמנים ל${cTreat(k).label}</div>`}</div>`;

        ${catalog.map(t => `<button class="pt-svcchip ${services.includes(t.key) ? 'on' : ''}" data-ptsvc="${t.key}">${t.label}${services.includes(t.key) ? ' ' + ic('check') : ''}</button>`).join('')}

  $$('[data-ptsvc]').forEach(b => b.addEventListener('click', () => {

  $$('[data-ptmode]').forEach(b => b.addEventListener('click', () => { proposeState.mode = b.dataset.ptmode; renderProposedTimes(); }));
  $$('[data-ptday]').forEach(b => b.addEventListener('click', () => { proposeState.dayFilter = b.dataset.ptday; renderProposedTimes(); }));
  $$('[data-ptbook]').forEach(b => b.addEventListener('click', () => {

function openSchedRuleModal() {

  $('#closeModal').addEventListener('click', closeModal); $('#srCancel').addEventListener('click', closeModal);
  $$('[data-srmode]').forEach(b => b.addEventListener('click', () => { if ($('#srGap')) pref.gap = +$('#srGap').value; pref.mode = b.dataset.srmode; openSchedRuleModal(); }));
  $('#srSave').addEventListener('click', () => { if ($('#srGap')) pref.gap = +$('#srGap').value; closeModal(); if ($('#proposePanel')) renderProposedTimes(); toast('נוהל התעדוף נשמר · הזמנים המוצעים עודכנו'); });
  $('#modalWrap').classList.add('open');

</script>
  <script>
/* ============================================================
   CallBiz Manager – שלב היסוד: קטלוג כתצורה + בחירת שירות/מוצר + ניתוב אוטומטי
   • כל שירות בקטלוג מגדיר: דורש פגישה / דורש סליקה / ניתן לתאם ללא סליקה / מקדמה / משך / מחיר
   • שלב "בחירת שירות/מוצר" לפני תיאום או רכישה
   • לפי התצורה המערכת מנתבת אוטומטית: תיאום / רכישה / שילוב
   ============================================================ */
/* מיזוג ברירות-מחדל של תצורה לתוך הקטלוג (מקור-אמת יחיד — ניתן לעריכה בהגדרות) */
const SERVICE_CFG_DEFAULTS = {
  consult:   { requiresMeeting: true,  requiresBilling: false, canScheduleWithoutBilling: true,  deposit: 0,   price: 0 },
  followup:  { requiresMeeting: true,  requiresBilling: false, canScheduleWithoutBilling: true,  deposit: 0,   price: 0 },
  facial:    { requiresMeeting: true,  requiresBilling: true,  canScheduleWithoutBilling: true,  deposit: 150, price: 690 },
  injection: { requiresMeeting: true,  requiresBilling: true,  canScheduleWithoutBilling: false, deposit: 300, price: 1200 },
  laser:     { requiresMeeting: true,  requiresBilling: true,  canScheduleWithoutBilling: true,  deposit: 200, price: 950 },
};
(function mergeServiceCfg() {
  if (typeof COORD_TREATMENTS === 'undefined') return;
  COORD_TREATMENTS.forEach(t => {
    const d = SERVICE_CFG_DEFAULTS[t.key] || {};
    if (t.requiresMeeting === undefined) t.requiresMeeting = d.requiresMeeting !== undefined ? d.requiresMeeting : (t.kind !== 'מוצר');
    if (t.requiresBilling === undefined) t.requiresBilling = !!d.requiresBilling;
    if (t.canScheduleWithoutBilling === undefined) t.canScheduleWithoutBilling = d.canScheduleWithoutBilling !== false;
    if (t.deposit === undefined) t.deposit = d.deposit || 0;
    if (t.price === undefined) t.price = d.price != null ? d.price : (t.dur || 30) * 20;
  });
})();
function svcCfg(key) { return cTreat(key) || {}; }
/* ניתוב אוטומטי לפי השירותים שנבחרו (#7) */
function serviceRoute(keys) {
  const cfgs = keys.map(svcCfg);
  const meeting = cfgs.some(c => c.requiresMeeting);
  const billing = cfgs.some(c => c.requiresBilling);
  if (meeting && billing) return 'both';
  if (meeting) return 'schedule';
  if (billing) return 'purchase';
  return 'schedule';
}
const ROUTE_LBL = { schedule: 'תיאום פגישה', purchase: 'רכישה', both: 'תיאום + רכישה' };
function svcTotals(keys) {
  const c = keys.map(svcCfg);
  return { dur: c.reduce((s, x) => s + (x.dur || 0), 0), price: c.reduce((s, x) => s + (x.price || 0), 0), deposit: c.reduce((s, x) => s + (x.deposit || 0), 0) };
}

/* ---------- מסך בחירת שירות/מוצר (#6) ---------- */
let svcSelState = { rec: null, sel: [] };
function openServiceSelect(r) {
  svcSelState = { rec: r, sel: (r.services || []).slice() };
  renderServiceSelect();
  $('#modalWrap').classList.add('open');
}
function renderServiceSelect() {
  const r = svcSelState.rec, sel = svcSelState.sel;
  const catalog = COORD_TREATMENTS;
  const route = sel.length ? serviceRoute(sel) : null;
  const tot = svcTotals(sel);
  $('#modal').style.maxWidth = '560px'; $('#modal').style.height = '';
  $('#modal').innerHTML = `
    <div class="modal-head"><div class="title"><span class="num">${ic('tasks')}</span> בחירת שירות / מוצר · ${r.name}</div>
      <button class="close-btn" id="closeModal">${ic('close')}</button></div>
    <div class="modal-body svc-sel">
      <div class="svc-list">
        ${catalog.map(t => {
          const on = sel.includes(t.key);
          return `<button class="svc-card ${on ? 'on' : ''}" data-svc="${t.key}">
            <span class="svc-check">${on ? ic('check') : ''}</span>
            <span class="svc-main"><b>${t.label}</b><small>${t.kind} · ${t.dur} ד׳${t.price ? ' · ' + t.price + ' ₪' : ''}</small></span>
            <span class="svc-tags">
              ${t.requiresMeeting ? `<span class="svc-tag meet">${ic('calendar')} פגישה</span>` : ''}
              ${t.requiresBilling ? `<span class="svc-tag bill">₪ סליקה</span>` : `<span class="svc-tag free">ללא סליקה</span>`}
              ${t.deposit ? `<span class="svc-tag dep">מקדמה ${t.deposit}₪</span>` : ''}
            </span>
            <button class="svc-cfg" data-svccfg="${t.key}" title="הגדרות השירות" aria-label="הגדרות">${ic('settings')}</button>
          </button>`;
        }).join('')}
      </div>
      ${sel.length ? `<div class="svc-summary">
        <div class="ss-route">${ic('bolt')} ניתוב אוטומטי: <b>${ROUTE_LBL[route]}</b></div>
        <div class="ss-totals"><span>${sel.length} פריטים</span><span>${tot.dur} ד׳</span><span>${tot.price} ₪</span>${tot.deposit ? `<span>מקדמה ${tot.deposit}₪</span>` : ''}</div>
      </div>` : `<div class="svc-empty-hint">${ic('alert')} בחר שירות/מוצר אחד או יותר — המערכת תחליט אוטומטית אם להמשיך לתיאום, רכישה או שניהם.</div>`}
    </div>
    <div class="modal-foot">
      <button class="btn ghost" id="svcCancel">ביטול</button>

    </div>`;
  $('#closeModal').addEventListener('click', closeModal);
  $('#svcCancel').addEventListener('click', closeModal);
  $$('[data-svc]').forEach(b => b.addEventListener('click', e => {
    if (e.target.closest('[data-svccfg]')) return;
    const k = b.dataset.svc, i = sel.indexOf(k);
    i >= 0 ? sel.splice(i, 1) : sel.push(k);
    renderServiceSelect();
  }));
  $$('[data-svccfg]').forEach(b => b.addEventListener('click', e => { e.stopPropagation(); openServiceCfgEditor(b.dataset.svccfg); }));
  const nx = $('#svcNext'); if (nx) nx.addEventListener('click', () => {
    if (!sel.length) return;
    svcSelState.rec.services = sel.slice();
    const route = serviceRoute(sel);
    closeModal();
    if (route === 'purchase') { toast(`מעבר לרכישה · ${svcTotals(sel).price} ₪`); }
    else { if (typeof openProposedTimes === 'function') openProposedTimes(svcSelState.rec); }
    if (route === 'both') setTimeout(() => toast(`לאחר התיאום — רכישה על סך ${svcTotals(sel).price} ₪`), 400);
  });

/* ---------- עורך תצורת שירות (#8) — מרוכז בקטלוג ---------- */
function openServiceCfgEditor(key) {

    </div>

  $('#cfgClose').addEventListener('click', () => { $('#modal').innerHTML = prev; renderServiceSelect(); });

    $$('[data-cfg]').forEach(inp => {

      t[k] = inp.type === 'checkbox' ? inp.checked : +inp.value;

    renderServiceSelect(); toast('הגדרות השירות נשמרו');
  });
}

      <div class="dp-body">
        ${list.length ? `<div class="dock-list">${list.map(dockConvRow).join('')}</div>`
          : `<div class="dp-empty"><span class="dpe-ic">${ic('check')}</span><b>אין שיחות בטיפול</b><small>סיימת לטפל בכל הצ'אטים 🎉</small></div>`}
      </div>
    </div>`;
}
function dockConvRow(c) {
  const pr = PRESENCE[c.presence];
  return `<button class="dock-conv ${c.id === dockConv ? 'on' : ''}" data-dconv="${c.id}">
    <span class="conv-av ${c.kind}">${c.kind === 'group' ? ic('clients') : c.name[0]}<span class="conv-dot" style="background:${pr.c}"></span></span>
    <span class="conv-info">
      <span class="conv-top"><b>${c.name}</b><small>${c.time}</small></span>
      <span class="conv-last">${c.last}</span>
    </span>
    ${c.unread ? `<span class="conv-badge">${c.unread}</span>` : ''}
  </button>`;
}
function dockConvView() {
  const c = CONVERSATIONS.find(x => x.id === dockConv);
  const pr = PRESENCE[c.presence];
  return `
    <div class="dock-conv-col">
      <div class="dock-head ${c.kind}">
        ${document.documentElement.classList.contains('cb-mobile') ? `<button class="dock-back" id="dockBack" title="חזרה" aria-label="חזרה">${ic('chevronR')}</button>` : ''}
        <span class="ca-badge">${c.kind === 'client' ? ic('whatsapp') + ' לקוח' : '🔒 פנימי'}</span>
        <div class="dock-recip"><span class="cc-dot" style="background:${pr.c};border:1.5px solid #fff"></span>
          <div><b>${c.name}</b><small>${c.activity}</small></div></div>
        ${c.recordId ? `<button class="lead-chip" data-goto-lead="${c.recordId}" title="פתח את הליד">${ic('user')} ${(RECORDS.find(x => x.id === c.recordId) || {}).name || 'לליד'}</button>` : ''}
      </div>
      <div class="dock-thread" id="dockThread">
        ${(() => { const mark = c.unreadMark || 0, at = c.thread.length - mark;
          return c.thread.map((m, i) => `${mark > 0 && i === at ? unreadDivHTML() : ''}${m.notice ? noticeCardHTML(m) : `<div class="cc-row ${m.me ? 'me' : 'them'}">
          <div class="cc-bubble ${m.me ? 'me' : 'them'} ${m.req ? 'req' : ''}">${esc(m.text)}</div>
          <div class="cc-meta">${m.who} · ${m.time}</div></div>`}`).join(''); })()}
      </div>
      <div class="cc-composer">
        <div class="cc-input-row">
          <textarea id="dockInput" rows="1" placeholder="${c.kind === 'client' ? 'הודעה ללקוח…' : 'הודעה פנימית…'}"></textarea>
          <button class="cc-send" id="dockSend" title="שלח" aria-label="שלח"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
        </div>
      </div>
    </div>`;
}
function bindDock() {
  $('#dockBtn').addEventListener('click', () => {
    dockOpen = !dockOpen; if (!dockOpen) dockConv = null;
    if (dockOpen) dockFilter = 'pending';   // תמיד נפתח על "ממתין לטיפול"
    dockAnim = dockOpen;            // אנימציה רק כשנפתח מחדש
    renderDock();
    dockAnim = false;
  });
  const exp = $('#dockExpand'); if (exp) exp.addEventListener('click', dockExpand);
  const dcl = $('#dockClose'); if (dcl) dcl.addEventListener('click', () => { dockOpen = false; dockConv = null; renderDock(); });
  const min = $('#dockMin'); if (min) min.addEventListener('click', () => { dockOpen = false; dockConv = null; renderDock(); });
  if (document.documentElement.classList.contains('cb-mobile')) attachDockSwipeDown();
  const nc = $('#dockNewConv'); if (nc) nc.addEventListener('click', () => { platView = 'contacts'; dockExpand(); });
  const ng = $('#dockNewGroup'); if (ng) ng.addEventListener('click', () => { platView = 'group'; newGroup = { name: '', members: [], sendPerm: 'all', addPerm: 'all' }; dockExpand(); });
  $$('[data-dpf]').forEach(b => b.addEventListener('click', () => { dockFilter = b.dataset.dpf; renderDock(); }));
  const back = $('#dockBack'); if (back) back.addEventListener('click', () => { dockConv = null; renderDock(); });
  $$('.dock-conv').forEach(b => b.addEventListener('click', () => {
    const id = +b.dataset.dconv;
    dockConv = dockConv === id ? null : id;   // לחיצה נוספת על אותה שיחה → הסתרה
    const c = CONVERSATIONS.find(x => x.id === id);
    if (c && dockConv === id) { c.unreadMark = c.unread; c.unread = 0; }   // סימון לקו "לא נקראה"
    renderDock();
  }));
  $$('[data-notice-rec]').forEach(b => b.addEventListener('click', () => openRecordFromChat(b.dataset.noticeRec)));
  $$('#chatDock [data-goto-lead]').forEach(b => b.addEventListener('click', () => openRecordFromChat(b.dataset.gotoLead)));
  const send = $('#dockSend'); if (send) send.addEventListener('click', dockSendMsg);
  const inp = $('#dockInput');
  if (inp) {
    /* בנייד/מגע: Enter = שורה חדשה (שולחים בכפתור). בדסקטופ: Enter שולח, Shift+Enter שורה */
    inp.addEventListener('keydown', e => {
      const mobile = (typeof isTouchDevice === 'function' && isTouchDevice()) || document.documentElement.classList.contains('cb-mobile');
      if (e.key === 'Enter' && !e.shiftKey && !mobile) { e.preventDefault(); dockSendMsg(); }
    });
    inp.addEventListener('input', () => autoGrowTA(inp));
  }
  const th = $('#dockThread'); if (th) th.scrollTop = th.scrollHeight;
}
/* החלקה קלה כלפי מטה בכל מקום בפאנל (כשהתוכן בראש הגלילה) → סגירת הצ'אט, כמו גיליון בטלפון */
function attachDockSwipeDown() {
  const panel = document.querySelector('#chatDock .dock-panel'); if (!panel) return;
  let startY = 0, startX = 0, dy = 0, dragging = false;
  panel.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { dragging = false; return; }
    startY = e.touches[0].clientY; startX = e.touches[0].clientX; dy = 0;
    // גרירה-לסגירה מותרת רק כשאזור הגלילה הפנימי כבר בראש (אחרת גוללים רגיל)
    const sc = e.target.closest('.dp-body, .dock-thread, .dock-list, .dock-list-col');
    dragging = !sc || sc.scrollTop <= 0;
    panel.style.transition = 'none';
  }, { passive: true });
  panel.addEventListener('touchmove', e => {
    if (!dragging) return;
    dy = e.touches[0].clientY - startY;
    const dx = e.touches[0].clientX - startX;
    if (dy > 0 && dy > Math.abs(dx)) {
      e.preventDefault();   // מונע שהמסך שמאחורי הצ'אט ייגלל בזמן הגרירה
      panel.style.transform = `translateY(${dy}px)`; panel.style.opacity = String(Math.max(0.55, 1 - dy / 650));
    } else if (dy < 0) { dragging = false; panel.style.transform = ''; panel.style.opacity = ''; }
  }, { passive: false });
  panel.addEventListener('touchend', () => {
    if (!dragging) return; dragging = false;
    panel.style.transition = 'transform .22s ease, opacity .22s ease';
    if (dy > 55) { panel.style.transform = 'translateY(100%)'; panel.style.opacity = '0'; setTimeout(() => { dockOpen = false; dockConv = null; renderDock(); }, 200); }
    else { panel.style.transform = ''; panel.style.opacity = ''; }
  });
}
function dockSendMsg() {
  const inp = $('#dockInput'); const txt = inp.value.trim(); if (!txt) return;
  const c = CONVERSATIONS.find(x => x.id === dockConv);
  c.thread.push({ me: true, text: txt, who: 'יואב', time: 'עכשיו' }); c.last = txt; touchConv(c); inp.value = '';
  renderDock();
  setTimeout(() => {
    const reply = c.kind === 'client' ? 'תודה! ✅' : 'קיבלתי 👍';
    c.thread.push({ me: false, text: reply, who: c.name, time: 'עכשיו' }); c.last = reply; touchConv(c);
    playChatSound();
    const focused = $('#dockThread') && dockConv === c.id;
    if ($('#dockThread')) renderDock(); else if (dockConv !== c.id) c.unread = (c.unread || 0) + 1;
    if (!focused) pushNotify({ title: c.name + (c.kind === 'client' ? ' (לקוח)' : ''), body: reply, cid: c.id });   // התראה קופצת אם לא צופים בשיחה
  }, 900);
}

/* ---- התראות בסגנון אפליקציית הודעות — באנר קופץ מלמעלה, לחיץ ---- */
function pushNotify(o) {
  // לא מקפיצים התראות כשהמשתמש כבר בתוך הצ'אט — dock פתוח או מסך הצ'אט המלא
  if ((typeof dockOpen !== 'undefined' && dockOpen) || document.querySelector('#viewHost .plat')) return;
  let host = document.getElementById('pushHost');
  if (!host) { host = document.createElement('div'); host.id = 'pushHost'; document.body.appendChild(host); }
  const n = document.createElement('div'); n.className = 'push-note';
  n.innerHTML = `<div class="pn-ic">${ic('whatsapp')}</div>
    <div class="pn-body"><b>${esc(o.title || 'הודעה חדשה')}</b><small>${esc(o.body || '')}</small></div>
    <button class="pn-x" aria-label="סגור">${ic('close')}</button>`;
  host.appendChild(n);
  requestAnimationFrame(() => n.classList.add('in'));
  let t = setTimeout(close, 6000);
  function close() { clearTimeout(t); n.classList.remove('in'); n.style.transition = 'transform .28s ease, opacity .28s ease'; n.style.transform = 'translateY(-140%)'; n.style.opacity = '0'; setTimeout(() => n.remove(), 300); }
  n.querySelector('.pn-x').addEventListener('click', e => { e.stopPropagation(); close(); });
  // גרירה כלפי מעלה → העלמה (כמו הסתרת התראה בטלפון)
  let sy = 0, ny = 0, drag = false, moved = false;
  n.addEventListener('touchstart', e => { sy = e.touches[0].clientY; ny = 0; drag = true; moved = false; clearTimeout(t); n.style.transition = 'none'; }, { passive: true });
  n.addEventListener('touchmove', e => { if (!drag) return; ny = e.touches[0].clientY - sy; if (Math.abs(ny) > 6) moved = true; if (ny < 0) n.style.transform = `translateY(${ny}px)`; }, { passive: true });
  n.addEventListener('touchend', () => {
    if (!drag) return; drag = false;
    if (ny < -40) { close(); }
    else { n.style.transition = 'transform .2s ease'; n.style.transform = ''; t = setTimeout(close, 4000); }
  });
  n.addEventListener('click', () => { if (moved) return; close(); openDockFromNotify(o.cid); });
}
function openDockFromNotify(cid) {
  dockOpen = true; if (cid) dockConv = cid;
  if ($('#chatDock')) renderDock();
  CONVERSATIONS.forEach(c => { if (c.id === cid) c.unread = 0; });
}
/* דמו: הודעות נכנסות שקופצות כמו התראות טלפון */
setTimeout(() => pushNotify({ title: 'מיכל רוזן', body: 'שלחתי לך את פרטי הליד של דנה 📋', cid: (typeof CONVERSATIONS !== 'undefined' && CONVERSATIONS[0]) ? CONVERSATIONS[0].id : null }), 6500);
setTimeout(() => pushNotify({ title: 'ישראל כהן (לקוח)', body: 'מעולה, נתראה מחר ב-9:30 👍', cid: (typeof CONVERSATIONS !== 'undefined' && CONVERSATIONS[1]) ? CONVERSATIONS[1].id : null }), 15000);
function closeChatDock() { dockOpen = false; dockConv = null; if ($('#chatDock')) renderDock(); }
function dockExpand() {
  closeChatDock();
  $$('#nav .nav-item').forEach(x => x.classList.remove('active'));
  const w = $('[data-nav="whatsapp"]'); if (w) w.classList.add('active');
  $$('#procTabs .proc-tab').forEach(x => x.classList.remove('active'));
  if (platView === 'list') enterChatPlatform(); else renderChatPlatform();
}

</script>
