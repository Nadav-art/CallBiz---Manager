<style>
/* ============================================================
   CallBiz Manager – מסך עבודה אחוד
   Design tokens (מבוססים על השפה העיצובית מהמסך)
   ============================================================ */
:root {
  /* צבעי מותג */
  --brand:        #5B4CE6;
  --brand-600:    #4F42D6;
  --brand-700:    #4436C4;
  --brand-soft:   #EEEDFB;
  --brand-soft-2: #F4F3FE;

  /* ניטרליים */
  --bg:           #F4F5FA;
  --surface:      #FFFFFF;
  --surface-2:    #FAFAFD;
  --border:       #E9E9F1;
  --border-2:     #F0F0F6;

  /* טקסט */
  --text:         #1E2233;
  --text-2:       #6B7085;
  --text-3:       #9A9EB1;

  /* סטטוסים */
  --green:        #16A34A;
  --green-bg:     #DCFCE7;
  --orange:       #EA6A2C;
  --orange-bg:    #FDECDD;
  --blue:         #2F6BEB;
  --blue-bg:      #E1EBFF;
  --red:          #DC2626;
  --red-bg:       #FDE4E4;
  --amber:        #B7791F;
  --amber-bg:     #FBF0D9;

  /* מידות */
  --radius-lg: 18px;
  --radius:    12px;
  --radius-sm: 9px;
  --shadow-sm: 0 1px 2px rgba(30,34,51,.05);
  --shadow:    0 6px 24px rgba(30,34,51,.08);
  --shadow-lg: 0 12px 48px rgba(30,34,51,.16);

  --sidebar-w: 92px;
  --drawer-w:  460px;

  --font: "Heebo","Assistant","Segoe UI",Arial,sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  direction: rtl;
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: #D7D8E3; border-radius: 20px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============================================================
   פריסה ראשית
   ============================================================ */
.app { display: flex; min-height: 100vh; }

/* ---- סרגל ניווט ימני ---- */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-inline-start: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center;
  padding: 18px 0;
  position: sticky; top: 0; height: 100vh;
  flex-shrink: 0;
}
.sidebar .logo {
  font-weight: 800; font-size: 12px; text-align: center;
  color: var(--brand); line-height: 1.15; margin-bottom: 22px;
}
.sidebar .logo span { display:block; color: var(--text-3); font-weight:600; font-size:10px; }
.nav { display: flex; flex-direction: column; gap: 6px; width: 100%; align-items: center; }
.nav-item {
  width: 60px; padding: 9px 4px; border-radius: var(--radius);
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  color: var(--text-2); border: none; background: transparent;
  font-size: 10.5px; font-weight: 600; transition: .15s;
}
.nav-item svg { width: 21px; height: 21px; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--brand-soft); color: var(--brand-600); }
.sidebar .user {
  margin-top: auto; display:flex; flex-direction:column; align-items:center; gap:4px;
  font-size: 10px; color: var(--text-2); text-align:center;
}
.sidebar .user .av { width:38px; height:38px; border-radius:50%; object-fit:cover; }

/* ---- אזור תוכן ---- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* ---- כותרת עליונה + טאבים של תהליך ---- */
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 12px 22px; display: flex; align-items: center; gap: 14px;
  position: sticky; top: 0; z-index: 20;
}
.topbar .page-title { font-size: 17px; font-weight: 800; white-space: nowrap; }
.proc-tabs { display: flex; gap: 8px; overflow-x: auto; flex: 1; padding-bottom: 2px; }
.proc-tab {
  white-space: nowrap; border: 1px solid var(--border); background: var(--surface);
  color: var(--text-2); padding: 8px 14px; border-radius: 10px;
  font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 7px;
}
.proc-tab:hover { border-color: #D9D9E6; color: var(--text); }
.proc-tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.proc-tab svg { width: 15px; height: 15px; }

/* ---- אזור עבודה מרכזי ---- */
.workspace { padding: 18px 22px; flex: 1; }

/* ============================================================
   כרטיסים כלליים
   ============================================================ */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid var(--border-2);
}
.card-head .title { display:flex; align-items:center; gap:9px; font-weight: 800; font-size: 15px; }
.card-head .num {
  width: 22px; height: 22px; border-radius: 6px; background: var(--brand);
  color: #fff; font-size: 12px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
}

/* ============================================================
   רשימת פניות ראשית
   ============================================================ */
.list-toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 18px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 8px 14px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px;
  display: inline-flex; align-items: center; gap: 7px; transition: .15s;
}
.btn:hover { background: var(--surface-2); }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-600); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.block { width: 100%; justify-content: center; }
.btn.sm { padding: 6px 11px; font-size: 12px; }

.select {
  border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
  padding: 8px 12px; border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 600;
  min-width: 120px; display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.spacer { flex: 1; }

.table-wrap { overflow-x: auto; }
table.list { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
table.list thead th {
  text-align: right; color: var(--text-3); font-weight: 700; font-size: 11.5px;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  background: var(--surface-2); position: sticky; top: 0;
}
table.list tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border-2); vertical-align: middle; }
table.list tbody tr { transition: background .12s; cursor: pointer; }
table.list tbody tr:hover { background: var(--brand-soft-2); }
table.list tbody tr.sel { background: var(--brand-soft); }

.client-cell { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.client-cell .av { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
.client-cell .meta { text-align: right; }
.client-cell .meta b { display: block; font-weight: 700; }
.client-cell .meta small { color: var(--text-3); font-size: 11px; }

.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
  border-radius: 20px; font-size: 11.5px; font-weight: 700; white-space: nowrap;
}
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.green  { color: var(--green);  background: var(--green-bg); }
.chip.orange { color: var(--orange); background: var(--orange-bg); }
.chip.blue   { color: var(--blue);   background: var(--blue-bg); }
.chip.red    { color: var(--red);    background: var(--red-bg); }
.chip.amber  { color: var(--amber);  background: var(--amber-bg); }
.chip.gray   { color: var(--text-2); background: #EFEFF4; }

.row-actions { display: flex; gap: 4px; }
.icon-btn {
  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2);
  display: inline-flex; align-items: center; justify-content: center; transition: .15s;
}
.icon-btn:hover { background: var(--brand-soft); color: var(--brand-600); border-color: var(--brand-soft); }
.icon-btn svg { width: 15px; height: 15px; }
.icon-btn.wa:hover  { color: #25D366; }
.icon-btn.tel:hover { color: var(--green); }

.kebab { color: var(--text-3); background:transparent; border:none; padding:4px; border-radius:6px; }
.kebab:hover { background: var(--border-2); }

/* ============================================================
   Drawer ימני
   ============================================================ */
.overlay {
  position: fixed; inset: 0; background: rgba(20,22,34,.34);
  opacity: 0; visibility: hidden; transition: .22s; z-index: 40;
}
.overlay.open { opacity: 1; visibility: visible; }

.drawer {
  position: fixed; top: 0; right: 0; height: 100vh; width: var(--drawer-w);
  max-width: 94vw; background: var(--surface); box-shadow: var(--shadow-lg);
  transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1);
  z-index: 50; display: flex; flex-direction: column;
}
.drawer.open { transform: translateX(0); }

.drawer-head { padding: 16px 18px; border-bottom: 1px solid var(--border); }
.drawer-head .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.drawer-head .top .t { display:flex; align-items:center; gap:8px; font-weight: 800; font-size: 15px; }
.drawer-head .top .t .num {
  width: 22px; height: 22px; border-radius: 6px; background: var(--brand); color:#fff;
  font-size: 12px; display:inline-flex; align-items:center; justify-content:center; font-weight:700;
}
.close-btn { border:none; background: var(--border-2); width: 30px; height: 30px; border-radius: 8px; color: var(--text-2); }
.close-btn:hover { background: var(--red-bg); color: var(--red); }

.client-head { display: flex; align-items: center; gap: 12px; }
.client-head .av { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; }
.client-head .info { flex: 1; }
.client-head .info b { font-size: 16px; font-weight: 800; }
.client-head .info small { display: block; color: var(--text-3); }
.client-head .type-badge {
  background: var(--brand-soft); color: var(--brand-600); font-size: 11px;
  font-weight: 700; padding: 4px 10px; border-radius: 20px;
}
.client-head .quick { display: flex; gap: 6px; margin-top: 4px; }

.drawer-body { flex: 1; overflow-y: auto; padding: 14px 16px; }
.drawer-body .sec-title { font-size: 12px; color: var(--text-3); font-weight: 700; margin: 6px 2px 10px; display:flex; align-items:center; gap:6px;}

/* ---- Accordion ---- */
.accordion { display: flex; flex-direction: column; gap: 9px; }
.acc-item { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.acc-item.done { border-color: #D6EFDD; }
.acc-head {
  width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  background: var(--surface); border: none; text-align: right;
}
.acc-head:hover { background: var(--surface-2); }
.acc-head .state {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: 2px solid var(--border); color: var(--text-3);
}
.acc-head .state svg { width: 13px; height: 13px; }
.acc-item.done  .acc-head .state { background: var(--green); border-color: var(--green); color: #fff; }
.acc-item.active .acc-head .state { border-color: var(--brand); color: var(--brand); }
.acc-head .label { flex: 1; font-weight: 700; font-size: 13.5px; }
.acc-head .sub { color: var(--text-3); font-size: 11.5px; font-weight: 500; }
.acc-head .chev { color: var(--text-3); transition: transform .2s; }
.acc-item.open .acc-head .chev { transform: rotate(180deg); }
.acc-panel { max-height: 0; overflow: hidden; transition: max-height .25s ease; }
.acc-item.open .acc-panel { max-height: 620px; }
.acc-panel-inner { padding: 4px 14px 16px; border-top: 1px solid var(--border-2); }

/* שדות טופס בתוך Accordion */
.field { margin-bottom: 11px; }
.field > label { display: block; font-size: 11.5px; color: var(--text-2); font-weight: 700; margin-bottom: 5px; }
.field input, .field textarea, .field select {
  width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 9px 11px; font-family: inherit; font-size: 13px; color: var(--text); background: var(--surface);
}
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }

.meeting-box { background: var(--brand-soft-2); border: 1px solid var(--brand-soft); border-radius: var(--radius); padding: 12px 14px; }
.meeting-box .line { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; }
.meeting-box .line svg { width: 15px; height: 15px; color: var(--brand-600); }
.meeting-box .actions { display: flex; gap: 8px; margin-top: 10px; }

/* חלוניות זמן */
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.slot { border: 1px solid var(--border); background: var(--green-bg); color: var(--green); border-radius: 9px;
  padding: 9px; text-align: center; font-weight: 700; font-size: 13px; }
.slot:hover { filter: brightness(.97); }
.slot.sel { background: var(--brand); color: #fff; border-color: var(--brand); }

.drawer-foot { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; }

/* ============================================================
   Modal (יומן מלא / כללי)
   ============================================================ */
.modal-wrap {
  position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center;
  background: rgba(20,22,34,.4); padding: 24px;
}
.modal-wrap.open { display: flex; }
.modal {
  background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  width: 100%; max-width: 980px; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column;
}
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); }
.modal-head .title { display:flex; align-items:center; gap:9px; font-weight: 800; font-size: 16px; }
.modal-body { overflow: auto; padding: 18px 20px; }

/* מיני-יומן ליום */
.daycal { display: grid; grid-template-columns: 56px 1fr 1fr; gap: 0 10px; }
.daycal .hour { color: var(--text-3); font-size: 11.5px; padding-top: 4px; border-top: 1px solid var(--border-2); text-align: left; padding-left: 6px; }
.daycal .track { border-top: 1px solid var(--border-2); min-height: 46px; position: relative; padding: 3px 0; }
.cal-ev { border-radius: 8px; padding: 6px 9px; font-size: 11.5px; font-weight: 600; margin-bottom: 3px; border-inline-start: 3px solid; }
.cal-ev.brand { background: var(--brand-soft); color: var(--brand-700); border-color: var(--brand); }
.cal-ev.green { background: var(--green-bg); color: var(--green); border-color: var(--green); }
.cal-ev.blue  { background: var(--blue-bg); color: var(--blue); border-color: var(--blue); }
.cal-ev.orange{ background: var(--orange-bg); color: var(--orange); border-color: var(--orange); }

/* ============================================================
   Toast
   ============================================================ */
.toast-host { position: fixed; bottom: 20px; left: 20px; z-index: 90; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--text); color: #fff; padding: 11px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
  box-shadow: var(--shadow); display: flex; align-items: center; gap: 9px; animation: slideup .25s;
}
.toast svg { width: 16px; height: 16px; color: #6EE7A8; }
@keyframes slideup { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }

/* עזרי תצוגה */
.muted { color: var(--text-3); }
.hidden { display: none !important; }

</style>
<style>
/* ============================================================
   CallBiz Manager – הרחבות v2
   סיכום, טבלה מורחבת, טאבים, Work Queue, תזמון חכם
   ============================================================ */

/* ---- כרטיסי סיכום (3.2) ---- */
.summary { display: grid; grid-template-columns: repeat(9, 1fr); gap: 10px; margin-bottom: 16px; }
.sum-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 11px 12px; text-align: right; display: flex; flex-direction: column; gap: 3px;
  transition: .15s; box-shadow: var(--shadow-sm);
}
.sum-card:hover { border-color: #D9D9E6; transform: translateY(-1px); }
.sum-card.active { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.sum-card .v { font-size: 21px; font-weight: 800; line-height: 1; }
.sum-card .v.brand { color: var(--brand-600); } .sum-card .v.orange { color: var(--orange); }
.sum-card .v.red { color: var(--red); } .sum-card .v.blue { color: var(--blue); }
.sum-card .v.green { color: var(--green); } .sum-card .v.amber { color: var(--amber); }
.sum-card .l { font-size: 11px; color: var(--text-2); font-weight: 600; }
@media (max-width: 1400px) { .summary { grid-template-columns: repeat(5, 1fr); } }

/* ---- פריסת עבודה: רשימה + Work Queue ---- */
.work-row { display: flex; gap: 16px; align-items: flex-start; }
.list-card { flex: 1; min-width: 0; }
.queue-card { width: 300px; flex-shrink: 0; }
@media (max-width: 1180px) { .work-row { flex-direction: column; } .queue-card { width: 100%; } }

/* ---- Badge מסלול/ישות ---- */
.badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 7px; font-size: 11px; font-weight: 700; }
.badge.blue { color: var(--blue); background: var(--blue-bg); }
.badge.green { color: var(--green); background: var(--green-bg); }
.badge.amber { color: var(--amber); background: var(--amber-bg); }
.badge.orange { color: var(--orange); background: var(--orange-bg); }
.badge.red { color: var(--red); background: var(--red-bg); }
.badge.gray { color: var(--text-2); background: #EFEFF4; }
.chip.sm { padding: 2px 8px; font-size: 10.5px; }

/* נקודת סוג ישות ליד האווטאר */
.ent-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-inline-start: -4px; border: 2px solid #fff; }
.ent-dot.blue { background: var(--blue); } .ent-dot.green { background: var(--green); } .ent-dot.gray { background: var(--text-3); }

/* עמודת הפעולה הבאה */
.next-cell { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
.next-cell small { color: var(--text-3); font-size: 10.5px; }
.next-cell .chip svg { width: 12px; height: 12px; }
tr.row-over { background: #FEF6F6 !important; }
tr.row-over:hover { background: #FDECEC !important; }

/* ---- Work Queue ---- */
.queue { padding: 8px; display: flex; flex-direction: column; gap: 7px; max-height: 460px; overflow-y: auto; }
.q-item { display: flex; gap: 9px; align-items: flex-start; padding: 10px; border: 1px solid var(--border-2);
  border-radius: 10px; cursor: pointer; transition: .12s; }
.q-item:hover { border-color: var(--brand-soft); background: var(--brand-soft-2); }
.q-rank { width: 22px; height: 22px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 12px;
  font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.q-body { flex: 1; min-width: 0; }
.q-kind { font-size: 11px; color: var(--text-3); font-weight: 600; }
.q-name { font-size: 13px; font-weight: 700; }
.q-why { font-size: 11px; color: var(--text-2); }
.q-prio { align-self: center; }
.queue-foot { padding: 8px 14px; border-top: 1px solid var(--border-2); font-size: 11px; text-align: center; }

/* ---- Drawer: מטא-דאטה + פעולות מהירות + טאבים ---- */
.head-badges { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
.head-meta { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 12px; font-size: 12px; color: var(--text-2); }
.head-meta span { display: inline-flex; align-items: center; gap: 5px; }
.head-meta svg { width: 14px; height: 14px; }
.head-meta .sla.green { color: var(--green); } .head-meta .sla.orange { color: var(--orange); } .head-meta .sla.red { color: var(--red); font-weight: 700; }
.quick { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.q-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 7px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; color: var(--text-2); flex: 1; min-width: 52px; transition: .15s; }
.q-btn svg { width: 17px; height: 17px; }
.q-btn:hover { background: var(--brand-soft); color: var(--brand-600); border-color: var(--brand-soft); }
.q-btn.tel:hover { color: var(--green); } .q-btn.wa:hover { color: #25D366; }

     בלי זה הדפדפן בנייד מרנדר ברוחב דסקטופ וגורם לגלישה אופקית ולשטח מת. */
  (function () { try {
    var m = document.querySelector('meta[name="viewport"]');
    if (!m) { m = document.createElement('meta'); m.name = 'viewport'; (document.head || document.documentElement).appendChild(m); }
    m.setAttribute('content', 'width=device-width, initial-scale=1, viewport-fit=cover');
  } catch (e) {} })();
  /* זיהוי מובייל לפי הרוחב האמיתי + חיווי דיבאג (מופיע רק במסך צר) — משלים את ה-@media */
  (function () {
    var DBG_SHOW = false;   /* רצועת הדיבאג מוסתרת — להחזרה לבקרת מסכים: שנה ל-true */
    function upd() { try {
      var cw = document.documentElement.clientWidth, ww = window.innerWidth, sw = document.body ? document.body.scrollWidth : 0;
      var mobile = cw <= 820;
      document.documentElement.classList.toggle('cb-mobile', mobile);

    } catch (e) {} }
    window.addEventListener('resize', upd); window.addEventListener('orientationchange', upd);

/* --- עזרי זמן: אין קביעה בהיסטוריה — הכל מעכשיו והלאה --- */
function nowHM() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function hmToMin(hhmm) { const [a, b] = String(hhmm).split(':').map(Number); return a * 60 + (b || 0); }
function minToHM(m) { m = Math.max(0, m); return `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; }
function rangeStartMin(range) { return hmToMin(String(range).split('-')[0].trim()); }   // "09:00 - 10:00"
function isPastToday(hhmmOrRange) { return rangeStartMin(hhmmOrRange) <= nowHM(); }

/* שלבים אופציונליים — נוספים לפי צורך לכל ליד (דינמיות) */
const EXTRA_STAGE_LIB = [
  { key: 'deposit',  title: 'גביית מקדמה',   objective: 'collect', desc: 'תשלום מקדים לפני פגישה/טיפול',
    anchors: [{ type: 'before', key: 'meeting' }, { type: 'before', key: 'proposal' }, { type: 'after', key: 'contact' }] },
  { key: 'contract', title: 'הסכם לחתימה',   objective: 'close',   desc: 'שליחת הסכם ישירות אחרי שיחה/הצעה',
    anchors: [{ type: 'after', key: 'proposal' }, { type: 'after', key: 'contact' }] },
];
/* המסלול הדינמי של רשומה: בסיס פחות מדולגים + אופציונליים במקום הנכון */
function stageByKey(journey, k) {
  return workflowFor(journey).find(s => s.key === k) || EXTRA_STAGE_LIB.find(e => e.key === k);
}
function dynamicFlow(r) {
  /* סדר מותאם אישית (מעורך השלבים) גובר על הכל */
  if (r.customFlow && r.customFlow.length) {
    return r.customFlow.map(k => stageByKey(r.journey, k)).filter(Boolean)
      .map(s => ({ key: s.key, title: s.title, objective: s.objective }));
  }
  const skip = r.skipStages || [];
  let flow = workflowFor(r.journey).filter(s => !skip.includes(s.key));
  (r.extraStages || []).forEach(exKey => {
    const ex = EXTRA_STAGE_LIB.find(e => e.key === exKey); if (!ex) return;
    let pos = -1;
    for (const a of ex.anchors) {
      const i = flow.findIndex(s => s.key === a.key);
      if (i >= 0) { pos = a.type === 'before' ? i : i + 1; break; }
    }
    if (pos < 0) pos = Math.max(1, flow.length - 1);   // ברירת מחדל: לפני סגירה
    flow.splice(pos, 0, { key: ex.key, title: ex.title, objective: ex.objective });
  });
  return flow;
}

  const p = (phone || '').replace(/[^\d+]/g, '');

  if (touch && p) { window.location.href = 'tel:' + p; return; }
  toast(`מחייג ל${name || ''}${p ? ' · ' + p : ''}… (יחובר ל-Click2Call של המרכזייה)`);
}

let selectedId = null;

/* ---------------- חיפוש גלובלי — לפי הקשר הטאב + מתג "חיפוש חכם" (כל המערכת) ---------------- */
let smartSearch = false;
function searchPlaceholder() {
  if (smartSearch) return 'חיפוש חכם — בכל המערכת…';

  return m[navActive] || 'חיפוש ליד / לקוח / טלפון…';
}
function runGlobalSearch(q) {
  q = q.toLowerCase(); const res = [];

    if ((r.name + ' ' + (r.org || '') + ' ' + (r.phone || '') + ' ' + (r.subject || '')).toLowerCase().includes(q))
      res.push({ type: (clients && !leads) ? 'לקוח' : 'ליד', label: r.name, sub: r.org || r.phone || '', recId: r.id });

  }));

}
function closeSearchResults() { $('#globalSearchRes')?.remove(); }

    : `<div class="msr-empty">לא נמצאו תוצאות${smartSearch ? '' : ' · נסה "חיפוש חכם" לכל המערכת'}</div>`;
  const r = inp.getBoundingClientRect(); pop.style.top = (r.bottom + 4) + 'px'; pop.style.right = '10px'; pop.style.left = '10px';
  document.body.appendChild(pop);
  $$('[data-gsr]', pop).forEach(b => b.addEventListener('click', () => {

let searchSubmitted = false;
function outsideSearchClose(e) { if (!e.target.closest('#globalSearchRes') && !e.target.closest('.search')) { closeSearchResults(); document.removeEventListener('click', outsideSearchClose); } }
function bindGlobalSearch() {
  const inp = document.querySelector('.topbar .search input'); if (!inp) return;
  inp.addEventListener('input', () => showSearchResults(inp));
  // אנטר = שליחה: מציג תוצאות, מחזיר את הבר לגודלו (blur) ומשאיר את התוצאות עד לחיצה מחוץ
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); searchSubmitted = true; showSearchResults(inp); inp.blur(); } });
  inp.addEventListener('blur', () => setTimeout(() => {
    if (searchSubmitted) { searchSubmitted = false; setTimeout(() => document.addEventListener('click', outsideSearchClose), 0); }

/* רמז ויזואלי: רצועת כרטיסי הסיכום בנייד ניתנת לגלילה → הצצה שמאלה וחזרה, פעם אחת בכניסה למסך */
let pendingToolbarHint = true;
function hintScrollToolbar() {
  if (!document.documentElement.classList.contains('cb-mobile')) return;
  const el = document.querySelector('#summary') || document.querySelector('.summary');
  if (!el || el.scrollWidth <= el.clientWidth + 6) return;   // אין מה לגלול
  const prevSnap = el.style.scrollSnapType;
  el.style.scrollSnapType = 'none';   // מנטרל scroll-snap שאחרת "תופס" את ההצצה חזרה
  const range = el.scrollWidth - el.clientWidth;
  const peek = -Math.min(92, range);   // RTL: שלילי חושף את התוכן המוסתר משמאל (חושף ~כרטיס)
  const ease = t => (t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2);
  const out = 16, holdN = 6, back = 16, total = out + holdN + back;
  let i = 0;
  const iv = setInterval(() => {
    i++;
    if (i <= out) el.scrollLeft = peek * ease(i / out);                      // הצצה שמאלה
    else if (i <= out + holdN) el.scrollLeft = peek;                         // החזקה קצרה
    else if (i <= total) el.scrollLeft = peek * (1 - ease((i - out - holdN) / back));  // חזרה ימינה
    else { el.scrollLeft = 0; el.style.scrollSnapType = prevSnap; clearInterval(iv); }
  }, 28);
}

};
function cardCount(key) { return FILTERS[key] ? RECORDS.filter(FILTERS[key]).length : 0; }

  if (type === 'journey')  return ['כל המסלולים', ...uniq(RECORDS.map(r => JOURNEY_TYPES[r.journey].label))];

/* ---- ציר טיפול דינמי (מנוע Workflow) ---- */
function computeStages(r) {
  const flow = dynamicFlow(r);
  // אם השלב הנוכחי דולג — הפעיל הוא הבא שקיים במסלול המקורי
  let curIdx = flow.findIndex(s => s.key === r.stageKey);
  if (curIdx < 0) {
    const base = workflowFor(r.journey);
    const from = Math.max(0, base.findIndex(s => s.key === r.stageKey));
    for (let i = from; i < base.length; i++) {
      const j = flow.findIndex(s => s.key === base[i].key);
      if (j >= 0) { curIdx = j; break; }
    }
    if (curIdx < 0) curIdx = 0;
  }
  return flow.map((s, i) => {
    let state = i < curIdx ? 'done' : i === curIdx ? 'active' : 'todo';
    if (i === curIdx && r.overdue) state = 'overdue';
    return { ...s, state, idx: i };
  });
}
function servicesBarHTML(r) {
  const sel = r.services || [];
  if (typeof serviceRoute !== 'function') return '';
  if (!sel.length) return `<button class="svc-pick-btn" data-svcpick>${ic('tasks')} בחר שירות / מוצר <small>· לפני תיאום או רכישה</small> ${ic('chevronL')}</button>`;
  const route = serviceRoute(sel), tot = svcTotals(sel);

/* המלצת מועד חזרה — לפי מדיניות ההגדרות, תמיד מסונכרנת עם חלון פנוי */
function fuRecommendation() {
  // פנוי + עתידי בלבד — לעולם לא בהיסטוריה
  const freeFuture = FOLLOWUP_WINDOWS.find(w => w.booked < w.capacity && !isPastToday(w.range));
  switch (FOLLOWUP_POLICY.mode) {
    case 'next_day':   return `מחר ${FOLLOWUP_WINDOWS[0].range}`;
    case 'other_hour': { const t = nowHM() + 120; return t < 18 * 60 ? `היום ${minToHM(t)} (בעוד שעתיים)` : `מחר ${FOLLOWUP_WINDOWS[0].range}`; }
    case 'end_day':    return nowHM() < 17 * 60 ? 'היום 17:00' : `מחר ${FOLLOWUP_WINDOWS[0].range}`;
    default:           return freeFuture ? `היום ${freeFuture.range}` : `מחר ${FOLLOWUP_WINDOWS[0].range}`;  // same_day
  }
}
function fuWhenOptions() {
  const rec = fuRecommendation();
  const wins = FOLLOWUP_WINDOWS.filter(w => w.booked < w.capacity && !isPastToday(w.range))
    .map(w => `<option value="היום ${w.range}">היום ${w.range} · ${w.capacity - w.booked} פנוי</option>`).join('');
  return `<option value="">ללא</option>
    <option value="${rec}" selected>מומלץ: ${rec} · לפי הגדרות + פנוי</option>
    ${wins}
    <option value="__manual">בחירה ידנית…</option>
    <option value="__cal">📅 פתח יומן מלא…</option>`;
}
/* שינוי מהיר — מחושב מהשעה הנוכחית, בלי אופציות שעברו */
function fuQuickList() {
  const n = nowHM(), list = [];
  if (n + 15 < 18 * 60) list.push({ label: 'בעוד 15 דק׳', when: `היום ${minToHM(n + 15)}` });
  if (n + 30 < 18 * 60) list.push({ label: 'בעוד 30 דק׳', when: `היום ${minToHM(n + 30)}` });
  if (n + 60 < 18 * 60) list.push({ label: 'בעוד שעה', when: `היום ${minToHM(n + 60)}` });
  if (n < 17 * 60) list.push({ label: 'מאוחר היום', when: 'היום 17:00' });
  list.push({ label: 'מחר בבוקר', when: '23/05 09:00' });
  list.push({ label: 'מחר בצהריים', when: '23/05 13:00' });
  return list;
}

function bindFlow(r) {

    if (nh) nh.classList.toggle('hidden', !na);

  const syncTop = () => {
    syncPrimaryContact(r);

    if (small) small.textContent = `${r.org || ''}${r.org ? ' · ' : ''}${r.phone || ''}`;
    renderList();
  };
  /* --- התאמת שלבים + השלמת שלב + מקדמה/הסכם --- */
  $$('[data-custom-stages]').forEach(b => b.addEventListener('click', () => openStageCustomizer(r)));
  $$('[data-stage-done]').forEach(b => b.addEventListener('click', () => {
    const key = b.closest('.acc-item')?.dataset.key;
    const flow = dynamicFlow(r);
    const i = flow.findIndex(s => s.key === key);
    if (i >= 0 && r.stageKey === key && i < flow.length - 1) {
      r.stageKey = flow[i + 1].key;
      r.objective = flow[i + 1].objective || r.objective;
      renderList();
    }
    renderDrawerTab(r);
    const nextKey = (flow[i + 1] || flow[i] || {}).key;
    if (nextKey) { const el = $(`#accordion .acc-item[data-key="${nextKey}"]`); if (el) el.classList.add('open'); }
    toast('השלב הושלם ✓');
  }));
  $$('[data-pay-req]').forEach(b => b.addEventListener('click', () => {
    commLogFor(r).unshift({ type: 'wa', at: 'עכשיו', by: 'מערכת', text: 'נשלחה בקשת תשלום מקדמה (קישור סליקה) בוואטסאפ' });
    toast('בקשת התשלום נשלחה ✓');
  }));
  $$('[data-contract-send]').forEach(b => b.addEventListener('click', () => {
    commLogFor(r).unshift({ type: 'wa', at: 'עכשיו', by: 'מערכת', text: 'נשלח הסכם לחתימה דיגיטלית' });
    toast('ההסכם נשלח לחתימה ✓');
  }));

  /* --- אישור הגעה בוואטסאפ (שלב "אישור לקוח") --- */
  $$('[data-wa-confirm]').forEach(b => b.addEventListener('click', () => {
    commLogFor(r).unshift({ type: 'wa', at: 'עכשיו', by: 'מערכת', text: `נשלח אישור הגעה בוואטסאפ (תבנית): "${fillTemplate(WA_TEMPLATES.arrival, r).slice(0, 40)}…"` });
    const key = b.closest('.acc-item')?.dataset.key;
    renderDrawerTab(r);
    if (key) { const el = $(`#accordion .acc-item[data-key="${key}"]`); if (el) el.classList.add('open'); }
    toast('אישור הגעה נשלח בוואטסאפ ✓ (תועד בציר התקשורת)');
  }));

  /* --- פרטי ליד עריכים (שלב "ליד נכנס") --- */
  $$('[data-lf]').forEach(inp => inp.addEventListener('change', () => { r[inp.dataset.lf] = inp.value; }));
  $$('[data-lf-save]').forEach(b => b.addEventListener('click', () => {
    const key = b.closest('.acc-item')?.dataset.key;
    $$('[data-lf]').forEach(inp => { r[inp.dataset.lf] = inp.value; });
    r.avatar = r.name.split(' ').map(w => w[0]).slice(0, 2).join('') || r.avatar;
    const nameEl = $('#drawer .client-head b'); if (nameEl) nameEl.textContent = r.name;
    renderList();
    renderDrawerTab(r);
    if (key) { const el = $(`#accordion .acc-item[data-key="${key}"]`); if (el) el.classList.add('open'); }

  /* ולידציה חיה: טלפון = מספרים בלבד; אימייל = בלי עברית */
  const showFieldErr = (inp, msg) => {
    const f = inp.closest('.ctc-f') || inp;
    f.classList.add('err');
    let m = f.parentElement.querySelector('.ctc-err-msg');
    if (!m) { m = document.createElement('div'); m.className = 'ctc-err-msg'; f.parentElement.appendChild(m); }
    m.textContent = msg;
    clearTimeout(f._errT);
    f._errT = setTimeout(() => { f.classList.remove('err'); m.remove(); }, 2000);
  };
  $$('[data-cf$=":phone"]').forEach(inp => inp.addEventListener('input', () => {
    const clean = inp.value.replace(/[^\d\-+ ]/g, '');

  }));
  $$('[data-cf$=":mail"]').forEach(inp => inp.addEventListener('input', () => {
    const clean = inp.value.replace(/[֐-׿]/g, '');
    if (clean !== inp.value) { inp.value = clean; showFieldErr(inp, 'אימייל — באנגלית בלבד'); }
  }));
  $$('[data-cf]').forEach(inp => inp.addEventListener('change', () => {
    const [i, f] = inp.dataset.cf.split(':');
    contactsFor(r)[+i][f] = inp.value;
    if (contactsFor(r)[+i].primary) syncTop();
  }));
  /* תפקיד: בחירה מהרשימה; "אחר" פותח שדה חופשי שנכנס לרשימה לפעמים הבאות */
  $$('[data-crole]').forEach(sel => sel.addEventListener('change', () => {
    const i = +sel.dataset.crole;
    contactsFor(r)[i].role = sel.value;
    rerenderContacts();
  }));
  $$('[data-crole-custom]').forEach(inp => {
    const commit = () => {
      const v = inp.value.trim(); if (!v) return;
      const i = +inp.dataset.croleCustom;
      addCustomRole(v);
      contactsFor(r)[i].role = v;
      rerenderContacts();
      toast(`התפקיד "${v}" נוסף לרשימת התפקידים ✓`);
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); commit(); } });
    inp.addEventListener('blur', commit);
  });
  /* קיפול אנשי קשר נוספים */
  $$('[data-cmore]').forEach(b => b.addEventListener('click', () => { r.contactsOpen = !r.contactsOpen; rerenderContacts(); }));
  /* שמור אנשי קשר — משחרר חיוג/הוספה לחדשים */
  $$('[data-csave]').forEach(b => b.addEventListener('click', () => {
    let ok = true;
    $$('[data-cf$=":mail"]').forEach(inp => {

    $$('[data-cf]').forEach(inp => { const [i, f] = inp.dataset.cf.split(':'); contactsFor(r)[+i][f] = inp.value; });
    contactsFor(r).forEach(c => {
      if (c._saved === false && (!c.name.trim() || !c.phone.trim())) { ok = false; }
    });

    contactsFor(r).forEach(c => c._saved = true);

  $$('[data-cprim]').forEach(rd => rd.addEventListener('change', () => {

  $$('[data-cadd]').forEach(b => b.addEventListener('click', () => {

  // כפתור הפולו-אפ → מנהל הפולו-אפ (בחירה נשמרת מיד, גם בלי "שמור")
  const cfu = $('#commFu');

    commLogFor(r).unshift({ type, at: 'עכשיו', by: 'יואב כהן', text: txt });
    // בלי בחירת פולו-אפ ידנית — דיפולט לזמן הבא לפי ההגדרות (מסונכרן עם פנוי)
    let autoMsg = '';
    if (!r.fuAt && ['noanswer', 'callback'].includes(type)) {
      r.fuAt = fuRecommendation();
      r.next = { type: 'callback', at: r.fuAt };
      renderList();
      autoMsg = ` · נקבע פולו-אפ אוטומטי: ${r.fuAt}`;

    renderDrawerTab(r);
    const cst = $('#accordion .acc-item[data-key="contact"]'); if (cst) cst.classList.add('open');

/* ---- מגע: לחיצה ארוכה (1.8 שנ') = קליק ימני — מפעילה את אותן הפקודות (contextmenu) ---- */
/* מגע: דאבל-טאפ = קליק ימני (ראשי) + לחיצה ארוכה 1.8ש' (גיבוי). שניהם יורים contextmenu. */
function setupLongPress() {
  if (window.__longPressSetup) return; window.__longPressSetup = true;
  let timer = null, sx = 0, sy = 0, tgt = null, fired = false;
  let lastTapAt = 0, lastTapX = 0, lastTapY = 0, lastTapTgt = null;
  const clear = () => { if (timer) { clearTimeout(timer); timer = null; } };
  const fireCtx = (x, y, el) => {
    fired = true;
    const target = (el && el.isConnected) ? el : (document.elementFromPoint(x, y) || document);
    target.dispatchEvent(new MouseEvent('contextmenu', { bubbles: true, cancelable: true, clientX: x, clientY: y }));
    if (navigator.vibrate) { try { navigator.vibrate(18); } catch (e) {} }
    setTimeout(() => { fired = false; }, 800);
  };
  document.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { clear(); return; }
    const t = e.touches[0]; sx = t.clientX; sy = t.clientY; tgt = e.target; clear();
    timer = setTimeout(() => { timer = null; fireCtx(sx, sy, tgt); }, 1800);   // לחיצה ארוכה (גיבוי)
  }, { passive: true });
  document.addEventListener('touchmove', e => {
    if (!timer) return; const t = e.touches[0];
    if (Math.abs(t.clientX - sx) > 30 || Math.abs(t.clientY - sy) > 30) clear();
  }, { passive: true });
  document.addEventListener('touchend', e => {
    clear();
    const t = e.changedTouches[0]; if (!t) return;
    const now = Date.now();
    if (now - lastTapAt < 340 && Math.abs(t.clientX - lastTapX) < 34 && Math.abs(t.clientY - lastTapY) < 34) {
      // דאבל-טאפ → קליק ימני
      e.preventDefault();
      fireCtx(t.clientX, t.clientY, (lastTapTgt && lastTapTgt.isConnected) ? lastTapTgt : e.target);
      lastTapAt = 0; lastTapTgt = null;
    } else {
      lastTapAt = now; lastTapX = t.clientX; lastTapY = t.clientY; lastTapTgt = e.target;
    }
  }, { passive: false });
  document.addEventListener('touchcancel', clear, { passive: true });
  // בליעת ה-click המזויף אחרי הפעלה, אחרת הוא סוגר מיד את התפריט או מפעיל טוגל
  document.addEventListener('click', e => { if (fired) { e.preventDefault(); e.stopPropagation(); fired = false; } }, true);
}
setupLongPress();

function readLeadForm(scope) {

  return { name: g('name'), phone: g('phone'), idnum: g('idnum'), mail: g('mail'), org: g('org'),
    entity: g('entity') || 'lead', journey: g('journey') || 'sales', source: g('source'), prio: g('prio') || 'medium', subject: g('subject') };

function findLeadDup(phone) { return RECORDS.find(r => r.phone && r.phone.replace(/\D/g, '') === (phone || '').replace(/\D/g, '')); }
function buildLeadRecord(v) {
  const flow = workflowFor(v.journey);

  return {
    id: Math.max(...RECORDS.map(r => r.id)) + 1,

}
function openNewRecord() {

  <script>
/* ============================================================
   CallBiz Manager – מסכי משנה (Views)
   הגדרות(15) · אוטומציות(16) · יומן רב-עובדים · מנוע workflow דינמי
   ============================================================ */

/* ---- רכיב Toggle ---- */
function toggle(on, attrs = '') {
  return `<span class="toggle ${on ? 'on' : ''}" ${attrs} role="switch" aria-checked="${on}"><i></i></span>`;
}
function bindToggles(scope) {
  $$('.toggle', scope || document).forEach(t => {
    if (t.hasAttribute('data-wh-toggle')) return;   // לימי עבודה יש handler משלהם
    t.addEventListener('click', () => {
      t.classList.toggle('on');
      toast(t.classList.contains('on') ? 'הופעל' : 'כובה');
    });
  });
}

/* ============================================================
   15. מסך הגדרות יומן
   ============================================================ */
let settingsEmp = 'yk';

/* --- מודל שעות עבודה הניתן לעריכה (ימים ידניים · הפסקות · פיצולים) --- */
const ALL_WEEK = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
/* מודל טיימליין עוקב: רצף מקטעים (משמרת/הפסקה) — התחלת כל מקטע = סוף הקודם */
let workSchedule = [
  { day: 'ראשון', on: true, segments: [
    { type: 'shift', start: '08:00', end: '13:00' },
    { type: 'break', start: '13:00', end: '13:30' },
    { type: 'shift', start: '13:30', end: '17:00' },
  ] },
  { day: 'שני',   on: true, segments: [{ type: 'shift', start: '08:00', end: '17:00' }] },
  { day: 'שלישי', on: true, segments: [{ type: 'shift', start: '08:00', end: '18:00' }] },
  { day: 'רביעי', on: true, segments: [{ type: 'shift', start: '08:00', end: '17:00' }] },
  { day: 'חמישי', on: true, segments: [{ type: 'shift', start: '08:00', end: '16:00' }] },
];
function addMin(hhmm, m) { const [h, mm] = hhmm.split(':').map(Number); let t = h * 60 + mm + m; t = ((t % 1440) + 1440) % 1440; return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); }
function relinkDay(d) { for (let k = 1; k < d.segments.length; k++) d.segments[k].start = d.segments[k - 1].end; }

function workHoursCard() {
  return `
    <section class="card set-card wide wh-card">
      <div class="card-head"><div class="title">${ic('clock')} שעות פעילות</div>
        <button class="btn sm" id="whAddDay">${ic('plus')} הוסף יום</button></div>
      <div class="set-body wh-body">
        ${workSchedule.length ? workSchedule.map((d, i) => whDayRow(d, i)).join('')
          : '<div class="muted" style="padding:8px">לא הוגדרו ימי עבודה. לחץ "הוסף יום".</div>'}
      </div>
    </section>`;
}
function whDayRow(d, i) {
  let shiftNo = 0;
  const segHTML = d.segments.map((s, si) => {
    const last = si === d.segments.length - 1;
    const isBreak = s.type === 'break';
    let label;
    if (isBreak) label = 'הפסקה';
    else { shiftNo++; label = shiftNo === 1 ? 'שעות עבודה' : 'משמרת'; }
    const startLocked = si > 0;   // התחלה = סוף הקודם (אוטומטי)
    return `
      <div class="seg ${s.type}">
        <span class="seg-lbl">${label}</span>
        <span class="seg-times">
          <input type="time" value="${s.start}" ${startLocked ? 'readonly' : ''} data-seg="${i}:${si}:start" title="${startLocked ? 'מתעדכן אוטומטית מסוף המקטע הקודם' : 'שעת התחלה'}">
          <span class="wh-sep">–</span>
          <input type="time" value="${s.end}" data-seg="${i}:${si}:end">
        </span>
        <span class="seg-actions">
          ${last ? `<button class="wh-add ${isBreak ? 'shift' : 'brk'}" data-seg-add="${i}">${ic('plus')} ${isBreak ? 'הוסף משמרת' : 'הפסקה'}</button>` : ''}
          ${si > 0 ? `<button class="wh-x" data-seg-del="${i}:${si}" title="הסר ${isBreak ? 'הפסקה' : 'משמרת'}">${ic('close')}</button>` : ''}
        </span>
      </div>`;
  }).join('');
  return `
    <div class="wh-day ${d.on ? '' : 'off'}">
      <div class="wh-day-head">
        <span class="toggle ${d.on ? 'on' : ''}" data-wh-toggle="${i}"></span>
        <b class="wh-name">${d.day}</b>
        <button class="wh-del" data-wh-delday="${i}" title="הסר יום">${ic('close')}</button>
      </div>
      <div class="wh-segs">${segHTML}</div>
    </div>`;
}
function durationsCard() {
  return `
    <section class="card set-card wide dur-card">
      <div class="card-head"><div class="title">${ic('calendar')} משכי תיאום ומרווחים</div></div>
      <div class="set-body">
        <table class="mini-table dur-table">
          <thead><tr><th>סוג</th><th>ברירת מחדל</th><th>מינ'</th><th>מקס'</th><th>הכנה</th><th>סיום</th></tr></thead>
          <tbody>${DURATIONS.map((d, i) => `<tr>
            <td><b>${d.type}</b></td>
            <td><span class="dur-in"><input value="${d.def}" data-dur="${i}:def"><em>דק'</em></span></td>
            <td><span class="dur-in"><input value="${d.min}" data-dur="${i}:min"></span></td>
            <td><span class="dur-in"><input value="${d.max}" data-dur="${i}:max"></span></td>
            <td><span class="dur-in"><input value="${d.prep}" data-dur="${i}:prep"><em>דק'</em></span></td>
            <td><span class="dur-in"><input value="${d.wrap}" data-dur="${i}:wrap"><em>דק'</em></span></td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </section>`;
}
function bindWorkHours() {
  $$('[data-wh-toggle]').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.whToggle; workSchedule[i].on = !workSchedule[i].on; renderSettingsView(); }));
  $$('[data-wh-delday]').forEach(b => b.addEventListener('click', () => { workSchedule.splice(+b.dataset.whDelday, 1); renderSettingsView(); }));

  // הוספת מקטע – משמרת אם האחרון הפסקה, אחרת הפסקה. התחלה = סוף המקטע האחרון
  $$('[data-seg-add]').forEach(b => b.addEventListener('click', () => {
    const d = workSchedule[+b.dataset.segAdd];
    const last = d.segments[d.segments.length - 1];
    if (last.type === 'break') d.segments.push({ type: 'shift', start: last.end, end: addMin(last.end, 120) });
    else d.segments.push({ type: 'break', start: last.end, end: addMin(last.end, 30) });
    renderSettingsView();
  }));
  // הסרת מקטע (רק לא-ראשון) + קישור מחדש
  $$('[data-seg-del]').forEach(b => b.addEventListener('click', () => {
    const [i, si] = b.dataset.segDel.split(':').map(Number);
    workSchedule[i].segments.splice(si, 1); relinkDay(workSchedule[i]); renderSettingsView();
  }));
  // עריכת זמן – סיום מקטע מקשר להתחלת הבא; רינדור מחדש כדי לשקף
  $$('[data-seg]').forEach(inp => inp.addEventListener('change', () => {
    const [i, si, field] = inp.dataset.seg.split(':');
    const d = workSchedule[+i], seg = d.segments[+si];
    seg[field] = inp.value;
    if (field === 'end') relinkDay(d);
    else if (+si === 0) relinkDay(d);
    renderSettingsView();
  }));

  const add = $('#whAddDay'); if (add) add.addEventListener('click', () => showDayPicker(add));
  $$('[data-dur]').forEach(inp => inp.addEventListener('change', () => { const [i, key] = inp.dataset.dur.split(':'); DURATIONS[+i][key] = inp.value; }));
}
function sortSchedule() { workSchedule.sort((a, b) => ALL_WEEK.indexOf(a.day) - ALL_WEEK.indexOf(b.day)); }
function showDayPicker(anchor) {
  closeDayPicker();
  const used = workSchedule.map(d => d.day);
  const missing = ALL_WEEK.filter(d => !used.includes(d));
  if (!missing.length) { toast('כל ימי השבוע כבר קיימים'); return; }
  const pop = document.createElement('div');
  pop.className = 'day-pop'; pop.id = 'dayPop';
  pop.innerHTML = `<div class="day-pop-title">בחר יום להוספה</div>${missing.map(d => `<button data-addday="${d}">${d}</button>`).join('')}`;
  document.body.appendChild(pop);
  const rc = anchor.getBoundingClientRect();
  pop.style.top = `${rc.bottom + 5}px`;
  pop.style.right = `${window.innerWidth - rc.right}px`;
  $$('[data-addday]', pop).forEach(b => b.addEventListener('click', () => {
    workSchedule.push({ day: b.dataset.addday, on: true, segments: [{ type: 'shift', start: '08:00', end: '17:00' }] });
    sortSchedule();               // הכנסה בסדר הימים התקין
    closeDayPicker(); renderSettingsView();

  setTimeout(() => document.addEventListener('click', dayPickerOutside), 0);
}
function dayPickerOutside(e) { if (!e.target.closest('#dayPop') && !e.target.closest('#whAddDay')) closeDayPicker(); }

let mgrMode = false;

/* --- בקשות שדות מהשטח: מרוכזות (דדופ), אישור גורף / נקודתי / דחייה --- */

function bindFieldRequests() {

function renderSettingsView() {

function bindEmpProfile() {
  const emp = STAFF.find(s => s.id === settingsEmp); if (!emp) return;
  const av = $('#empAvail'); if (av) av.addEventListener('change', () => { emp.avail = av.value; renderSettingsView(); });
  const toggleIn = (arr, val) => { const i = arr.indexOf(val); i >= 0 ? arr.splice(i, 1) : arr.push(val); };
  $$('[data-occ]').forEach(b => b.addEventListener('click', () => { toggleIn(emp.occ, b.dataset.occ); renderSettingsView(); }));
  $$('[data-resp]').forEach(b => b.addEventListener('click', () => { toggleIn(emp.resp, b.dataset.resp); renderSettingsView(); }));
  $$('[data-skill]').forEach(b => b.addEventListener('click', () => { emp.skills = emp.skills || []; toggleIn(emp.skills, b.dataset.skill); syncCoordStaff(); renderSettingsView(); }));
  $$('[data-empbranch]').forEach(b => b.addEventListener('click', () => { emp.branches = emp.branches || []; toggleIn(emp.branches, b.dataset.empbranch); emp.branch = emp.branches[0] || emp.branch; syncCoordStaff(); renderSettingsView(); }));
}

const HEB_DAY_LETTERS = ['א', 'ב', 'ג', 'ד', 'ה', 'ו', 'ש'];

const BRANCH_REGION_ORD = { 'חיפה': 1, 'הרצליה': 2, 'תל אביב': 3, 'מודיעין': 4, 'ירושלים': 5, 'באר שבע': 6 };
function branchStaff(bk) { return STAFF.filter(s => (s.branches || [s.branch]).includes(bk)); }
function sortedBranches() {
  const arr = [...COORD_BRANCHES];
  if (branchSort === 'region') return arr.sort((a, b) => branchOrd(a) - branchOrd(b));   // צפון→אילת לפי נתוני הערים
  return arr.sort((a, b) => a.label.localeCompare(b.label, 'he'));
}

const HEB_MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const HEB_DAYS   = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const HEB_DAYS_S = ['א','ב','ג','ד','ה','ו','ש'];
const DEMO_DAY   = '2024-05-22';           // היום עם אירועי הדמו
/* צפיפות אירועים לחודש (למראה חי) */
const MONTH_DENSITY = { '2024-05-20': 3, '2024-05-21': 2, '2024-05-22': 11, '2024-05-23': 4, '2024-05-27': 2, '2024-05-28': 5, '2024-05-30': 3 };

let calMode = 'day';
let calDate = new Date(2024, 4, 22);       // 22 במאי 2024
let calSelSlot = null;
let calManagerView = false;                // מנהל ראשי — פירוט מלא בכל היומנים
let calMoveEv = null;                      // מצב הזזת אירוע — {owner, ev}
let calRerender = null;                    // רינדור מחדש של היומן הפעיל (מסך/מודל)
const calCanSee = (owner) => calManagerView || owner === CURRENT_USER;

function fmtH(h) { const hh = Math.floor(h), mm = Math.round((h - hh) * 60); return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`; }
function dkey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function startOfWeek(d) { const x = new Date(d); x.setDate(x.getDate() - x.getDay()); return x; } // ראשון
function calLabel() {
  if (calMode === 'day')   return `יום ${HEB_DAYS[calDate.getDay()]}, ${calDate.getDate()} ${HEB_MONTHS[calDate.getMonth()]} ${calDate.getFullYear()}`;
  if (calMode === 'week')  { const s = startOfWeek(calDate), e = addDays(s, 6);
    return `${s.getDate()} – ${e.getDate()} ${HEB_MONTHS[e.getMonth()]} ${e.getFullYear()}`; }
  return `${HEB_MONTHS[calDate.getMonth()]} ${calDate.getFullYear()}`;
}
function calShift(dir) {
  if (calMode === 'day')   calDate = addDays(calDate, dir);
  else if (calMode === 'week') calDate = addDays(calDate, dir * 7);
  else calDate = new Date(calDate.getFullYear(), calDate.getMonth() + dir, 1);
}

function bindCalFull(scope, rerender) {
  calRerender = rerender;
  const sm = $('[data-cal-smart]', scope);
  if (sm) sm.addEventListener('click', () => openScheduleModal(RECORDS[0]));

    ${CAL_OWNERS.map(o => `<div class="mcal-owner">${o}</div>`).join('')}
    ${hours.map(h => `
      <div class="mcal-hour">${String(h).padStart(2,'0')}:00</div>
      ${CAL_OWNERS.map(o => {
        const evs = isDemo ? (CAL_EVENTS[o] || []).filter(e => Math.floor(e.h) === h) : [];
        if (evs.length) return `<div class="mcal-cell filled">${evs.map(ev => calEvHTML(ev, false, o)).join('')}</div>`;
        if (isDemo && (h + 1) * 60 <= nowHM()) return `<div class="mcal-cell past" title="השעה עברה — אין קביעה בהיסטוריה"></div>`;
        return `<div class="mcal-cell slot-free ${calMoveEv ? 'move-target' : ''}" data-o="${o}" data-h="${h}" data-d="${dkey(calDate)}"></div>`;
      }).join('')}
    `).join('')}
  </div>`;
}

/* ---- תצוגת שבוע: 7 ימים × שעות ---- */
function calWeekHTML() {
  const hours = []; for (let h = 8; h <= 18; h++) hours.push(h);
  const s = startOfWeek(calDate);
  const days = Array.from({length: 7}, (_, i) => addDays(s, i));
  return `<div class="mcal" style="grid-template-columns:56px repeat(7, 1fr)">
    <div class="mcal-corner"></div>
    ${days.map(d => `<div class="mcal-owner ${dkey(d)===DEMO_DAY?'is-today':''}">${HEB_DAYS_S[d.getDay()]}<small>${d.getDate()}/${d.getMonth()+1}</small></div>`).join('')}
    ${hours.map(h => `
      <div class="mcal-hour">${String(h).padStart(2,'0')}:00</div>
      ${days.map(d => {
        const evs = dkey(d) === DEMO_DAY ? (CAL_EVENTS[CURRENT_USER] || []).filter(e => Math.floor(e.h) === h) : [];
        if (evs.length) return `<div class="mcal-cell filled">${evs.map(ev => calEvHTML(ev, true, CURRENT_USER)).join('')}</div>`;
        if (dkey(d) === DEMO_DAY && (h + 1) * 60 <= nowHM()) return `<div class="mcal-cell past" title="השעה עברה — אין קביעה בהיסטוריה"></div>`;
        return `<div class="mcal-cell slot-free" data-o="${HEB_DAYS[d.getDay()]}" data-h="${h}" data-d="${dkey(d)}"></div>`;
      }).join('')}
    `).join('')}
  </div>`;
}

/* ---- תצוגת חודש: רשת ---- */
function calMonthHTML() {
  const first = new Date(calDate.getFullYear(), calDate.getMonth(), 1);
  const gridStart = addDays(first, -first.getDay());
  const cells = Array.from({length: 42}, (_, i) => addDays(gridStart, i));
  return `<div class="mo-grid">
    ${HEB_DAYS_S.map(d => `<div class="mo-head">${d}</div>`).join('')}
    ${cells.map(d => {
      const inMonth = d.getMonth() === calDate.getMonth();
      const k = dkey(d), cnt = MONTH_DENSITY[k] || 0, today = k === DEMO_DAY;
      return `<div class="mo-cell ${inMonth?'':'out'} ${today?'today':''}" data-d="${k}">
        <span class="mo-num">${d.getDate()}</span>
        ${cnt ? `<div class="mo-dots">${Array.from({length: Math.min(cnt,4)}, () => '<i></i>').join('')}${cnt>4?`<span>+${cnt-4}</span>`:''}</div>
          <div class="mo-cnt">${cnt} אירועים</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

/* אירוע יומן – שם ליד לחיץ + חפיפה (רוחב מצומצם, שורה אחת)
   הרשאות: יומן של עובד אחר מוצג כ"תפוס" בלבד, אלא אם תצוגת מנהל ראשי */
function calEvHTML(ev, weekMode, owner) {
  const time = weekMode ? fmtH(ev.h) : `${fmtH(ev.h)}–${fmtH(ev.h + ev.dur)}`;
  if (owner && !calCanSee(owner)) {
    return `<div class="mcal-ev busy" style="min-height:${ev.dur * 40}px" title="פרטי האירוע חסויים · יומן של ${owner}">
      <span class="ev-t">תפוס</span><small>${time}</small></div>`;
  }
  return `<div class="mcal-ev ${ev.c} ${ev.recId ? 'link' : ''}" data-t="${ev.t}" data-owner="${owner || ''}" ${ev.recId ? `data-rec="${ev.recId}" title="פנייה מקושרת: ${ev.t}"` : ''} style="min-height:${ev.dur * 40}px">
    <span class="ev-t">${ev.t}</span><small>${time}</small></div>`;
}
/* בחירת זמן בתא שעה — לפי דיוק התזמון מההגדרות (התצוגה נשארת שעתית) */
function pickCalSlot(cell) {
  if (calMoveEv) return moveCalEvent(cell);
  const step = CAL_STEP.minutes;
  if (step >= 60) return selectCalTime(cell, `${String(cell.dataset.h).padStart(2, '0')}:00`);
  showMinutePicker(cell, step);
}
function selectCalTime(cell, time) {
  closeMinutePicker();
  $$('.slot-free.sel').forEach(x => { x.classList.remove('sel'); x.innerHTML = ''; });
  cell.classList.add('sel');
  calSelSlot = { o: cell.dataset.o, h: cell.dataset.h, d: cell.dataset.d, time };
  cell.innerHTML = `<div class="slot-pick">${ic('plus')} ${time}</div>`;
  openSlotCreateModal();
}

/* ---- הזזת אירוע קיים למשבצת פנויה ---- */
function moveCalEvent(cell) {
  const { owner, ev } = calMoveEv;
  const newOwner = CAL_OWNERS.includes(cell.dataset.o) ? cell.dataset.o : owner;
  const list = CAL_EVENTS[owner];
  const i = list.indexOf(ev); if (i > -1) list.splice(i, 1);
  ev.h = +cell.dataset.h;
  (CAL_EVENTS[newOwner] = CAL_EVENTS[newOwner] || []).push(ev);
  calMoveEv = null;
  if (calRerender) calRerender();
  toast(`"${ev.t}" הוזז ל־${fmtH(ev.h)} · ${newOwner} ✓ הודעת עדכון נשלחה ללקוח`);
}

/* ---- פופאובר פנייה מקושרת מתוך היומן ---- */

function closeEvPopover() { $('#evPop')?.remove(); document.removeEventListener('click', evPopOutside); }

/* ---- קביעה חדשה במשבצת פנויה: שיוך לליד / לקוח / אירוע / חסימה ---- */
function openSlotCreateModal() {
  const s = calSelSlot; if (!s) return;
  const [y, m, dd] = s.d.split('-');
  $('#modal').style.maxWidth = '540px'; $('#modal').style.height = '';
  const head = `<div class="modal-head"><div class="title"><span class="num">4</span> קביעה חדשה · ${dd}/${m} · ${s.time} · ${s.o}</div>
    <button class="close-btn" id="closeModal">${ic('close')}</button></div>`;
  const renderTypes = () => {
    $('#modal').innerHTML = `${head}<div class="modal-body">
      <p class="hint" style="margin-top:0">${ic('alert')} בחר מה לקבוע במשבצת — הפנייה או האירוע ישויכו ליומן של ${s.o}</p>
      <div class="slot-type-grid">
        <button data-st="lead">${ic('lead')}<b>פגישה לליד</b><small>שיוך פנייה קיימת של ליד / מתעניין</small></button>
        <button data-st="customer">${ic('customer')}<b>תור ללקוח</b><small>שירות, טיפול או תור ללקוח קיים</small></button>
        <button data-st="event">${ic('calendar')}<b>אירוע פנימי</b><small>ישיבה, הדרכה או משימה פנימית</small></button>
        <button data-st="block">${ic('pause')}<b>חסימת זמן</b><small>הפסקה / לא זמין לקביעות</small></button>
      </div>
      <div id="slotStep2"></div></div>`;
    $('#closeModal').addEventListener('click', () => { calSelSlot = null; closeModal(); });
    $$('#modal [data-st]').forEach(b => b.addEventListener('click', () => {
      $$('#modal [data-st]').forEach(x => x.classList.toggle('on', x === b));
      renderStep2(b.dataset.st);
    }));
  };
  const renderStep2 = (type, q = '') => {
    const host = $('#slotStep2');
    if (type === 'block') {
      addCalEvent({ h: +s.h, dur: 1, t: 'חסום – לא זמין', c: 'gray' });
      return;
    }
    if (type === 'event') {
      host.innerHTML = `<div class="sc-form">

        <button class="btn sm primary" id="scSave">${ic('check')} קבע אירוע</button></div>`;
      $('#scSave').addEventListener('click', () => {
        const t = $('#scTitle').value.trim() || 'אירוע פנימי';
        addCalEvent({ h: +s.h, dur: +$('#scDur').value, t, c: 'blue' });
      });
      return;
    }
    const isLead = type === 'lead';
    const recs = RECORDS.filter(r => isLead ? ['lead', 'prospect'].includes(r.entity) : ['customer', 'former'].includes(r.entity))
      .filter(r => !q || r.name.includes(q) || (r.phone || '').includes(q));
    host.innerHTML = `
      <input class="sc-input" id="scSearch" placeholder="חיפוש לפי שם או טלפון…" value="${q}">
      <div class="sc-list">${recs.length ? recs.map(r => `
        <div class="sc-item" data-rec="${r.id}">
          <b>${r.name}</b>
          <span class="badge ${JOURNEY_TYPES[r.journey].color}">${JOURNEY_TYPES[r.journey].label}</span>
          <span class="chip ${r.status.color} sm">${r.status.label}</span>
          <small class="muted">${r.phone || ''}</small>
        </div>`).join('') : `<div class="sc-empty">לא נמצאו רשומות מתאימות</div>`}</div>`;
    const inp = $('#scSearch');
    inp.addEventListener('input', () => renderStep2(type, inp.value.trim()));
    inp.focus(); inp.setSelectionRange(q.length, q.length);
    $$('#modal .sc-item').forEach(el => el.addEventListener('click', () => {
      const r = RECORDS.find(x => x.id === +el.dataset.rec);
      addCalEvent({ h: +s.h, dur: .5, t: `${r.name} – ${isLead ? 'פגישה' : 'תור'}`, c: isLead ? 'green' : 'orange', recId: r.id });
    }));
  };
  const addCalEvent = (ev) => {
    const owner = CAL_OWNERS.includes(s.o) ? s.o : CURRENT_USER;
    (CAL_EVENTS[owner] = CAL_EVENTS[owner] || []).push(ev);
    calSelSlot = null;
    closeModal();
    if (calRerender) calRerender();
    toast(`נקבע: "${ev.t}" · ${fmtH(ev.h)} · ${owner} ✓${ev.recId ? ' הפנייה קושרה ליומן' : ''}`);
  };
  renderTypes();
  $('#modalWrap').classList.add('open');
}
function showMinutePicker(cell, step) {
  closeMinutePicker();
  const h = +cell.dataset.h;
  const isToday = cell.dataset.d === DEMO_DAY;
  const times = [];
  for (let m = 0; m < 60; m += step) {
    if (isToday && h * 60 + m <= nowHM()) continue;   // אין דקות שעברו
    times.push(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`);
  }
  if (!times.length) { toast('כל הדקות בשעה זו עברו'); return; }
  const pop = document.createElement('div');
  pop.className = 'minute-pop'; pop.id = 'minutePop';
  pop.innerHTML = `<div class="mp-title">${String(h).padStart(2, '0')}:00–${String(h + 1).padStart(2, '0')}:00 · בחר התחלה</div>
    <div class="mp-grid cols-${step <= 5 ? 4 : step <= 15 ? 3 : 2}">${times.map(t => `<button data-mp="${t}">${t}</button>`).join('')}</div>`;
  document.body.appendChild(pop);
  const rc = cell.getBoundingClientRect();
  let top = rc.bottom + 5, left = rc.left;
  if (top + pop.offsetHeight > window.innerHeight - 10) top = rc.top - pop.offsetHeight - 5;
  if (left + pop.offsetWidth > window.innerWidth - 10) left = window.innerWidth - pop.offsetWidth - 10;
  pop.style.top = `${Math.max(8, top)}px`; pop.style.left = `${Math.max(8, left)}px`;
  $$('[data-mp]', pop).forEach(b => b.addEventListener('click', e => { e.stopPropagation(); selectCalTime(cell, b.dataset.mp); }));
  setTimeout(() => document.addEventListener('click', mpOutside), 0);
}
function mpOutside(e) { if (!e.target.closest('#minutePop')) closeMinutePicker(); }
function closeMinutePicker() { const p = $('#minutePop'); if (p) p.remove(); document.removeEventListener('click', mpOutside); }

/* עריכה גורפת של מסלולים ושלבים — מעדכן ישירות את WORKFLOWS ו-JOURNEY_TYPES */
function bindWfEdit() {
  const et = $('[data-wfedit]'); if (et) et.addEventListener('click', () => { wfEdit = !wfEdit; renderDynamicView(); });
  const pair = v => { const [j, i] = v.split('|'); return [j, +i]; };
  $$('[data-wfup]').forEach(b => b.addEventListener('click', () => { const [j, i] = pair(b.dataset.wfup); const a = WORKFLOWS[j]; [a[i - 1], a[i]] = [a[i], a[i - 1]]; renderDynamicView(); }));
  $$('[data-wfdn]').forEach(b => b.addEventListener('click', () => { const [j, i] = pair(b.dataset.wfdn); const a = WORKFLOWS[j]; [a[i + 1], a[i]] = [a[i], a[i + 1]]; renderDynamicView(); }));
  $$('[data-wfrm]').forEach(b => b.addEventListener('click', () => { const [j, i] = pair(b.dataset.wfrm); if (WORKFLOWS[j].length <= 1) { toast('חייב להישאר שלב אחד'); return; } WORKFLOWS[j].splice(i, 1); renderDynamicView(); toast('השלב הוסר מכל המערכת'); }));
  $$('[data-wfadd]').forEach(b => b.addEventListener('click', () => { const j = b.dataset.wfadd, inp = $(`[data-wfaddinp="${j}"]`), t = (inp && inp.value || '').trim(); if (!t) { toast('הזן שם שלב'); return; } WORKFLOWS[j].push({ key: 'st' + (wfKeySeq++), title: t }); renderDynamicView(); toast('שלב נוסף'); }));
  $$('[data-wfrename]').forEach(inp => inp.addEventListener('change', () => { const j = inp.dataset.wfrename; if (JOURNEY_TYPES[j]) JOURNEY_TYPES[j].label = inp.value.trim() || JOURNEY_TYPES[j].label; }));
  $$('[data-wfrmroute]').forEach(b => b.addEventListener('click', () => { const j = b.dataset.wfrmroute; if (Object.keys(WORKFLOWS).length <= 1) { toast('חייב להישאר מסלול אחד'); return; } delete WORKFLOWS[j]; renderDynamicView(); toast('המסלול הוסר מכל המערכת'); }));
  const ar = $('[data-wfaddroute]'); if (ar) ar.addEventListener('click', () => {
    const inp = $('[data-wfnewroute]'), t = (inp && inp.value || '').trim(); if (!t) { toast('הזן שם מסלול'); return; }
    const key = 'route' + (wfKeySeq++);
    WORKFLOWS[key] = [{ key: 'st' + (wfKeySeq++), title: 'קליטת פנייה' }, { key: 'st' + (wfKeySeq++), title: 'יצירת קשר' }, { key: 'close', title: 'סגירה' }];
    JOURNEY_TYPES[key] = { label: t, color: 'blue' };
    renderDynamicView(); toast(`מסלול "${t}" נוצר`);
  });
}

/* ---- קנבן תהליך-על: גרירה בין טורים = מעבר שלב ---- */
let kbDragging = false;
function bindMetaKanban() {
  $$('.kb-card').forEach(c => {
    c.addEventListener('dragstart', e => {
      kbDragging = true;
      e.dataTransfer.setData('text/plain', c.dataset.kbrec);
      e.dataTransfer.effectAllowed = 'move';
      c.classList.add('dragging');
    });
    c.addEventListener('dragend', () => { c.classList.remove('dragging'); setTimeout(() => kbDragging = false, 50); });
    c.addEventListener('click', () => { if (kbDragging) return; const r = RECORDS.find(x => x.id === +c.dataset.kbrec); if (r) openDrawer(r); });
  });
  $$('.kb-col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; col.classList.add('over'); });
    col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('over'); });
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('over');
      const id = +e.dataTransfer.getData('text/plain');
      moveRecordToMeta(id, col.dataset.kbcol);
    });
  });
}
function moveRecordToMeta(id, metaKey) {
  const r = RECORDS.find(x => x.id === id); if (!r) return;
  const metaTitle = META_STAGES.find(m => m.key === metaKey).title;
  if ((r.done ? 'close' : metaOf(r.stageKey)) === metaKey) return;   // אותו טור
  const flow = workflowFor(r.journey);
  const target = flow.find(s => metaOf(s.key) === metaKey);
  if (!target) { toast(`למסלול "${JOURNEY_TYPES[r.journey].label}" אין שלב מסוג "${metaTitle}"`); return; }
  r.stageKey = target.key;
  r.objective = target.objective || r.objective;
  if (metaKey === 'close') { r.done = true; r.overdue = false; r.status = { label: 'נסגרה', color: 'green' }; r.next = { type: 'none', at: '—' }; }
  else { r.done = false; if (r.status.label === 'נסגרה') r.status = { label: 'בטיפול', color: 'blue' }; }
  renderDynamicView();
  toast(`${r.name} הועבר ל"${metaTitle}" (${target.title}) ✓`);
}

  <script>
/* ============================================================
   CallBiz Manager – לוח תיאום חי (Live Coordination Board)
   ממשק תיאום תוך כדי שיחה: קריטריונים דינמיים → תוצאות בזמן אמת
   ============================================================ */

/* ---- עזרי חיפוש ---- */
const cDoc    = k => COORD_DOCTORS.find(d => d.key === k);
const cBranch = k => COORD_BRANCHES.find(b => b.key === k);
const cTreat  = k => COORD_TREATMENTS.find(t => t.key === k);
const cDayLbl = date => { const d = COORD_DAYS.find(x => x.date === date); const dd = new Date(date + 'T00:00:00');
  return `${date === COORD_TODAY ? 'היום' : ''} ${HEB_DAYS_S[dd.getDay()]}׳ ${dd.getDate()}/${dd.getMonth() + 1}`.trim(); };

/* ---- מאגר משבצות דמו (דטרמיניסטי) ---- */
function coordBuildPool() {
  const pool = []; let idx = 0;
  COORD_DOCTORS.forEach((doc, di) => COORD_DAYS.forEach((day, dyi) => {
    for (let h = 8; h < 18; h++) {
      const branch = coordBranchAt(doc, h);
      if (!branch) continue;                              // הפסקה / לא נמצא בסניף באותה שעה
      const seed = di * 31 + dyi * 7 + h;
      if (seed % 5 === 2) continue;                       // פערים טבעיים ביומן
      const pick = COORD_TREATMENTS[seed % COORD_TREATMENTS.length];
      const tKey = doc.skills.includes(pick.key) ? pick.key : doc.skills[seed % doc.skills.length];
      const tr = cTreat(tKey);
      pool.push({ id: 'sl' + (idx++), doc: doc.key, branch: branch, date: day.date, dow: day.dow,
        h: h + ((seed % 2) ? 0.5 : 0), dur: tr.dur / 60, treatment: tKey, booked: seed % 3 === 0 });
    }
  }));
  return pool;
}
function coordPool() { return (window.__coordPool = window.__coordPool || coordBuildPool()); }

/* מועד שעבר — לא ניתן לקבוע תור לתאריך/שעה שכבר חלפו (nowHM = הזמן הנוכחי) */
function coordIsPast(s) {
  if (s.date < COORD_TODAY) return true;
  if (s.date === COORD_TODAY && s.h * 60 <= nowHM()) return true;
  return false;
}
function coordDayFullyPast(date) {
  return date < COORD_TODAY || (date === COORD_TODAY && nowHM() >= 17 * 60 + 30);
}

/* ---- מצב הלוח ---- */
let coordState = null;
function coordInit() {
  const startDate = (COORD_DAYS.find(d => !coordDayFullyPast(d.date)) || COORD_DAYS[COORD_DAYS.length - 1]).date;
  coordState = {
    branches: new Set(COORD_BRANCHES.filter(b => b.on).map(b => b.key)),
    doctors:  new Set(COORD_DOCTORS.filter(d => d.on).map(d => d.key)),
    treatments: new Set(['consult', 'followup']),
    gender: 'any', durMin: 15, durMax: 120,
    dateFrom: '2024-05-23', dateTo: '2024-05-30',
    days: new Set([0, 1, 2, 3, 4]), hourStart: 8, hourEnd: 20,
    onlyAvailable: false, view: 'day', date: startDate, panelTab: 'lead',

    caller: null,

    leadSearch: '',   // חיפוש ליד/לקוח קיים למעלה בפאנל
    topSearch: '',    // חיפוש ליד/לקוח בסרגל העליון של הלוח

    critOpen: new Set(['branches', 'treatments']),   // קטגוריות אקורדיון פתוחות
    adv: { equip: true, eligibility: true, approval: true },   // אפשרויות מתקדמות (כמו בלידים)

}

/* ---- כלל ההתאמה מההגדרות: סניף פעיל, תומך בטיפול, ופתוח באותו יום/שעה ---- */
function coordBranchOK(s) {
  const br = cBranch(s.branch);
  if (!br) return false;
  if (br.active === false) return false;
  if (br.treatments && !br.treatments.includes(s.treatment)) return false;
  if (br.days && !br.days.includes(s.dow)) return false;
  if (br.from != null && (s.h < br.from || s.h >= br.to)) return false;
  return true;
}
/* ---- התאמת משבצת לקריטריונים ---- */
function coordMatch(s) {
  const st = coordState, doc = cDoc(s.doc);
  if (coordIsPast(s)) return false;                // מועד שעבר אינו זמין
  if (!coordBranchOK(s)) return false;             // כלל ההתאמה מההגדרות
  if (!st.branches.has(s.branch)) return false;
  if (!st.doctors.has(s.doc)) return false;
  if (!st.treatments.has(s.treatment)) return false;
  if (st.gender !== 'any' && doc.gender !== st.gender) return false;
  if (!st.adv.approval && cTreat(s.treatment).approval) return false;
  if (!st.days.has(s.dow)) return false;
  if (s.h < st.hourStart || s.h >= st.hourEnd) return false;
  const dm = Math.round(s.dur * 60);
  if (dm < st.durMin || dm > st.durMax) return false;
  if (s.date < st.dateFrom || s.date > st.dateTo) return false;
  return true;
}
function coordAvailable() {
  return coordPool().filter(s => !s.booked && coordMatch(s))

}

/* גלילת כותרת הקטגוריה שנפתחה לראש אזור-הגלילה — כדי שיהיה מקסימום מקום לתוכן מתחת */
function scrollCritHeadTop(key) {
  const head = document.querySelector(`[data-critacc="${key}"]`);
  if (!head) return;
  let sc = head.parentElement;
  while (sc && sc !== document.body) {
    const oy = getComputedStyle(sc).overflowY;
