.ad-occ { background: oklch(98.5% 0.004 250); border: 1px solid oklch(93% 0.006 250); border-radius: 9px; padding: 9px 11px; margin-bottom: 6px !important; }

/* ============================================================
   CallBiz Manager – v17: תיקון טאבים + תהליך-על

/* ---- מסכים קטנים: הסרגל הימני נגלל במקום להיחתך ---- */

  scrollbar-width: thin; padding-bottom: 6px; }

  .topbar { padding: 8px 16px; }

}

/* ---- תיקון: הטאבים לא נשברים לשורות ---- */

.proc-tabs { overflow-x: auto; scrollbar-width: none; min-width: 0; }
.proc-tabs::-webkit-scrollbar { display: none; }
.proc-seg { flex-shrink: 0; }
.proc-seg .proc-tab { white-space: nowrap; flex-shrink: 0; padding: 7px 13px; font-size: 12px; }
.page-title { flex-shrink: 0; }
@media (max-width: 1450px) {
  .search { width: 140px; }
  .proc-seg .proc-tab { padding: 7px 10px; font-size: 11.5px; }

}

/* ---- צינור תהליך-על ---- */
.meta-pipe { display: flex; align-items: stretch; gap: 4px; padding: 18px 16px; overflow-x: auto; }
.meta-stage { flex: 1; min-width: 96px; display: flex; flex-direction: column; align-items: center; gap: 6px;
  border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: 13px 8px;
  font-family: inherit; cursor: pointer; transition: .15s; position: relative; }
.meta-stage:hover { border-color: var(--brand-soft); }

  display: flex; align-items: center; justify-content: center; }

  font-size: 12px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 7px; }
.ms-count.zero { background: var(--border-2); color: var(--text-3); }
.meta-arrow { display: flex; align-items: center; color: var(--text-3); flex-shrink: 0; }
.meta-arrow svg { width: 16px; height: 16px; }

.meta-recs { border-top: 1px solid var(--border-2); padding: 12px 16px; }
.mr-title { font-size: 12.5px; font-weight: 800; color: var(--text-2); margin-bottom: 9px; }
.mr-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: right; font-family: inherit; cursor: pointer;
  border: 1px solid var(--border-2); background: var(--surface); border-radius: 10px; padding: 9px 13px; margin-bottom: 6px; }
.mr-row:hover { border-color: var(--brand-soft); background: var(--brand-soft-2); }
.mr-row b { font-size: 13px; }
.mr-stage { font-size: 12px; color: var(--text-2); flex: 1; }
.mr-next { font-size: 11.5px; white-space: nowrap; }

/* מיפוי מסלולים */

/* ---- קנבן תהליך-על ---- */
.meta-kb { display: flex; gap: 10px; padding: 14px; overflow-x: auto; align-items: flex-start; }
.kb-col { flex: 0 0 190px; background: var(--surface-2); border: 1px solid var(--border-2); border-radius: var(--radius);
  display: flex; flex-direction: column; min-height: 180px; transition: .15s; }

.kb-top { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.kb-top b { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.kb-stage { font-size: 11px; color: var(--text-2); margin-top: 3px; }

  border: 1.5px dashed var(--border); border-radius: 9px; min-height: 70px; }

/* ============================================================
   צפיית מנהל (Shadow View) — הצ'אט מהעין של הנציג
   ============================================================ */

function nowHM() { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
function hmToMin(hhmm) { const [a, b] = String(hhmm).split(':').map(Number); return a * 60 + (b || 0); }
function minToHM(m) { m = Math.max(0, m); return `${String(Math.floor(m / 60) % 24).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`; }
function rangeStartMin(range) { return hmToMin(String(range).split('-')[0].trim()); }   // "09:00 - 10:00"
function isPastToday(hhmmOrRange) { return rangeStartMin(hhmmOrRange) <= nowHM(); }

  if (!r.contacts) r.contacts = [{ name: r.name, role: 'איש קשר ראשי', phone: r.phone || '', mail: r.mail || '', primary: true }];

  const p = contactsFor(r).find(c => c.primary) || contactsFor(r)[0];

}

function prioTag(p) {
  const m = { high: ['גבוהה','red'], medium: ['בינונית','amber'], low: ['נמוכה','gray'] };

function nextCell(r) {

/* ---------------- טבלה ראשית ---------------- */
/* פרדיקטים משותפים – משמשים גם לספירת הכרטיסים וגם לסינון (כדי שהמספרים תמיד יתאימו) */
const FILTERS = {
  today_meetings: r => ['meeting', 'remind'].includes(r.next?.type) && !r.done,
  today_followup: r => r.next?.type === 'followup' && !r.done,
  overdue:        r => !!r.overdue,
  week_meetings:  r => ['sales', 'upsell', 'appointment', 'renewal'].includes(r.journey),
  done:           r => !!r.done,
  new_leads:      r => r.entity === 'lead' && ['intake', 'assign', 'contactinfo', 'contact'].includes(r.stageKey) && !r.done,
  open_service:   r => ['support', 'billing', 'complaint', 'general'].includes(r.journey) && !r.done,
  pending_appt:   r => !!r.pendingApproval,
  no_next:        r => !r.next || r.next.type === 'none',
};
function cardCount(key) { return FILTERS[key] ? RECORDS.filter(FILTERS[key]).length : 0; }
function filteredRecords() {
  let rows = RECORDS;
  if (activeFilter && FILTERS[activeFilter]) rows = rows.filter(FILTERS[activeFilter]);
  if (listFilters.status)   rows = rows.filter(r => r.status.label === listFilters.status);
  if (listFilters.journey)  rows = rows.filter(r => JOURNEY_TYPES[r.journey].label === listFilters.journey);
  if (listFilters.assignee) rows = rows.filter(r => r.assignee === listFilters.assignee);
  return rows;
}
/* --- תפריטי סינון בטולבר --- */
function filterOptions(type) {
  const uniq = a => [...new Set(a)];
  if (type === 'status')   return ['כל הסטטוסים', ...uniq(RECORDS.map(r => r.status.label))];
  if (type === 'journey')  return ['כל המסלולים', ...uniq(RECORDS.map(r => JOURNEY_TYPES[r.journey].label))];
  if (type === 'assignee') return ['כל הנציגים', ...uniq(RECORDS.map(r => r.assignee).filter(a => a && a !== '—'))];
  return [];
}
function openFilterMenu(anchor, type) {
  closeFilterMenu();
  const opts = filterOptions(type);
  const cur = listFilters[type];
  const pop = document.createElement('div');
  pop.className = 'filter-menu'; pop.id = 'filterMenu';
  pop.innerHTML = opts.map((o, i) => `<button data-i="${i}" class="${(i === 0 && !cur) || cur === o ? 'on' : ''}">${o}</button>`).join('');
  document.body.appendChild(pop);
  const rc = anchor.getBoundingClientRect();
  pop.style.top = `${rc.bottom + 5}px`;
  pop.style.right = `${window.innerWidth - rc.right}px`;
  $$('button', pop).forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.i;
    listFilters[type] = i === 0 ? null : opts[i];
    closeFilterMenu(); renderUnifiedView();
  }));
  setTimeout(() => document.addEventListener('click', filterOutside), 0);
}
function filterOutside(e) { if (!e.target.closest('#filterMenu') && !e.target.closest('[data-filter]')) closeFilterMenu(); }
function closeFilterMenu() { const p = $('#filterMenu'); if (p) p.remove(); document.removeEventListener('click', filterOutside); }
function clearAllFilters() {

}

    </tr>`;
  }).join('');

  $$('#listBody tr').forEach(tr => {

    attachHoverCard(tr, r);

function bindDrawer(r) {
  $('#closeDrawer').addEventListener('click', closeDrawer);
  $('#cancelTreat').addEventListener('click', closeDrawer);
  $('#saveTreat').addEventListener('click', () => { toast('הטיפול נשמר · השלב קודם · אישור נשלח ✓'); });
  $$('.quick .q-btn').forEach(b => b.addEventListener('click', () => {
    const q = b.dataset.q;
    if (q === 'call') toast(`מחייג ל${r.name}…`);
    if (q === 'wa')   openWhatsApp(r);
    if (q === 'consult') openConsult(r);
    if (q === 'mail') toast('נפתח חלון דוא"ל');

    if (q === 'fu')   openFollowupPanel(r);
    if (q === 'note') openNotes(r);
  }));
  $$('.drawer-tabs .d-tab').forEach(b => b.addEventListener('click', () => {
    activeTab = b.dataset.dtab;
    $$('.drawer-tabs .d-tab').forEach(x => x.classList.remove('active')); b.classList.add('active');
    renderDrawerTab(r);

/* ---------------- תוכן טאב ---------------- */
function renderDrawerTab(r) {
  const body = $('#drawerBody');
  if (activeTab === 'flow')    return void (body.innerHTML = flowHTML(r), bindFlow(r));
  if (activeTab === 'details') return void (body.innerHTML = detailsHTML(r));
  if (activeTab === 'history') return void (body.innerHTML = historyHTML(r));
  if (activeTab === 'log')     return void (body.innerHTML = logHTML(r));
  if (activeTab === 'tasks')   return void (body.innerHTML = `<div class="empty">${ic('check')}<p>אין משימות פתוחות לרשומה זו.</p><button class="btn sm primary">${ic('plus')} משימה חדשה</button></div>`);
  if (activeTab === 'docs')    return void (body.innerHTML = `<div class="empty">${ic('docs')}<p>אין מסמכים מצורפים.</p><button class="btn sm">${ic('plus')} העלה מסמך</button></div>`);
}

/* ---- ציר טיפול דינמי (מנוע Workflow) ---- */
function computeStages(r) {
  const flow = workflowFor(r.journey);
  const curIdx = Math.max(0, flow.findIndex(s => s.key === r.stageKey));
  return flow.map((s, i) => {
    let state = i < curIdx ? 'done' : i === curIdx ? 'active' : 'todo';
    if (i === curIdx && r.overdue) state = 'overdue';
    return { ...s, state, idx: i };
  });
}
function flowHTML(r) {
  const stages = computeStages(r);
  return `${clientSummaryCard(r)}
    <div class="sec-title">${ic('layers')} ציר הטיפול · מסלול ${JOURNEY_TYPES[r.journey].label}</div>
    <div class="accordion" id="accordion">
      ${stages.map(s => accItem(s, r)).join('')}
    </div>`;
}

function accItem(s, r) {
  const st = STAGE_STATE[s.state];

  return `

      <button class="acc-head">

/* המלצת מועד חזרה — לפי מדיניות ההגדרות, תמיד מסונכרנת עם חלון פנוי */
function fuRecommendation() {
  // פנוי + עתידי בלבד — לעולם לא בהיסטוריה
  const freeFuture = FOLLOWUP_WINDOWS.find(w => w.booked < w.capacity && !isPastToday(w.range));
  switch (FOLLOWUP_POLICY.mode) {
    case 'next_day':   return `מחר ${FOLLOWUP_WINDOWS[0].range}`;
    case 'other_hour': { const t = nowHM() + 120; return t < 18 * 60 ? `היום ${minToHM(t)} (בעוד שעתיים)` : `מחר ${FOLLOWUP_WINDOWS[0].range}`; }
    case 'end_day':    return nowHM() < 17 * 60 ? 'היום 17:00' : `מחר ${FOLLOWUP_WINDOWS[0].range}`;
    default:           return freeFuture ? `היום ${freeFuture.range}` : `מחר ${FOLLOWUP_WINDOWS[0].range}`;  // same_day
  }
}
function fuWhenOptions() {
  const rec = fuRecommendation();
  const wins = FOLLOWUP_WINDOWS.filter(w => w.booked < w.capacity && !isPastToday(w.range))
    .map(w => `<option value="היום ${w.range}">היום ${w.range} · ${w.capacity - w.booked} פנוי</option>`).join('');
  return `<option value="">ללא</option>
    <option value="${rec}" selected>מומלץ: ${rec} · לפי הגדרות + פנוי</option>
    ${wins}
    <option value="__manual">בחירה ידנית…</option>
    <option value="__cal">📅 פתח יומן מלא…</option>`;
}
/* שינוי מהיר — מחושב מהשעה הנוכחית, בלי אופציות שעברו */
function fuQuickList() {
  const n = nowHM(), list = [];
  if (n + 15 < 18 * 60) list.push({ label: 'בעוד 15 דק׳', when: `היום ${minToHM(n + 15)}` });
  if (n + 30 < 18 * 60) list.push({ label: 'בעוד 30 דק׳', when: `היום ${minToHM(n + 30)}` });
  if (n + 60 < 18 * 60) list.push({ label: 'בעוד שעה', when: `היום ${minToHM(n + 60)}` });
  if (n < 17 * 60) list.push({ label: 'מאוחר היום', when: 'היום 17:00' });
  list.push({ label: 'מחר בבוקר', when: '23/05 09:00' });
  list.push({ label: 'מחר בצהריים', when: '23/05 13:00' });
  return list;
}

function bindFlow(r) {
  $$('#accordion .acc-head').forEach(h => h.addEventListener('click', () =>
    h.closest('.acc-item').classList.toggle('open')));
  $$('[data-open="schedule"]').forEach(b => b.addEventListener('click', () => openScheduleModal(r)));
  $$('[data-open="calendar"]').forEach(b => b.addEventListener('click', openCalendarModal));
  $$('[data-open="ai"]').forEach(b => b.addEventListener('click', () => openAiOutcome(r)));
  // סוג "אין מענה" — אין צורך בפירוט
  const ct = $('#commType');
  if (ct) ct.addEventListener('change', () => {
    const na = ct.value === 'noanswer';
    const tw = $('#commTextWrap'), nh = $('#commNoAnswer');
    if (tw) tw.classList.toggle('hidden', na);
    if (nh) nh.classList.toggle('hidden', !na);
  });
  // --- פרטי אנשי קשר: עריכה, ראשי, הוספה, הסרה, חיוג ---
  const rerenderContacts = () => {
    renderDrawerTab(r);
    const el = $('#accordion .acc-item[data-key="contactinfo"]'); if (el) el.classList.add('open');
  };
  const syncTop = () => {
    syncPrimaryContact(r);
    const small = $('#drawer .client-head small');
    if (small) small.textContent = `${r.org || ''}${r.org ? ' · ' : ''}${r.phone || ''}`;
    renderList();
  };
  $$('[data-cf]').forEach(inp => inp.addEventListener('change', () => {
    const [i, f] = inp.dataset.cf.split(':');
    contactsFor(r)[+i][f] = inp.value;
    if (contactsFor(r)[+i].primary) syncTop();
    toast('פרטי איש הקשר עודכנו ✓');
  }));
  $$('[data-cprim]').forEach(rd => rd.addEventListener('change', () => {
    contactsFor(r).forEach((c, idx) => c.primary = idx === +rd.dataset.cprim);
    syncTop(); rerenderContacts();
    toast(`איש הקשר הראשי הוחלף — הטלפון למעלה ולחיוג עודכן ✓`);
  }));
  $$('[data-cdel]').forEach(b => b.addEventListener('click', () => {
    const i = +b.dataset.cdel;
    const wasPrimary = contactsFor(r)[i].primary;
    contactsFor(r).splice(i, 1);
    if (wasPrimary && contactsFor(r)[0]) contactsFor(r)[0].primary = true;
    syncTop(); rerenderContacts();
    toast('איש הקשר הוסר');
  }));
  $$('[data-cadd]').forEach(b => b.addEventListener('click', () => {
    contactsFor(r).push({ name: '', role: 'אחר', phone: '', mail: '', primary: false });
    rerenderContacts();
  }));
  $$('[data-ccall]').forEach(b => b.addEventListener('click', () => {
    const c = contactsFor(r)[+b.dataset.ccall];
    toast(`מחייג ל${c.name || 'איש הקשר'}${c.role && c.role !== 'איש קשר ראשי' ? ` (${c.role})` : ''} · ${c.phone || 'אין מספר'}…`);
  }));

  // כפתור הפולו-אפ → מנהל הפולו-אפ (בחירה נשמרת מיד, גם בלי "שמור")
  const cfu = $('#commFu');
  if (cfu) cfu.addEventListener('click', () => openFollowupPanel(r));
  $$('[data-comm-add]').forEach(b => b.addEventListener('click', () => {
    const wrap = b.closest('.comm-add');
    const type = $('#commType') ? $('#commType').value : 'note';
    const ta = wrap ? wrap.querySelector('#commTextWrap textarea') : null;
    let txt = (ta ? ta.value : '').trim();
    if (type === 'noanswer' && !txt) txt = 'ניסיון חיוג — אין מענה';
    if (!txt) { toast('נא למלא את פרטי התיעוד'); return; }
    // התיעוד נכנס לציר התקשורת של הרשומה (ומשם לתקציר)
    commLogFor(r).unshift({ type, at: 'עכשיו', by: 'יואב כהן', text: txt });
    // בלי בחירת פולו-אפ ידנית — דיפולט לזמן הבא לפי ההגדרות (מסונכרן עם פנוי)
    let autoMsg = '';
    if (!r.fuAt && ['noanswer', 'callback'].includes(type)) {
      r.fuAt = fuRecommendation();
      r.next = { type: 'callback', at: r.fuAt };
      renderList();
      autoMsg = ` · נקבע פולו-אפ אוטומטי: ${r.fuAt}`;
    }
    renderDrawerTab(r);
    const cst = $('#accordion .acc-item[data-key="contact"]'); if (cst) cst.classList.add('open');
    toast('התיעוד נוסף לציר התקשורת ✓' + autoMsg);
  }));
}

/* ---- פרטים ---- */

   פאנל פולו-אפ (13) – חלונות זמן + פיזור

const FU_DAYS = [
  { label: 'היום', date: '22/05' },
  { label: 'מחר', date: '23/05' },
  { label: 'מחרתיים', date: '24/05' },
];
const FU_QUICK = [
  { label: 'בעוד 15 דק׳', when: 'היום 15:00' },
  { label: 'בעוד 30 דק׳', when: 'היום 15:15' },
  { label: 'בעוד שעה',    when: 'היום 15:45' },
  { label: 'מאוחר היום',  when: 'היום 17:00' },
  { label: 'מחר בבוקר',   when: '23/05 09:00' },
  { label: 'מחר בצהריים', when: '23/05 13:00' },
];
let fuDay = 0;
function openFollowupPanel(r) {
  fuDay = 0;
  $('#modal').style.maxWidth = '460px'; $('#modal').style.height = '';
  renderFollowup(r);
  $('#modalWrap').classList.add('open');
}
function renderFollowup(r) {
  const day = FU_DAYS[fuDay];
  const cur = r.fuAt || null;
  $('#modal').innerHTML = `
    <div class="modal-head"><div class="title"><span class="num">FU</span> ניהול פולו-אפ · ${r.name}</div>
      <button class="close-btn" id="closeModal">${ic('close')}</button></div>
    <div class="modal-body fu2">
      ${cur ? `<div class="fu2-current">${ic('check')} נבחר כרגע: <b>${cur}</b> · בחירת מועד אחר תחליף אותו</div>`
            : `<div class="fu2-current none">${ic('clock')} טרם נבחר מועד · ברירת מחדל לפי ההגדרות: <b>${fuRecommendation()}</b></div>`}
      <div class="fu2-lbl">בחר יום</div>
      <div class="fu2-days">${FU_DAYS.map((d, i) => `<button class="fu2-day ${i === fuDay ? 'on' : ''}" data-fuday="${i}">
        <b>${d.label}</b><small>${d.date}/24</small></button>`).join('')}</div>

      <div class="fu2-lbl">${ic('clock')} חלונות פנויים · ${day.label} ${day.date}</div>
      <div class="fu2-wins">${FOLLOWUP_WINDOWS.map(w => {
        const booked = Math.max(0, w.booked - fuDay * 2);
        const past = fuDay === 0 && isPastToday(w.range);          // אין קביעה בהיסטוריה
        const full = booked >= w.capacity, free = w.capacity - booked;
        const label = `${day.label} ${day.date} · ${w.range}`;
        const isCur = cur === label;
        const dis = full || past;
        return `<button class="fu2-win ${dis ? 'full' : ''} ${isCur ? 'cur' : ''}" ${dis ? 'disabled' : ''} ${dis ? '' : `data-fupick="${label}"`}>
          <span class="fw-time">${w.range}</span>
          ${isCur ? `<span class="fw-cap cur">✓ נבחר</span>` : `<span class="fw-cap ${past || full ? 'full' : free <= 2 ? 'low' : ''}">${past ? 'עבר' : full ? 'מלא' : free + ' פנויים'}</span>`}
        </button>`;
      }).join('')}</div>

      <div class="fu2-lbl">${ic('bolt')} שינוי מהיר</div>
      <div class="fu2-quick">${fuQuickList().map(q => `<button class="fu2-q ${cur === q.when ? 'cur' : ''}" data-fupick="${q.when}">
        <b>${q.label}</b><small>${q.when}</small></button>`).join('')}</div>

      <p class="hint">${ic('alert')} הבחירה נשמרת מיד · מחוץ לשעות הפעילות יעבור אוטומטית לחלון הפנוי הבא.</p>
    </div>`;
  $('#closeModal').addEventListener('click', closeModal);
  $$('[data-fuday]').forEach(b => b.addEventListener('click', () => { fuDay = +b.dataset.fuday; renderFollowup(r); }));
  $$('[data-fupick]').forEach(b => b.addEventListener('click', () => pickFu(r, b.dataset.fupick)));
}
/* בחירה: אם קיים מועד קודם — שאלת אישור; אחרת שמירה מידית */
function pickFu(r, label) {
  if (r.fuAt === label) { toast('זהו המועד שכבר נבחר'); return; }
  if (r.fuAt) return renderFuConfirm(r, label);
  applyFu(r, label);
}
function renderFuConfirm(r, label) {
  $('#modal').innerHTML = `
    <div class="modal-head"><div class="title"><span class="num">FU</span> עדכון מועד פולו-אפ</div>
      <button class="close-btn" id="closeModal">${ic('close')}</button></div>
    <div class="modal-body fu-confirm">
      <p class="wiz-q sm">האם אתה בטוח שברצונך לעדכן את המועד?</p>
      <div class="fu-diff">
        <div class="fd old"><small>המועד הקיים (יבוטל)</small><b>${r.fuAt}</b></div>
        <div class="fd new"><small>המועד החדש</small><b>${label}</b></div>
      </div>
      <div class="succ-actions">
        <button class="btn" id="fuBack">חזור</button>
        <button class="btn primary" id="fuOk">${ic('check')} אישור עדכון</button>
      </div>
    </div>`;
  $('#closeModal').addEventListener('click', () => renderFollowup(r));   // סגירה = חזרה, ללא שינוי
  $('#fuBack').addEventListener('click', () => renderFollowup(r));       // הישן נשאר
  $('#fuOk').addEventListener('click', () => applyFu(r, label, true));
}
function applyFu(r, label, replaced) {
  const old = r.fuAt;
  r.fuAt = label;
  r.next = { type: 'followup', at: label };
  renderList();
  // עדכון כפתור הפולו-אפ בטופס אם ה-Drawer פתוח
  if (selectedId === r.id && $('#drawerBody')) {
    renderDrawerTab(r);
    const cst = $('#accordion .acc-item[data-key="contact"]'); if (cst) cst.classList.add('open');
  }
  closeModal();
  toast(replaced ? `המועד עודכן: ${label} · המועד הקודם (${old}) בוטל ✓` : `פולו-אפ נקבע: ${label} ✓`);
}

function initToolbar() {
  $('#newRecordBtn').innerHTML = `${ic('plus')} פנייה חדשה`;

  $('#newRecordBtn').addEventListener('click', openNewRecord);

/* ---------------- Toast ---------------- */
function toast(msg) {
  const el = document.createElement('div');
  el.className = 'toast'; el.innerHTML = `${ic('check')} ${msg}`;
  $('#toastHost').appendChild(el);
  setTimeout(() => { el.style.opacity = '0'; el.style.transform = 'translateY(8px)'; }, 2600);
  setTimeout(() => el.remove(), 3000);
}

/* ---------------- גלובלי ---------------- */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if ($('#modalWrap').classList.contains('open')) closeModal();
    else if ($('#drawer').classList.contains('open')) closeDrawer();
  }
});

/* ---------------- Boot ---------------- */
function boot() {
  if (window.__cbBooted) return; window.__cbBooted = true;
  $('#searchIc').innerHTML = ic('search');
  $('#bellIc').innerHTML = ic('alert');
  $('#bell').addEventListener('click', () => toast('18 התראות · 3 חריגות SLA'));
  renderNav(); renderTabs(); renderUnifiedView();
  if (typeof initDock === 'function') initDock();   // צ'אט מוצמד בתחתית
  $('#overlay').addEventListener('click', closeDrawer);
  $('#modalWrap').addEventListener('click', e => { if (e.target === $('#modalWrap')) closeModal(); });
}
/* רץ גם אם ה-DOM כבר נטען (בגרסה המשותפת) – setTimeout מבטיח שכל הסקריפטים כבר הוגדרו */
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else setTimeout(boot, 0);

function renderWizard() {
  const s = wiz.step;
  $('#modal').innerHTML = `
    <div class="modal-head">
      <div class="title"><span class="num">3</span> אשף תיאום · ${wiz.r.name}</div>

      ${WIZ_STEPS.map((t, i) => `<div class="wiz-step ${i === s ? 'active' : ''} ${i < s ? 'done' : ''}">
        <span class="dot">${i < s ? ic('check') : i + 1}</span><span>${t}</span></div>`).join('')}
    </div>
    <div class="modal-body" id="wizBody">${wizStep(s)}</div>

  if (s === 1) return `<p class="wiz-q">מי יתאם את הפגישה?</p>
    <div class="emp-list">${EMPLOYEES.map(e => `
      <button class="emp-row ${wiz.owner === e.id ? 'sel' : ''} ${!e.avail ? 'busy' : ''}" data-emp="${e.id}">

/* ============================================================
   כרטיס מידע מהיר ב-hover (מסך 2.2)
   ============================================================ */
let hoverTimer = null, hoverHideT = null;
function attachHoverCard(tr, r) {
  let mx = 0, my = 0;
  tr.addEventListener('mouseenter', e => { mx = e.clientX; my = e.clientY; clearTimeout(hoverHideT); hoverTimer = setTimeout(() => showHoverCard(r, mx, my), 380); });
  tr.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; });   // עוקב אחר הסמן
  tr.addEventListener('mouseleave', () => { clearTimeout(hoverTimer); scheduleHideHover(); });
}
/* השהיה קצרה כדי לאפשר לעכבר להיכנס לכרטיס — ואז הוא נשאר פתוח */
function scheduleHideHover() { clearTimeout(hoverHideT); hoverHideT = setTimeout(hideHoverCard, 280); }
function anyPopupOpen() {
  return !!($('#naPop') || $('#dayPop') || $('#filterMenu') ||
    $('#modalWrap').classList.contains('open') ||
    $('#drawer').classList.contains('open'));
}
function showHoverCard(r, mx, my) {
  if (anyPopupOpen()) return;   // מניעת כפילות פופ-אפים
  hideHoverCard();
  const c = document.createElement('div');
  c.className = 'hover-card'; c.id = 'hoverCard';
  c.innerHTML = `
    <div class="hc-head">${avatar(r, 40)}<div><b>${r.name}</b><small>${r.phone}</small></div></div>
    <div class="hc-stats">
      <div>${ic('phone')} 3 ניסיונות אחרונים</div>
      <div>${ic('calendar')} ${r.meeting ? `פגישה ${r.meeting.time}` : 'אין פגישה מתוזמנת'}</div>
      <div>${ic('target')} מטרה: ${OBJECTIVES[r.objective] || '—'}</div>
      ${(() => { const open = (r.notes || []).filter(n => !n.done);
        return open.length ? `<div class="hc-open-note">${ic('note')} <b>${open.length} הערות לא טופלו</b> · ${esc(open[0].text).slice(0, 42)}${open[0].text.length > 42 ? "…" : ""}</div>` : ''; })()}
    </div>
    <div class="hc-actions">
      <button class="btn sm tel-btn" data-hc="call">${ic('phone')} חיוג</button>
      <button class="btn sm wa-btn" data-hc="wa">${ic('whatsapp')} וואטסאפ</button>
    </div>`;
  document.body.appendChild(c);
  // מיקום ליד הסמן, עם הצמדה לתוך המסך
  const cw = c.offsetWidth, ch = c.offsetHeight, pad = 8, gap = 14;
  let left = mx + gap, top = my + gap;
  if (left + cw > window.innerWidth - pad) left = mx - cw - gap;   // היפוך לצד השני של הסמן
  if (left < pad) left = pad;
  if (top + ch > window.innerHeight - pad) top = my - ch - gap;
  if (top < pad) top = pad;
  c.style.left = `${left}px`;
  c.style.top = `${top}px`;
  c.style.right = 'auto';
  // כניסת העכבר לכרטיס — נשאר פתוח; יציאה — נסגר
  c.addEventListener('mouseenter', () => clearTimeout(hoverHideT));
  c.addEventListener('mouseleave', scheduleHideHover);
  // פעולות: חיוג/וואטסאפ מכל מקום (בלי "פתח" — לחיצה על השורה כבר פותחת)
  c.querySelector('[data-hc="call"]').addEventListener('click', () => toast(`מחייג ל${r.name}…`));
  c.querySelector('[data-hc="wa"]').addEventListener('click', () => { hideHoverCard(); openChat(r, 'client'); });
}

/* ---- רכיב Toggle ---- */
function toggle(on, attrs = '') {
  return `<span class="toggle ${on ? 'on' : ''}" ${attrs} role="switch" aria-checked="${on}"><i></i></span>`;
}
function bindToggles(scope) {
  $$('.toggle', scope || document).forEach(t => {
    if (t.hasAttribute('data-wh-toggle')) return;   // לימי עבודה יש handler משלהם
    t.addEventListener('click', () => {

    });

}

/* ============================================================
   15. מסך הגדרות יומן
   ============================================================ */
let settingsEmp = 'yk';

/* --- מודל שעות עבודה הניתן לעריכה (ימים ידניים · הפסקות · פיצולים) --- */
const ALL_WEEK = ['ראשון', 'שני', 'שלישי', 'רביעי', 'חמישי', 'שישי', 'שבת'];
/* מודל טיימליין עוקב: רצף מקטעים (משמרת/הפסקה) — התחלת כל מקטע = סוף הקודם */
let workSchedule = [
  { day: 'ראשון', on: true, segments: [
    { type: 'shift', start: '08:00', end: '13:00' },
    { type: 'break', start: '13:00', end: '13:30' },
    { type: 'shift', start: '13:30', end: '17:00' },
  ] },
  { day: 'שני',   on: true, segments: [{ type: 'shift', start: '08:00', end: '17:00' }] },
  { day: 'שלישי', on: true, segments: [{ type: 'shift', start: '08:00', end: '18:00' }] },
  { day: 'רביעי', on: true, segments: [{ type: 'shift', start: '08:00', end: '17:00' }] },
  { day: 'חמישי', on: true, segments: [{ type: 'shift', start: '08:00', end: '16:00' }] },
];
function addMin(hhmm, m) { const [h, mm] = hhmm.split(':').map(Number); let t = h * 60 + mm + m; t = ((t % 1440) + 1440) % 1440; return String(Math.floor(t / 60)).padStart(2, '0') + ':' + String(t % 60).padStart(2, '0'); }
function relinkDay(d) { for (let k = 1; k < d.segments.length; k++) d.segments[k].start = d.segments[k - 1].end; }

function workHoursCard() {
  return `
    <section class="card set-card wide wh-card">
      <div class="card-head"><div class="title">${ic('clock')} שעות פעילות</div>
        <button class="btn sm" id="whAddDay">${ic('plus')} הוסף יום</button></div>
      <div class="set-body wh-body">
        ${workSchedule.length ? workSchedule.map((d, i) => whDayRow(d, i)).join('')
          : '<div class="muted" style="padding:8px">לא הוגדרו ימי עבודה. לחץ "הוסף יום".</div>'}
      </div>
    </section>`;
}
function whDayRow(d, i) {
  let shiftNo = 0;
  const segHTML = d.segments.map((s, si) => {
    const last = si === d.segments.length - 1;
    const isBreak = s.type === 'break';
    let label;
    if (isBreak) label = 'הפסקה';
    else { shiftNo++; label = shiftNo === 1 ? 'שעות עבודה' : 'משמרת'; }
    const startLocked = si > 0;   // התחלה = סוף הקודם (אוטומטי)
    return `
      <div class="seg ${s.type}">
        <span class="seg-lbl">${label}</span>
        <span class="seg-times">
          <input type="time" value="${s.start}" ${startLocked ? 'readonly' : ''} data-seg="${i}:${si}:start" title="${startLocked ? 'מתעדכן אוטומטית מסוף המקטע הקודם' : 'שעת התחלה'}">
          <span class="wh-sep">–</span>
          <input type="time" value="${s.end}" data-seg="${i}:${si}:end">
        </span>
        <span class="seg-actions">
          ${last ? `<button class="wh-add ${isBreak ? 'shift' : 'brk'}" data-seg-add="${i}">${ic('plus')} ${isBreak ? 'הוסף משמרת' : 'הפסקה'}</button>` : ''}
          ${si > 0 ? `<button class="wh-x" data-seg-del="${i}:${si}" title="הסר ${isBreak ? 'הפסקה' : 'משמרת'}">${ic('close')}</button>` : ''}
        </span>
      </div>`;
  }).join('');
  return `
    <div class="wh-day ${d.on ? '' : 'off'}">
      <div class="wh-day-head">
        <span class="toggle ${d.on ? 'on' : ''}" data-wh-toggle="${i}"></span>
        <b class="wh-name">${d.day}</b>
        <button class="wh-del" data-wh-delday="${i}" title="הסר יום">${ic('close')}</button>
      </div>
      <div class="wh-segs">${segHTML}</div>
    </div>`;
}
function durationsCard() {
  return `
    <section class="card set-card wide dur-card">
      <div class="card-head"><div class="title">${ic('calendar')} משכי תיאום ומרווחים</div></div>
      <div class="set-body">
        <table class="mini-table dur-table">
          <thead><tr><th>סוג</th><th>ברירת מחדל</th><th>מינ'</th><th>מקס'</th><th>הכנה</th><th>סיום</th></tr></thead>
          <tbody>${DURATIONS.map((d, i) => `<tr>
            <td><b>${d.type}</b></td>
            <td><span class="dur-in"><input value="${d.def}" data-dur="${i}:def"><em>דק'</em></span></td>
            <td><span class="dur-in"><input value="${d.min}" data-dur="${i}:min"></span></td>
            <td><span class="dur-in"><input value="${d.max}" data-dur="${i}:max"></span></td>
            <td><span class="dur-in"><input value="${d.prep}" data-dur="${i}:prep"><em>דק'</em></span></td>
            <td><span class="dur-in"><input value="${d.wrap}" data-dur="${i}:wrap"><em>דק'</em></span></td>
          </tr>`).join('')}</tbody>
        </table>
      </div>
    </section>`;
}
function bindWorkHours() {
  $$('[data-wh-toggle]').forEach(b => b.addEventListener('click', () => { const i = +b.dataset.whToggle; workSchedule[i].on = !workSchedule[i].on; renderSettingsView(); }));
  $$('[data-wh-delday]').forEach(b => b.addEventListener('click', () => { workSchedule.splice(+b.dataset.whDelday, 1); renderSettingsView(); }));

  // הוספת מקטע – משמרת אם האחרון הפסקה, אחרת הפסקה. התחלה = סוף המקטע האחרון
  $$('[data-seg-add]').forEach(b => b.addEventListener('click', () => {
    const d = workSchedule[+b.dataset.segAdd];
    const last = d.segments[d.segments.length - 1];
    if (last.type === 'break') d.segments.push({ type: 'shift', start: last.end, end: addMin(last.end, 120) });
    else d.segments.push({ type: 'break', start: last.end, end: addMin(last.end, 30) });
    renderSettingsView();
  }));
  // הסרת מקטע (רק לא-ראשון) + קישור מחדש
  $$('[data-seg-del]').forEach(b => b.addEventListener('click', () => {
    const [i, si] = b.dataset.segDel.split(':').map(Number);
    workSchedule[i].segments.splice(si, 1); relinkDay(workSchedule[i]); renderSettingsView();
  }));
  // עריכת זמן – סיום מקטע מקשר להתחלת הבא; רינדור מחדש כדי לשקף
  $$('[data-seg]').forEach(inp => inp.addEventListener('change', () => {
    const [i, si, field] = inp.dataset.seg.split(':');
    const d = workSchedule[+i], seg = d.segments[+si];
    seg[field] = inp.value;
    if (field === 'end') relinkDay(d);
    else if (+si === 0) relinkDay(d);
    renderSettingsView();
  }));

  const add = $('#whAddDay'); if (add) add.addEventListener('click', () => showDayPicker(add));
  $$('[data-dur]').forEach(inp => inp.addEventListener('change', () => { const [i, key] = inp.dataset.dur.split(':'); DURATIONS[+i][key] = inp.value; }));
}
function sortSchedule() { workSchedule.sort((a, b) => ALL_WEEK.indexOf(a.day) - ALL_WEEK.indexOf(b.day)); }
function showDayPicker(anchor) {
  closeDayPicker();
  const used = workSchedule.map(d => d.day);
  const missing = ALL_WEEK.filter(d => !used.includes(d));
  if (!missing.length) { toast('כל ימי השבוע כבר קיימים'); return; }
  const pop = document.createElement('div');
  pop.className = 'day-pop'; pop.id = 'dayPop';
  pop.innerHTML = `<div class="day-pop-title">בחר יום להוספה</div>${missing.map(d => `<button data-addday="${d}">${d}</button>`).join('')}`;
  document.body.appendChild(pop);
  const rc = anchor.getBoundingClientRect();
  pop.style.top = `${rc.bottom + 5}px`;
  pop.style.right = `${window.innerWidth - rc.right}px`;
  $$('[data-addday]', pop).forEach(b => b.addEventListener('click', () => {
    workSchedule.push({ day: b.dataset.addday, on: true, segments: [{ type: 'shift', start: '08:00', end: '17:00' }] });
    sortSchedule();               // הכנסה בסדר הימים התקין
    closeDayPicker(); renderSettingsView();
    toast(`נוסף יום ${b.dataset.addday}`);
  }));
  setTimeout(() => document.addEventListener('click', dayPickerOutside), 0);
}
function dayPickerOutside(e) { if (!e.target.closest('#dayPop') && !e.target.closest('#whAddDay')) closeDayPicker(); }
function closeDayPicker() { const p = $('#dayPop'); if (p) p.remove(); document.removeEventListener('click', dayPickerOutside); }

/* ============================================================
   יומן מלא רב-עובדים (9 / מסך 4) – יום/שבוע/חודש + ניווט + בחירת זמן
   ============================================================ */
const HEB_MONTHS = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];
const HEB_DAYS   = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const HEB_DAYS_S = ['א','ב','ג','ד','ה','ו','ש'];
const DEMO_DAY   = '2024-05-22';           // היום עם אירועי הדמו
/* צפיפות אירועים לחודש (למראה חי) */
const MONTH_DENSITY = { '2024-05-20': 3, '2024-05-21': 2, '2024-05-22': 11, '2024-05-23': 4, '2024-05-27': 2, '2024-05-28': 5, '2024-05-30': 3 };

let calMode = 'day';
let calDate = new Date(2024, 4, 22);       // 22 במאי 2024
let calSelSlot = null;

function fmtH(h) { const hh = Math.floor(h), mm = Math.round((h - hh) * 60); return `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`; }
function dkey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function startOfWeek(d) { const x = new Date(d); x.setDate(x.getDate() - x.getDay()); return x; } // ראשון
function calLabel() {
  if (calMode === 'day')   return `יום ${HEB_DAYS[calDate.getDay()]}, ${calDate.getDate()} ${HEB_MONTHS[calDate.getMonth()]} ${calDate.getFullYear()}`;
  if (calMode === 'week')  { const s = startOfWeek(calDate), e = addDays(s, 6);
    return `${s.getDate()} – ${e.getDate()} ${HEB_MONTHS[e.getMonth()]} ${e.getFullYear()}`; }
  return `${HEB_MONTHS[calDate.getMonth()]} ${calDate.getFullYear()}`;
}
function calShift(dir) {
  if (calMode === 'day')   calDate = addDays(calDate, dir);
  else if (calMode === 'week') calDate = addDays(calDate, dir * 7);
  else calDate = new Date(calDate.getFullYear(), calDate.getMonth() + dir, 1);
}
function calToolbarHTML() {
  return `<div class="cal-toolbar">
    <div class="seg">
      <button class="seg-btn ${calMode==='day'?'on':''}" data-mode="day">יום</button>
      <button class="seg-btn ${calMode==='week'?'on':''}" data-mode="week">שבוע</button>
      <button class="seg-btn ${calMode==='month'?'on':''}" data-mode="month">חודש</button>
    </div>
    <div class="cal-nav">
      <button class="icon-btn" data-nav="-1" title="הקודם">${ic('chevronR')}</button>
      <button class="btn sm" data-nav="today">היום</button>
      <button class="icon-btn" data-nav="1" title="הבא">${ic('chevronL')}</button>
    </div>
    <span class="cal-label">${calLabel()}</span>
    <div class="spacer"></div>
    <button class="btn sm">${ic('sync')} Google</button>
  </div>`;
}
function calContentHTML() {
  return `<section class="card">${calMode === 'day' ? calDayHTML() : calMode === 'week' ? calWeekHTML() : calMonthHTML()}</section>`;
}
function bindCalFull(scope, rerender) {
  $$('[data-mode]', scope).forEach(b => b.addEventListener('click', () => { calMode = b.dataset.mode; calSelSlot = null; rerender(); }));
  $$('[data-nav]', scope).forEach(b => b.addEventListener('click', () => {
    if (b.dataset.nav === 'today') calDate = new Date(2024, 4, 22); else calShift(+b.dataset.nav);
    rerender();
  }));
  $$('.mcal-ev', scope).forEach(e => e.addEventListener('click', ev => {
    ev.stopPropagation();
    if (e.dataset.rec) { closeModal(); openDrawer(RECORDS.find(x => x.id === +e.dataset.rec)); }
    else toast(`אירוע: ${e.dataset.t}`);
  }));
  $$('.slot-free', scope).forEach(c => c.addEventListener('click', () => pickCalSlot(c)));
  $$('.mo-cell', scope).forEach(c => c.addEventListener('click', () => { calDate = new Date(c.dataset.d + 'T00:00:00'); calMode = 'day'; rerender(); }));
}
function renderCalendarView() {
  $('#viewHost').innerHTML = `
    <div class="view-head"><div class="vh-title"><span class="num">4</span> יומן מלא – כל הגורמים המטפלים</div></div>

/* ---- תצוגת יום: עמודות עובדים ---- */
function calDayHTML() {
  const hours = []; for (let h = 8; h <= 18; h++) hours.push(h);
  const isDemo = dkey(calDate) === DEMO_DAY;
  return `<div class="mcal" style="grid-template-columns:56px repeat(${CAL_OWNERS.length}, 1fr)">
    <div class="mcal-corner"></div>
    ${CAL_OWNERS.map(o => `<div class="mcal-owner">${o}</div>`).join('')}
    ${hours.map(h => `
      <div class="mcal-hour">${String(h).padStart(2,'0')}:00</div>
      ${CAL_OWNERS.map(o => {
        const evs = isDemo ? (CAL_EVENTS[o] || []).filter(e => Math.floor(e.h) === h) : [];
        if (evs.length) return `<div class="mcal-cell filled">${evs.map(ev => calEvHTML(ev)).join('')}</div>`;
        if (isDemo && (h + 1) * 60 <= nowHM()) return `<div class="mcal-cell past" title="השעה עברה — אין קביעה בהיסטוריה"></div>`;
        return `<div class="mcal-cell slot-free" data-o="${o}" data-h="${h}" data-d="${dkey(calDate)}"></div>`;
      }).join('')}
    `).join('')}
  </div>`;
}

/* ---- תצוגת שבוע: 7 ימים × שעות ---- */
function calWeekHTML() {
  const hours = []; for (let h = 8; h <= 18; h++) hours.push(h);
  const s = startOfWeek(calDate);
  const days = Array.from({length: 7}, (_, i) => addDays(s, i));
  return `<div class="mcal" style="grid-template-columns:56px repeat(7, 1fr)">
    <div class="mcal-corner"></div>
    ${days.map(d => `<div class="mcal-owner ${dkey(d)===DEMO_DAY?'is-today':''}">${HEB_DAYS_S[d.getDay()]}<small>${d.getDate()}/${d.getMonth()+1}</small></div>`).join('')}
    ${hours.map(h => `
      <div class="mcal-hour">${String(h).padStart(2,'0')}:00</div>
      ${days.map(d => {
        const evs = dkey(d) === DEMO_DAY ? (CAL_EVENTS['יואב כהן'] || []).filter(e => Math.floor(e.h) === h) : [];
        if (evs.length) return `<div class="mcal-cell filled">${evs.map(ev => calEvHTML(ev, true)).join('')}</div>`;
        if (dkey(d) === DEMO_DAY && (h + 1) * 60 <= nowHM()) return `<div class="mcal-cell past" title="השעה עברה — אין קביעה בהיסטוריה"></div>`;
        return `<div class="mcal-cell slot-free" data-o="${HEB_DAYS[d.getDay()]}" data-h="${h}" data-d="${dkey(d)}"></div>`;
      }).join('')}
    `).join('')}
  </div>`;
}

/* ---- תצוגת חודש: רשת ---- */
function calMonthHTML() {
  const first = new Date(calDate.getFullYear(), calDate.getMonth(), 1);
  const gridStart = addDays(first, -first.getDay());
  const cells = Array.from({length: 42}, (_, i) => addDays(gridStart, i));
  return `<div class="mo-grid">
    ${HEB_DAYS_S.map(d => `<div class="mo-head">${d}</div>`).join('')}
    ${cells.map(d => {
      const inMonth = d.getMonth() === calDate.getMonth();
      const k = dkey(d), cnt = MONTH_DENSITY[k] || 0, today = k === DEMO_DAY;
      return `<div class="mo-cell ${inMonth?'':'out'} ${today?'today':''}" data-d="${k}">
        <span class="mo-num">${d.getDate()}</span>
        ${cnt ? `<div class="mo-dots">${Array.from({length: Math.min(cnt,4)}, () => '<i></i>').join('')}${cnt>4?`<span>+${cnt-4}</span>`:''}</div>
          <div class="mo-cnt">${cnt} אירועים</div>` : ''}
      </div>`;
    }).join('')}
  </div>`;
}

/* אירוע יומן – שם ליד לחיץ + חפיפה (רוחב מצומצם, שורה אחת) */
function calEvHTML(ev, weekMode) {
  const time = weekMode ? fmtH(ev.h) : `${fmtH(ev.h)}–${fmtH(ev.h + ev.dur)}`;
  return `<div class="mcal-ev ${ev.c} ${ev.recId ? 'link' : ''}" data-t="${ev.t}" ${ev.recId ? `data-rec="${ev.recId}" title="פתח ליד: ${ev.t}"` : ''} style="min-height:${ev.dur * 40}px">
    <span class="ev-t">${ev.t}</span><small>${time}</small></div>`;
}
/* בחירת זמן בתא שעה — לפי דיוק התזמון מההגדרות (התצוגה נשארת שעתית) */
function pickCalSlot(cell) {
  const step = CAL_STEP.minutes;
  if (step >= 60) return selectCalTime(cell, `${String(cell.dataset.h).padStart(2, '0')}:00`);
  showMinutePicker(cell, step);
}
function selectCalTime(cell, time) {
  closeMinutePicker();
  $$('.slot-free.sel').forEach(x => { x.classList.remove('sel'); x.innerHTML = ''; });
  cell.classList.add('sel');
  calSelSlot = { o: cell.dataset.o, h: cell.dataset.h, d: cell.dataset.d, time };
  const [y, m, dd] = cell.dataset.d.split('-');
  cell.innerHTML = `<div class="slot-pick">${ic('plus')} ${time}</div>`;
  toast(`נבחר זמן: ${dd}/${m} · ${time} · ${cell.dataset.o} (דיוק ${CAL_STEP.minutes} דק')`);
}
function showMinutePicker(cell, step) {
  closeMinutePicker();
  const h = +cell.dataset.h;
  const isToday = cell.dataset.d === DEMO_DAY;
  const times = [];
  for (let m = 0; m < 60; m += step) {
    if (isToday && h * 60 + m <= nowHM()) continue;   // אין דקות שעברו
    times.push(`${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`);
  }
  if (!times.length) { toast('כל הדקות בשעה זו עברו'); return; }
  const pop = document.createElement('div');
  pop.className = 'minute-pop'; pop.id = 'minutePop';
  pop.innerHTML = `<div class="mp-title">${String(h).padStart(2, '0')}:00–${String(h + 1).padStart(2, '0')}:00 · בחר התחלה</div>
    <div class="mp-grid cols-${step <= 5 ? 4 : step <= 15 ? 3 : 2}">${times.map(t => `<button data-mp="${t}">${t}</button>`).join('')}</div>`;
  document.body.appendChild(pop);
  const rc = cell.getBoundingClientRect();
  let top = rc.bottom + 5, left = rc.left;
  if (top + pop.offsetHeight > window.innerHeight - 10) top = rc.top - pop.offsetHeight - 5;
  if (left + pop.offsetWidth > window.innerWidth - 10) left = window.innerWidth - pop.offsetWidth - 10;
  pop.style.top = `${Math.max(8, top)}px`; pop.style.left = `${Math.max(8, left)}px`;
  $$('[data-mp]', pop).forEach(b => b.addEventListener('click', e => { e.stopPropagation(); selectCalTime(cell, b.dataset.mp); }));
  setTimeout(() => document.addEventListener('click', mpOutside), 0);
}
function mpOutside(e) { if (!e.target.closest('#minutePop')) closeMinutePicker(); }
function closeMinutePicker() { const p = $('#minutePop'); if (p) p.remove(); document.removeEventListener('click', mpOutside); }

let kbDragging = false;
function bindMetaKanban() {
  $$('.kb-card').forEach(c => {
    c.addEventListener('dragstart', e => {
      kbDragging = true;
      e.dataTransfer.setData('text/plain', c.dataset.kbrec);
      e.dataTransfer.effectAllowed = 'move';
      c.classList.add('dragging');
    });
    c.addEventListener('dragend', () => { c.classList.remove('dragging'); setTimeout(() => kbDragging = false, 50); });
    c.addEventListener('click', () => { if (kbDragging) return; const r = RECORDS.find(x => x.id === +c.dataset.kbrec); if (r) openDrawer(r); });
  });
  $$('.kb-col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; col.classList.add('over'); });
    col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('over'); });
    col.addEventListener('drop', e => {
      e.preventDefault(); col.classList.remove('over');
      const id = +e.dataTransfer.getData('text/plain');
      moveRecordToMeta(id, col.dataset.kbcol);
    });
  });
}
function moveRecordToMeta(id, metaKey) {
  const r = RECORDS.find(x => x.id === id); if (!r) return;
  const metaTitle = META_STAGES.find(m => m.key === metaKey).title;
  if ((r.done ? 'close' : metaOf(r.stageKey)) === metaKey) return;   // אותו טור
  const flow = workflowFor(r.journey);
  const target = flow.find(s => metaOf(s.key) === metaKey);
  if (!target) { toast(`למסלול "${JOURNEY_TYPES[r.journey].label}" אין שלב מסוג "${metaTitle}"`); return; }
  r.stageKey = target.key;
  r.objective = target.objective || r.objective;
  if (metaKey === 'close') { r.done = true; r.overdue = false; r.status = { label: 'נסגרה', color: 'green' }; r.next = { type: 'none', at: '—' }; }
  else { r.done = false; if (r.status.label === 'נסגרה') r.status = { label: 'בטיפול', color: 'blue' }; }
  renderDynamicView();
  toast(`${r.name} הועבר ל"${metaTitle}" (${target.title}) ✓`);
}

  const up = t > 0;

}

/* צליל התראה על הודעה נכנסת — נשמע גם כשנמצאים במסך/מערכת אחרת */
function playChatSound() {
  try {
    const ctx = window.__chatAC || (window.__chatAC = new (window.AudioContext || window.webkitAudioContext)());
    if (ctx.state === 'suspended') ctx.resume();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'sine'; o.frequency.value = 880; g.gain.value = 0.07;
    o.frequency.setValueAtTime(1174, ctx.currentTime + 0.09);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.28);
    o.start(); o.stop(ctx.currentTime + 0.3);
  } catch (e) { /* דפדפן חוסם אודיו לפני אינטראקציה */ }
  // חיווי גם בכותרת הטאב — למי שנמצא במערכת אחרת
  const t0 = 'CallBiz Manager – מסך עבודה אחוד';
  document.title = '💬 הודעה חדשה · CallBiz';
  clearTimeout(window.__titleT);
  window.__titleT = setTimeout(() => document.title = t0, 4000);
}

/* סנכרון מלא עם רשימת הצ'אטים: פתיחה בפופ-אפ = שיחה פתוחה בצ'אט צוות */
function nextConvId() { return Math.max(0, ...CONVERSATIONS.map(x => x.id)) + 1; }
function ensureConv(r, mode, colleague) {
  let c;
  if (mode === 'client') {
    c = CONVERSATIONS.find(x => x.kind === 'client' && x.recordId === r.id);
    if (!c) {
      c = { id: nextConvId(), name: r.name, kind: 'client', activity: 'לקוח · WhatsApp', recordId: r.id,
        presence: 'offline', unread: 0, last: '', time: 'עכשיו', status: 'open', thread: buildClientThread(r) };
      CONVERSATIONS.unshift(c);
    }
  } else {
    c = CONVERSATIONS.find(x => x.kind === 'internal' && x.name === colleague.name && x.recordId === r.id);
    if (!c) {
      c = { id: nextConvId(), name: colleague.name, kind: 'internal', activity: `התייעצות · ליד ${r.name}`, recordId: r.id,
        presence: colleague.presence || 'available', unread: 0, last: '', time: 'עכשיו', status: 'open', thread: [] };
      CONVERSATIONS.unshift(c);
    }
  }
  if (c.status === 'closed') c.status = 'open';   // פתיחה מחדש מהפופ-אפ
  return c;
}
function syncChatUIs() {

}

/* ---- בניית שיחת לקוח לפי הזמנים בפועל של הרשומה ---- */
function ctxTime(r) {
  if (r.meeting) return `${r.meeting.date === '22/05/24' ? 'היום' : r.meeting.date} בשעה ${r.meeting.time}`;
  if (r.next?.at) return r.next.at;
  return 'בהקדם';
}
function buildClientThread(r) {
  const when = ctxTime(r);
  const chan = r.meeting?.channel || 'טלפון';
  return [
    { me: false, text: 'שלום, קיבלתי את הפרטים. מתי אפשר להיפגש?', who: r.name, time: '09:02' },
    { me: true,  text: `היי ${r.name.split(' ')[0]}, זה יואב. אשמח לתאם ${r.meeting ? 'פגישה' : 'שיחה'} ${when} ✅`, who: 'יואב', time: '09:03' },
    { me: false, text: 'מעולה, מתאים לי 👍', who: r.name, time: '09:04' },
    { me: true,  text: `שלחתי לך זימון ופרטים ל-${chan}. נתראה!`, who: 'יואב', time: '09:05' },
    ...(r.meeting ? [{ notice: true, kind: 'meeting', recordId: r.id, title: 'תזכורת פגישה', text: `${when} · ${chan}` }] : []),
  ];
}

function chatContext(r) {
  if (r.meeting) return `פגישה · ${ctxTime(r)}`;
  const na = NEXT_ACTIONS[r.next?.type];
  return na ? `${na.label} · ${r.next.at}` : 'פנייה פעילה';

function sendChatMsg() {

  inp.value = '';

  // תגובה מדומה מהצד השני
  setTimeout(() => {
    const who = chat.mode === 'internal' ? (chat.colleague?.name || 'עמית') : chat.r.name;
    const reply = chat.mode === 'internal' ? 'קיבלתי, אני בודק ומעדכן 👍' : 'תודה! מאשר ✅';

    playChatSound();
    if ($('#ccThread')) renderChat();
  }, 900);
}

        ${it.occ.length ? `<div class="ad-occ-title">כל המופעים · לפי תאריך ושעה</div>

  }));
  $$('[data-contact]').forEach(b => b.addEventListener('click', () => {
    if (b.dataset.contact === 'general') { startConv('שיחה כללית', { name: 'שיחה כללית', initials: 'שכ', presence: 'available', activity: 'ללא שיוך', hours: '' }); return; }
    newConvContact = CHAT_CONTACTS.find(c => c.id === b.dataset.contact); platView = 'activity'; renderChatPlatform();
  }));
  $$('[data-act]').forEach(b => b.addEventListener('click', () => startConv(b.dataset.act, newConvContact)));
  $$('[data-notice-rec]').forEach(b => b.addEventListener('click', () => openRecordFromChat(b.dataset.noticeRec)));
  $$('[data-goto-lead]').forEach(b => b.addEventListener('click', () => openRecordFromChat(b.dataset.gotoLead)));
  // קבוצה
  const gn = $('#grpName'); if (gn) gn.addEventListener('input', () => newGroup.name = gn.value);
  $$('[data-grpadd]').forEach(b => b.addEventListener('click', () => { newGroup.members.push(b.dataset.grpadd); renderChatPlatform(); }));
  $$('[data-grpx]').forEach(b => b.addEventListener('click', () => { newGroup.members = newGroup.members.filter(m => m !== b.dataset.grpx); renderChatPlatform(); }));
  $$('[data-perm]').forEach(b => b.addEventListener('click', () => { const [k, v] = b.dataset.perm.split(':'); newGroup[k + 'Perm'] = v; renderChatPlatform(); }));
  const gc = $('#grpCreate'); if (gc) gc.addEventListener('click', createGroup);
  // שיחה
  const send = $('#cfSend'); if (send) send.addEventListener('click', platSend);
  const inp = $('#cfInput');
  if (inp) {
    cfManual = false;   // רינדור חדש = חזרה לשורה אחת ולמצב אוטומטי
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); platSend(); }
      // Shift+Enter → שורה חדשה (ברירת מחדל של textarea)
    });
    inp.addEventListener('input', () => autoGrowCF(inp));
    const grip = $('#cfGrip'); if (grip) grip.addEventListener('pointerdown', startCfDrag);
  }
  const def = $('#cfDefault'); if (def) def.addEventListener('click', platDefaultReply);
  const fin = $('#cfFinish'); if (fin) fin.addEventListener('click', () => { const c = CONVERSATIONS.find(x => x.id === platActive); c.status = c.status === 'closed' ? 'open' : 'closed'; platView = 'list'; renderChatPlatform(); toast('הטיפול בשיחה הסתיים'); });
  const th = $('#cfThread'); if (th) th.scrollTop = th.scrollHeight;
}
function startConv(activity, contact) {
  let c = CONVERSATIONS.find(x => x.name === contact.name);
  if (!c) {
    c = { id: Math.max(...CONVERSATIONS.map(x => x.id)) + 1, name: contact.name, kind: 'internal', activity: `${activity} · ${contact.activity || ''}`.trim(), presence: contact.presence || 'available', unread: 0, last: '', time: 'עכשיו', status: 'open', thread: [] };
    CONVERSATIONS.unshift(c);
  }
  platActive = c.id; platView = 'conv'; platTyping = true; renderChatPlatform();
  setTimeout(() => { platTyping = false; if (platView === 'conv') renderChatPlatform(); }, 2500);
}
function createGroup() {
  const name = ($('#grpName').value || '').trim();
  if (!name) { toast('נא למלא שם קבוצה'); return; }
  const c = { id: Math.max(...CONVERSATIONS.map(x => x.id)) + 1, name, kind: 'group', activity: `${newGroup.members.length} חברים`, presence: 'available', unread: 0, last: 'הקבוצה נוצרה', time: 'עכשיו', status: 'open', thread: [{ me: true, text: `הקבוצה "${name}" נוצרה`, who: 'יואב', time: 'עכשיו' }] };
  CONVERSATIONS.unshift(c); platActive = c.id; platView = 'conv'; renderChatPlatform();
  toast(`נוצרה קבוצה: ${name}`);
}
/* ---- קומפוזר חכם: גדילה עד 4 שורות → גלילה · הרחבה ידנית עד חצי מסך ---- */
let cfManual = false;
const CF_AUTO_CAP = 112;   // ≈ 4 שורות
function autoGrowCF(ta) {
  if (cfManual) { ta.style.overflowY = ta.scrollHeight > ta.offsetHeight ? 'auto' : 'hidden'; return; }
  ta.style.height = 'auto';
  const h = Math.min(ta.scrollHeight, CF_AUTO_CAP);
  ta.style.height = h + 'px';
  ta.style.overflowY = ta.scrollHeight > CF_AUTO_CAP ? 'auto' : 'hidden';
}
function startCfDrag(e) {
  e.preventDefault();
  const ta = $('#cfInput'); if (!ta) return;
  const startY = e.clientY, startH = ta.offsetHeight;
  cfManual = true;
  const move = ev => {
    let h = startH + (startY - ev.clientY);                       // גרירה למעלה = הגדלה
    h = Math.max(46, Math.min(Math.round(window.innerHeight / 2), h));   // עד אמצע המסך
    ta.style.height = h + 'px';
    ta.style.overflowY = ta.scrollHeight > h ? 'auto' : 'hidden';
  };
  const up = () => { document.removeEventListener('pointermove', move); document.removeEventListener('pointerup', up); };
  document.addEventListener('pointermove', move);
  document.addEventListener('pointerup', up);
}

function platSend() {
  const inp = $('#cfInput'); const txt = inp.value.trim(); if (!txt) return;
  const c = CONVERSATIONS.find(x => x.id === platActive);
  c.thread.push({ me: true, text: txt, who: 'יואב', time: 'עכשיו' }); c.last = txt; inp.value = '';
  platTyping = true; renderChatPlatform();
  setTimeout(() => { platTyping = false; c.thread.push({ me: false, text: c.kind === 'client' ? 'תודה! ✅' : 'קיבלתי, מטפל 👍', who: c.name, time: 'עכשיו' }); c.last = 'תגובה'; playChatSound(); if (platView === 'conv') renderChatPlatform(); else { c.unread = (c.unread || 0) + 1; } }, 1100);
}
function platDefaultReply() {
  const c = CONVERSATIONS.find(x => x.id === platActive);
  c.thread.push({ me: false, text: 'שלום, קיבלתי את פנייתך ואחזור אליך בהקדם 🙏', who: c.name, time: 'עכשיו' });
  platTyping = false; renderChatPlatform();
}
/* ============================================================
   CallBiz Manager – צ'אט מוצמד (Docked) בתחתית המסך
   נגיש מכל מסך · לראות שיחות/פניות קודמות · משתמש ב-CONVERSATIONS
   ============================================================ */
let dockOpen = false;
let dockConv = null;
let dockFilter = 'all';
function filteredConvsDock() {
  if (dockFilter === 'pending') return CONVERSATIONS.filter(c => c.status === 'open' || c.status === 'live');
  if (dockFilter === 'groups')  return CONVERSATIONS.filter(c => c.kind === 'group');
  if (dockFilter === 'closed')  return CONVERSATIONS.filter(c => c.status === 'closed');
  return CONVERSATIONS;
}

function initDock() {
  if ($('#chatDock')) return;
  const el = document.createElement('div');
  el.id = 'chatDock';
  document.body.appendChild(el);
  renderDock();
  // כשנמצאים במסך הצ'אט המלא — האייקון הצף מוסתר; חוזר ביציאה מהמסך
  const host = $('#viewHost');
  if (host) new MutationObserver(updateDockVisibility).observe(host, { childList: true });
  updateDockVisibility();
}
function updateDockVisibility() {
  const d = $('#chatDock'); if (!d) return;
  const onChatScreen = !!$('#viewHost .plat');
  if (onChatScreen && dockOpen) closeChatDock();
  d.style.display = onChatScreen ? 'none' : '';
}
function renderDock() {
  const unread = CONVERSATIONS.reduce((s, c) => s + c.unread, 0);
  $('#chatDock').innerHTML = `
    ${dockOpen ? dockPanel() : ''}
    <button class="dock-btn ${dockOpen ? 'open' : ''}" id="dockBtn" title="צ'אט צוות">
      ${dockOpen ? ic('close') : ic('whatsapp')}
      ${!dockOpen && unread ? `<span class="dock-badge">${unread}</span>` : ''}
    </button>`;
  bindDock();
}
let dockAnim = false;   // אנימציה רק בפתיחה ראשונה של הפאנל
function dockPanel() {
  const anim = dockAnim ? ' anim' : '';
  // שיחה נפתחת לצד הרשימה (לא במקומה); בלי שיחה — רשימה בלבד
  if (dockConv === null || dockConv === false || dockConv === undefined || !CONVERSATIONS.find(c => c.id === dockConv))
    return `<div class="dock-panel${anim}">${dockListCol()}</div>`;
  // ב-RTL הילד הראשון = ימני: השיחה נפתחת מימין, הרשימה נשארת במקומה בלי שינוי
  return `<div class="dock-panel wide${anim}"><div class="dock-split">${dockConvView()}${dockListCol()}</div></div>`;
}
function dockListView() { return `<div class="dock-panel">${dockListCol()}</div>`; }
function dockListCol() {
  const list = filteredConvsDock();
  return `
    <div class="dock-list-col">
      <div class="dp-head">
        <div class="dp-brand">
          <div class="dp-top-actions">
            <button class="dp-tbtn" id="dockExpand" title="מסך מלא">${ic('expand')}</button>
          </div>
          <div class="dp-brand-txt"><b>צ'אט צוות</b><small><i class="pdot" style="background:oklch(60% 0.16 145)"></i>זמין · נוכח בפורטל</small></div>
          <span class="dp-logo">${ic('whatsapp')}</span>
        </div>
      </div>
      <div class="dp-btns">
        <button class="pbtn solid" id="dockNewConv">${ic('plus')} שיחה חדשה</button>
        <button class="pbtn ghost" id="dockNewGroup">קבוצה חדשה</button>
      </div>
      <div class="dp-search"><input placeholder="חיפוש לפי שם, נציג או פעילות…"><span>${ic('search')}</span></div>
      <div class="dp-pills">
        ${CHAT_FILTERS.map(f => `<button class="dp-pill ${dockFilter === f.key ? 'on' : ''}" data-dpf="${f.key}">${f.label} <span>${filterCount(f.key)}</span></button>`).join('')}
      </div>
      <div class="dp-body">
        ${list.length ? `<div class="dock-list">${list.map(dockConvRow).join('')}</div>`
          : `<div class="dp-empty"><span class="dpe-ic">${ic('check')}</span><b>אין שיחות בטיפול</b><small>סיימת לטפל בכל הצ'אטים 🎉</small></div>`}
      </div>
    </div>`;
}
function dockConvRow(c) {
  const pr = PRESENCE[c.presence];
  return `<button class="dock-conv ${c.id === dockConv ? 'on' : ''}" data-dconv="${c.id}">
    <span class="conv-av ${c.kind}">${c.kind === 'group' ? ic('clients') : c.name[0]}<span class="conv-dot" style="background:${pr.c}"></span></span>
    <span class="conv-info">
      <span class="conv-top"><b>${c.name}</b><small>${c.time}</small></span>
      <span class="conv-last">${c.last}</span>
    </span>
    ${c.unread ? `<span class="conv-badge">${c.unread}</span>` : ''}
  </button>`;
}
function dockConvView() {
  const c = CONVERSATIONS.find(x => x.id === dockConv);
  const pr = PRESENCE[c.presence];
  return `
    <div class="dock-conv-col">
      <div class="dock-head ${c.kind}">
        <span class="ca-badge">${c.kind === 'client' ? ic('whatsapp') + ' לקוח' : '🔒 פנימי'}</span>
        <div class="dock-recip"><span class="cc-dot" style="background:${pr.c};border:1.5px solid #fff"></span>
          <div><b>${c.name}</b><small>${c.activity}</small></div></div>
        ${c.recordId ? `<button class="lead-chip" data-goto-lead="${c.recordId}" title="פתח את הליד">${ic('user')} ${(RECORDS.find(x => x.id === c.recordId) || {}).name || 'לליד'}</button>` : ''}
        <button class="dock-back" id="dockBack" title="סגור שיחה">${ic('chevronL')}</button>
      </div>
      <div class="dock-thread" id="dockThread">
        ${(() => { const mark = c.unreadMark || 0, at = c.thread.length - mark;
          return c.thread.map((m, i) => `${mark > 0 && i === at ? unreadDivHTML() : ''}${m.notice ? noticeCardHTML(m) : `<div class="cc-row ${m.me ? 'me' : 'them'}">
          <div class="cc-bubble ${m.me ? 'me' : 'them'} ${m.req ? 'req' : ''}">${esc(m.text)}</div>
          <div class="cc-meta">${m.who} · ${m.time}</div></div>`}`).join(''); })()}
      </div>
      <div class="cc-composer">
        <div class="cc-input-row">
          <textarea id="dockInput" rows="1" placeholder="${c.kind === 'client' ? 'הודעה ללקוח…' : 'הודעה פנימית…'}"></textarea>
          <button class="cc-send txt" id="dockSend">שלח</button>
        </div>
      </div>
    </div>`;
}
function bindDock() {
  $('#dockBtn').addEventListener('click', () => {
    dockOpen = !dockOpen; if (!dockOpen) dockConv = null;
    dockAnim = dockOpen;            // אנימציה רק כשנפתח מחדש
    renderDock();
    dockAnim = false;
  });
  const exp = $('#dockExpand'); if (exp) exp.addEventListener('click', dockExpand);
  const min = $('#dockMin'); if (min) min.addEventListener('click', () => { dockOpen = false; dockConv = null; renderDock(); });
  const nc = $('#dockNewConv'); if (nc) nc.addEventListener('click', () => { platView = 'contacts'; dockExpand(); });
  const ng = $('#dockNewGroup'); if (ng) ng.addEventListener('click', () => { platView = 'group'; newGroup = { name: '', members: [], sendPerm: 'all', addPerm: 'all' }; dockExpand(); });
  $$('[data-dpf]').forEach(b => b.addEventListener('click', () => { dockFilter = b.dataset.dpf; renderDock(); }));
  const back = $('#dockBack'); if (back) back.addEventListener('click', () => { dockConv = null; renderDock(); });
  $$('.dock-conv').forEach(b => b.addEventListener('click', () => {
    const id = +b.dataset.dconv;
    dockConv = dockConv === id ? null : id;   // לחיצה נוספת על אותה שיחה → הסתרה
    const c = CONVERSATIONS.find(x => x.id === id);
    if (c && dockConv === id) { c.unreadMark = c.unread; c.unread = 0; }   // סימון לקו "לא נקראה"
    renderDock();
  }));
  $$('[data-notice-rec]').forEach(b => b.addEventListener('click', () => openRecordFromChat(b.dataset.noticeRec)));
  $$('#chatDock [data-goto-lead]').forEach(b => b.addEventListener('click', () => openRecordFromChat(b.dataset.gotoLead)));
  const send = $('#dockSend'); if (send) send.addEventListener('click', dockSendMsg);
  const inp = $('#dockInput'); if (inp) inp.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); dockSendMsg(); } });
  const th = $('#dockThread'); if (th) th.scrollTop = th.scrollHeight;
}
function dockSendMsg() {
  const inp = $('#dockInput'); const txt = inp.value.trim(); if (!txt) return;
  const c = CONVERSATIONS.find(x => x.id === dockConv);
  c.thread.push({ me: true, text: txt, who: 'יואב', time: 'עכשיו' }); c.last = txt; inp.value = '';
  renderDock();
  setTimeout(() => {
    const reply = c.kind === 'client' ? 'תודה! ✅' : 'קיבלתי 👍';
    c.thread.push({ me: false, text: reply, who: c.name, time: 'עכשיו' }); c.last = reply;
    playChatSound();
    if ($('#dockThread')) renderDock(); else if (dockConv !== c.id) c.unread = (c.unread || 0) + 1;
  }, 900);
}
function closeChatDock() { dockOpen = false; dockConv = null; if ($('#chatDock')) renderDock(); }
function dockExpand() {
  closeChatDock();
  $$('#nav .nav-item').forEach(x => x.classList.remove('active'));
  const w = $('[data-nav="whatsapp"]'); if (w) w.classList.add('active');
  $$('#procTabs .proc-tab').forEach(x => x.classList.remove('active'));
  if (platView === 'list') enterChatPlatform(); else renderChatPlatform();
}
</script>
