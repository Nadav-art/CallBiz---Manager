<style>
html,body{direction:rtl;margin:0;padding:0;background:#F4F5FA;}
/* ============================================================
   CallBiz Manager – מסך עבודה אחוד
   Design tokens (מבוססים על השפה העיצובית מהמסך)
   ============================================================ */
:root {
  /* צבעי מותג */
  --brand:        #5B4CE6;
  --brand-600:    #4F42D6;
  --brand-700:    #4436C4;
  --brand-soft:   #EEEDFB;
  --brand-soft-2: #F4F3FE;

  /* ניטרליים */
  --bg:           #F4F5FA;
  --surface:      #FFFFFF;
  --surface-2:    #FAFAFD;
  --border:       #E9E9F1;
  --border-2:     #F0F0F6;

  /* טקסט */
  --text:         #1E2233;
  --text-2:       #6B7085;
  --text-3:       #9A9EB1;

  /* סטטוסים */
  --green:        #16A34A;
  --green-bg:     #DCFCE7;
  --orange:       #EA6A2C;
  --orange-bg:    #FDECDD;
  --blue:         #2F6BEB;
  --blue-bg:      #E1EBFF;
  --red:          #DC2626;
  --red-bg:       #FDE4E4;
  --amber:        #B7791F;
  --amber-bg:     #FBF0D9;

  /* מידות */
  --radius-lg: 18px;
  --radius:    12px;
  --radius-sm: 9px;
  --shadow-sm: 0 1px 2px rgba(30,34,51,.05);
  --shadow:    0 6px 24px rgba(30,34,51,.08);
  --shadow-lg: 0 12px 48px rgba(30,34,51,.16);

  --sidebar-w: 92px;
  --drawer-w:  460px;

  --font: "Heebo","Assistant","Segoe UI",Arial,sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  direction: rtl;
  font-size: 14px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; cursor: pointer; }
::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: #D7D8E3; border-radius: 20px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============================================================
   פריסה ראשית
   ============================================================ */
.app { display: flex; min-height: 100vh; }

/* ---- סרגל ניווט ימני ---- */
.sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-inline-start: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center;
  padding: 18px 0;
  position: sticky; top: 0; height: 100vh;
  flex-shrink: 0;
}
.sidebar .logo {
  font-weight: 800; font-size: 12px; text-align: center;
  color: var(--brand); line-height: 1.15; margin-bottom: 22px;
}
.sidebar .logo span { display:block; color: var(--text-3); font-weight:600; font-size:10px; }
.nav { display: flex; flex-direction: column; gap: 6px; width: 100%; align-items: center; }
.nav-item {
  width: 60px; padding: 9px 4px; border-radius: var(--radius);
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  color: var(--text-2); border: none; background: transparent;
  font-size: 10.5px; font-weight: 600; transition: .15s;
}
.nav-item svg { width: 21px; height: 21px; }
.nav-item:hover { background: var(--surface-2); color: var(--text); }
.nav-item.active { background: var(--brand-soft); color: var(--brand-600); }
.sidebar .user {
  margin-top: auto; display:flex; flex-direction:column; align-items:center; gap:4px;
  font-size: 10px; color: var(--text-2); text-align:center;
}
.sidebar .user .av { width:38px; height:38px; border-radius:50%; object-fit:cover; }

/* ---- אזור תוכן ---- */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* ---- כותרת עליונה + טאבים של תהליך ---- */
.topbar {
  background: var(--surface); border-bottom: 1px solid var(--border);
  padding: 12px 22px; display: flex; align-items: center; gap: 14px;
  position: sticky; top: 0; z-index: 20;
}
.topbar .page-title { font-size: 17px; font-weight: 800; white-space: nowrap; }
.proc-tabs { display: flex; gap: 8px; overflow-x: auto; flex: 1; padding-bottom: 2px; }
.proc-tab {
  white-space: nowrap; border: 1px solid var(--border); background: var(--surface);
  color: var(--text-2); padding: 8px 14px; border-radius: 10px;
  font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 7px;
}
.proc-tab:hover { border-color: #D9D9E6; color: var(--text); }
.proc-tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
.proc-tab svg { width: 15px; height: 15px; }

/* ---- אזור עבודה מרכזי ---- */
.workspace { padding: 18px 22px; flex: 1; }

/* ============================================================
   כרטיסים כלליים
   ============================================================ */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); box-shadow: var(--shadow-sm);
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 18px; border-bottom: 1px solid var(--border-2);
}
.card-head .title { display:flex; align-items:center; gap:9px; font-weight: 800; font-size: 15px; }
.card-head .num {
  width: 22px; height: 22px; border-radius: 6px; background: var(--brand);
  color: #fff; font-size: 12px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center;
}

/* ============================================================
   רשימת פניות ראשית
   ============================================================ */
.list-toolbar { display: flex; align-items: center; gap: 10px; padding: 12px 18px; flex-wrap: wrap; }
.btn {
  border: 1px solid var(--border); background: var(--surface); color: var(--text);
  padding: 8px 14px; border-radius: var(--radius-sm); font-weight: 600; font-size: 13px;
  display: inline-flex; align-items: center; gap: 7px; transition: .15s;
}
.btn:hover { background: var(--surface-2); }
.btn svg { width: 15px; height: 15px; }
.btn.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn.primary:hover { background: var(--brand-600); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn.block { width: 100%; justify-content: center; }
.btn.sm { padding: 6px 11px; font-size: 12px; }

.select {
  border: 1px solid var(--border); background: var(--surface); color: var(--text-2);
  padding: 8px 12px; border-radius: var(--radius-sm); font-size: 12.5px; font-weight: 600;
  min-width: 120px; display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.spacer { flex: 1; }

.table-wrap { overflow-x: auto; }
table.list { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 900px; }
table.list thead th {
  text-align: right; color: var(--text-3); font-weight: 700; font-size: 11.5px;
  padding: 10px 14px; border-bottom: 1px solid var(--border);
  background: var(--surface-2); position: sticky; top: 0;
}
table.list tbody td { padding: 11px 14px; border-bottom: 1px solid var(--border-2); vertical-align: middle; }
table.list tbody tr { transition: background .12s; cursor: pointer; }
table.list tbody tr:hover { background: var(--brand-soft-2); }
table.list tbody tr.sel { background: var(--brand-soft); }

.client-cell { display: flex; align-items: center; gap: 10px; justify-content: flex-end; }
.client-cell .av { width: 30px; height: 30px; border-radius: 50%; object-fit: cover; }
.client-cell .meta { text-align: right; }
.client-cell .meta b { display: block; font-weight: 700; }
.client-cell .meta small { color: var(--text-3); font-size: 11px; }

.chip {
  display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
  border-radius: 20px; font-size: 11.5px; font-weight: 700; white-space: nowrap;
}
.chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.chip.green  { color: var(--green);  background: var(--green-bg); }
.chip.orange { color: var(--orange); background: var(--orange-bg); }
.chip.blue   { color: var(--blue);   background: var(--blue-bg); }
.chip.red    { color: var(--red);    background: var(--red-bg); }
.chip.amber  { color: var(--amber);  background: var(--amber-bg); }
.chip.gray   { color: var(--text-2); background: #EFEFF4; }

.row-actions { display: flex; gap: 4px; }
.icon-btn {
  width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-2);
  display: inline-flex; align-items: center; justify-content: center; transition: .15s;
}
.icon-btn:hover { background: var(--brand-soft); color: var(--brand-600); border-color: var(--brand-soft); }
.icon-btn svg { width: 15px; height: 15px; }
.icon-btn.wa:hover  { color: #25D366; }
.icon-btn.tel:hover { color: var(--green); }

.kebab { color: var(--text-3); background:transparent; border:none; padding:4px; border-radius:6px; }
.kebab:hover { background: var(--border-2); }

/* ============================================================
   Drawer ימני
   ============================================================ */
.overlay {
  position: fixed; inset: 0; background: rgba(20,22,34,.34);
  opacity: 0; visibility: hidden; transition: .22s; z-index: 40;
}
.overlay.open { opacity: 1; visibility: visible; }

.drawer {
  position: fixed; top: 0; right: 0; height: 100vh; width: var(--drawer-w);
  max-width: 94vw; background: var(--surface); box-shadow: var(--shadow-lg);
  transform: translateX(100%); transition: transform .28s cubic-bezier(.4,0,.2,1);
  z-index: 50; display: flex; flex-direction: column;
}
.drawer.open { transform: translateX(0); }

.drawer-head { padding: 16px 18px; border-bottom: 1px solid var(--border); }
.drawer-head .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.drawer-head .top .t { display:flex; align-items:center; gap:8px; font-weight: 800; font-size: 15px; }
.drawer-head .top .t .num {
  width: 22px; height: 22px; border-radius: 6px; background: var(--brand); color:#fff;
  font-size: 12px; display:inline-flex; align-items:center; justify-content:center; font-weight:700;
}
.close-btn { border:none; background: var(--border-2); width: 30px; height: 30px; border-radius: 8px; color: var(--text-2); }
.close-btn:hover { background: var(--red-bg); color: var(--red); }

.client-head { display: flex; align-items: center; gap: 12px; }
.client-head .av { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; }
.client-head .info { flex: 1; }
.client-head .info b { font-size: 16px; font-weight: 800; }
.client-head .info small { display: block; color: var(--text-3); }
.client-head .type-badge {
  background: var(--brand-soft); color: var(--brand-600); font-size: 11px;
  font-weight: 700; padding: 4px 10px; border-radius: 20px;
}
.client-head .quick { display: flex; gap: 6px; margin-top: 4px; }

.drawer-body { flex: 1; overflow-y: auto; padding: 14px 16px; }
.drawer-body .sec-title { font-size: 12px; color: var(--text-3); font-weight: 700; margin: 6px 2px 10px; display:flex; align-items:center; gap:6px;}

/* ---- Accordion ---- */
.accordion { display: flex; flex-direction: column; gap: 9px; }
.acc-item { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; background: var(--surface); }
.acc-item.done { border-color: #D6EFDD; }
.acc-head {
  width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 14px;
  background: var(--surface); border: none; text-align: right;
}
.acc-head:hover { background: var(--surface-2); }
.acc-head .state {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: 2px solid var(--border); color: var(--text-3);
}
.acc-head .state svg { width: 13px; height: 13px; }
.acc-item.done  .acc-head .state { background: var(--green); border-color: var(--green); color: #fff; }
.acc-item.active .acc-head .state { border-color: var(--brand); color: var(--brand); }
.acc-head .label { flex: 1; font-weight: 700; font-size: 13.5px; }
.acc-head .sub { color: var(--text-3); font-size: 11.5px; font-weight: 500; }
.acc-head .chev { color: var(--text-3); transition: transform .2s; }
.acc-item.open .acc-head .chev { transform: rotate(180deg); }
.acc-panel { max-height: 0; overflow: hidden; transition: max-height .25s ease; }
.acc-item.open .acc-panel { max-height: 620px; }
.acc-panel-inner { padding: 4px 14px 16px; border-top: 1px solid var(--border-2); }

/* שדות טופס בתוך Accordion */
.field { margin-bottom: 11px; }
.field > label { display: block; font-size: 11.5px; color: var(--text-2); font-weight: 700; margin-bottom: 5px; }
.field input, .field textarea, .field select {
  width: 100%; border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 9px 11px; font-family: inherit; font-size: 13px; color: var(--text); background: var(--surface);
}
.field input:focus, .field textarea:focus, .field select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.field-row { display: flex; gap: 10px; }
.field-row .field { flex: 1; }

.meeting-box { background: var(--brand-soft-2); border: 1px solid var(--brand-soft); border-radius: var(--radius); padding: 12px 14px; }
.meeting-box .line { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; }
.meeting-box .line svg { width: 15px; height: 15px; color: var(--brand-600); }
.meeting-box .actions { display: flex; gap: 8px; margin-top: 10px; }

/* חלוניות זמן */
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.slot { border: 1px solid var(--border); background: var(--green-bg); color: var(--green); border-radius: 9px;
  padding: 9px; text-align: center; font-weight: 700; font-size: 13px; }
.slot:hover { filter: brightness(.97); }
.slot.sel { background: var(--brand); color: #fff; border-color: var(--brand); }

.drawer-foot { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; }

/* ============================================================
   Modal (יומן מלא / כללי)
   ============================================================ */
.modal-wrap {
  position: fixed; inset: 0; z-index: 60; display: none; align-items: center; justify-content: center;
  background: rgba(20,22,34,.4); padding: 24px;
}
.modal-wrap.open { display: flex; }
.modal {
  background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg);
  width: 100%; max-width: 980px; max-height: 90vh; overflow: hidden; display: flex; flex-direction: column;
}
.modal-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--border); }
.modal-head .title { display:flex; align-items:center; gap:9px; font-weight: 800; font-size: 16px; }
.modal-body { overflow: auto; padding: 18px 20px; }

/* מיני-יומן ליום */
.daycal { display: grid; grid-template-columns: 56px 1fr 1fr; gap: 0 10px; }
.daycal .hour { color: var(--text-3); font-size: 11.5px; padding-top: 4px; border-top: 1px solid var(--border-2); text-align: left; padding-left: 6px; }
.daycal .track { border-top: 1px solid var(--border-2); min-height: 46px; position: relative; padding: 3px 0; }
.cal-ev { border-radius: 8px; padding: 6px 9px; font-size: 11.5px; font-weight: 600; margin-bottom: 3px; border-inline-start: 3px solid; }
.cal-ev.brand { background: var(--brand-soft); color: var(--brand-700); border-color: var(--brand); }
.cal-ev.green { background: var(--green-bg); color: var(--green); border-color: var(--green); }
.cal-ev.blue  { background: var(--blue-bg); color: var(--blue); border-color: var(--blue); }
.cal-ev.orange{ background: var(--orange-bg); color: var(--orange); border-color: var(--orange); }

/* ============================================================
   Toast
   ============================================================ */
.toast-host { position: fixed; bottom: 20px; left: 20px; z-index: 90; display: flex; flex-direction: column; gap: 8px; }
.toast {
  background: var(--text); color: #fff; padding: 11px 16px; border-radius: 10px; font-size: 13px; font-weight: 600;
  box-shadow: var(--shadow); display: flex; align-items: center; gap: 9px; animation: slideup .25s;
}
.toast svg { width: 16px; height: 16px; color: #6EE7A8; }
@keyframes slideup { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }

/* עזרי תצוגה */
.muted { color: var(--text-3); }
.hidden { display: none !important; }
/* ============================================================
   CallBiz Manager – הרחבות v2
   סיכום, טבלה מורחבת, טאבים, Work Queue, תזמון חכם
   ============================================================ */

/* ---- כרטיסי סיכום (3.2) ---- */
.summary { display: grid; grid-template-columns: repeat(9, 1fr); gap: 10px; margin-bottom: 16px; }
.sum-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 11px 12px; text-align: right; display: flex; flex-direction: column; gap: 3px;
  transition: .15s; box-shadow: var(--shadow-sm);
}
.sum-card:hover { border-color: #D9D9E6; transform: translateY(-1px); }
.sum-card.active { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.sum-card .v { font-size: 21px; font-weight: 800; line-height: 1; }
.sum-card .v.brand { color: var(--brand-600); } .sum-card .v.orange { color: var(--orange); }
.sum-card .v.red { color: var(--red); } .sum-card .v.blue { color: var(--blue); }
.sum-card .v.green { color: var(--green); } .sum-card .v.amber { color: var(--amber); }
.sum-card .l { font-size: 11px; color: var(--text-2); font-weight: 600; }
@media (max-width: 1400px) { .summary { grid-template-columns: repeat(5, 1fr); } }

/* ---- פריסת עבודה: רשימה + Work Queue ---- */
.work-row { display: flex; gap: 16px; align-items: flex-start; }
.list-card { flex: 1; min-width: 0; }
.queue-card { width: 300px; flex-shrink: 0; }
@media (max-width: 1180px) { .work-row { flex-direction: column; } .queue-card { width: 100%; } }

/* ---- Badge מסלול/ישות ---- */
.badge { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 7px; font-size: 11px; font-weight: 700; }
.badge.blue { color: var(--blue); background: var(--blue-bg); }
.badge.green { color: var(--green); background: var(--green-bg); }
.badge.amber { color: var(--amber); background: var(--amber-bg); }
.badge.orange { color: var(--orange); background: var(--orange-bg); }
.badge.red { color: var(--red); background: var(--red-bg); }
.badge.gray { color: var(--text-2); background: #EFEFF4; }
.chip.sm { padding: 2px 8px; font-size: 10.5px; }

/* נקודת סוג ישות ליד האווטאר */
.ent-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-inline-start: -4px; border: 2px solid #fff; }
.ent-dot.blue { background: var(--blue); } .ent-dot.green { background: var(--green); } .ent-dot.gray { background: var(--text-3); }

/* עמודת הפעולה הבאה */
.next-cell { display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
.next-cell small { color: var(--text-3); font-size: 10.5px; }
.next-cell .chip svg { width: 12px; height: 12px; }
tr.row-over { background: #FEF6F6 !important; }
tr.row-over:hover { background: #FDECEC !important; }

/* ---- Work Queue ---- */
.queue { padding: 8px; display: flex; flex-direction: column; gap: 7px; max-height: 460px; overflow-y: auto; }
.q-item { display: flex; gap: 9px; align-items: flex-start; padding: 10px; border: 1px solid var(--border-2);
  border-radius: 10px; cursor: pointer; transition: .12s; }
.q-item:hover { border-color: var(--brand-soft); background: var(--brand-soft-2); }
.q-rank { width: 22px; height: 22px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 12px;
  font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.q-body { flex: 1; min-width: 0; }
.q-kind { font-size: 11px; color: var(--text-3); font-weight: 600; }
.q-name { font-size: 13px; font-weight: 700; }
.q-why { font-size: 11px; color: var(--text-2); }
.q-prio { align-self: center; }
.queue-foot { padding: 8px 14px; border-top: 1px solid var(--border-2); font-size: 11px; text-align: center; }

/* ---- Drawer: מטא-דאטה + פעולות מהירות + טאבים ---- */
.head-badges { display: flex; gap: 6px; margin-top: 5px; flex-wrap: wrap; }
.head-meta { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 12px; font-size: 12px; color: var(--text-2); }
.head-meta span { display: inline-flex; align-items: center; gap: 5px; }
.head-meta svg { width: 14px; height: 14px; }
.head-meta .sla.green { color: var(--green); } .head-meta .sla.orange { color: var(--orange); } .head-meta .sla.red { color: var(--red); font-weight: 700; }
.quick { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.q-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 7px 6px;
  display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; color: var(--text-2); flex: 1; min-width: 52px; transition: .15s; }
.q-btn svg { width: 17px; height: 17px; }
.q-btn:hover { background: var(--brand-soft); color: var(--brand-600); border-color: var(--brand-soft); }
.q-btn.tel:hover { color: var(--green); } .q-btn.wa:hover { color: #25D366; }
.drawer-tabs { display: flex; gap: 4px; margin-top: 14px; overflow-x: auto; border-bottom: 1px solid var(--border); }
.d-tab { border: none; background: transparent; padding: 8px 11px; font-size: 12.5px; font-weight: 700; color: var(--text-2);
  border-bottom: 2px solid transparent; white-space: nowrap; }
.d-tab:hover { color: var(--text); }
.d-tab.active { color: var(--brand-600); border-bottom-color: var(--brand); }

/* מצבי שלב באקורדיון */
.acc-item .state.green { background: var(--green); border-color: var(--green); color: #fff; }
.acc-item .state.brand { border-color: var(--brand); color: var(--brand); }
.acc-item .state.amber { border-color: var(--amber); color: var(--amber); }
.acc-item .state.red { border-color: var(--red); color: var(--red); }

.acc-head .sub.green { color: var(--green); } .acc-head .sub.brand { color: var(--brand-600); }
.acc-head .sub.amber { color: var(--amber); } .acc-head .sub.red { color: var(--red); } .acc-head .sub.gray { color: var(--text-3); }

.hint { font-size: 11.5px; color: var(--text-2); display: flex; align-items: flex-start; gap: 6px; margin-top: 10px; background: var(--amber-bg); padding: 8px 10px; border-radius: 8px; }

.hint-box svg { width: 15px; height: 15px; color: var(--brand-600); }

/* פרטים (KV) */
.kv { display: flex; flex-direction: column; gap: 1px; }
.kv-row { display: flex; justify-content: space-between; padding: 9px 4px; border-bottom: 1px solid var(--border-2); font-size: 13px; }
.kv-row span { color: var(--text-2); }

/* Timeline */
.timeline { display: flex; flex-direction: column; gap: 0; position: relative; padding-inline-start: 6px; }
.tl-item { display: flex; gap: 12px; padding-bottom: 14px; position: relative; }
.tl-item:not(:last-child)::before { content: ""; position: absolute; right: 5px; top: 14px; bottom: 0; width: 2px; background: var(--border); }
.tl-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--brand); border: 2px solid #fff; box-shadow: 0 0 0 2px var(--brand-soft); flex-shrink: 0; margin-top: 2px; z-index: 1; }
.tl-body { flex: 1; }
.tl-top { display: flex; justify-content: space-between; align-items: baseline; }
.tl-top small { color: var(--text-3); font-size: 11px; }
.tl-desc { font-size: 12.5px; color: var(--text-2); }
.tl-by { font-size: 11px; color: var(--text-3); display: flex; align-items: center; gap: 4px; margin-top: 2px; }
.tl-by svg { width: 12px; height: 12px; }

.empty { text-align: center; padding: 30px 10px; color: var(--text-3); }
.empty svg { width: 34px; height: 34px; opacity: .5; }
.empty p { margin: 8px 0 14px; font-size: 13px; }

/* ---- מודל תזמון חכם (3 עמודות) ---- */
.modal-body.sched { display: grid; grid-template-columns: 1fr 1.15fr .85fr; gap: 0; padding: 0; }
.sched-col { padding: 16px 18px; border-inline-start: 1px solid var(--border-2); }
.sched-col:first-child { border: none; }
.sched-col.mid { background: var(--surface-2); }
.col-title { font-weight: 800; font-size: 13px; display: flex; align-items: center; gap: 7px; margin-bottom: 12px; }
.col-title svg { width: 16px; height: 16px; color: var(--brand-600); }
.col-title .muted { font-weight: 500; font-size: 11px; }
.slot-card { display: block; width: 100%; text-align: right; border: 1px solid var(--border); background: var(--surface);
  border-radius: var(--radius); padding: 11px 13px; margin-bottom: 9px; transition: .15s; }
.slot-card:hover { border-color: var(--brand-soft); }
.slot-card.sel { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.sc-top { display: flex; justify-content: space-between; align-items: center; }
.sc-top b { font-size: 15px; }
.score { background: var(--brand-soft); color: var(--brand-600); font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 20px; }
.sc-owner { font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: 5px; margin-top: 3px; }

.sc-tags { display: flex; gap: 6px; margin-top: 7px; flex-wrap: wrap; }
.tag { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; }
.tag svg { width: 11px; height: 11px; }
.tag.green { color: var(--green); background: var(--green-bg); } .tag.amber { color: var(--amber); background: var(--amber-bg); }
.sum-panel { border: 1px solid var(--border-2); border-radius: var(--radius); padding: 12px; margin-bottom: 12px; min-height: 120px; }

/* פולו-אפ פאנל */
.fu-quick { display: flex; flex-wrap: wrap; gap: 8px; }
.chipbtn { border: 1px solid var(--border); background: var(--surface); border-radius: 20px; padding: 7px 14px; font-size: 12.5px; font-weight: 600; color: var(--text); }
.chipbtn:hover { background: var(--brand-soft); color: var(--brand-600); border-color: var(--brand-soft); }
.fu-windows { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fu-win { border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: 11px 12px; text-align: right; }
.fu-win b { display: block; font-size: 14px; }
.fu-win .cap { font-size: 11px; color: var(--text-2); }
.fu-win.full { opacity: .55; cursor: not-allowed; }
.fu-win:not(.full):hover { border-color: var(--brand); }
.cap-bar { height: 5px; background: var(--border-2); border-radius: 20px; margin-top: 7px; overflow: hidden; }
.cap-bar i { display: block; height: 100%; background: var(--brand); }

/* יומן toolbar */
.cal-toolbar { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
/* ============================================================

/* ---- אשף תיאום: מחוון שלבים ---- */
.wiz-steps { display: flex; gap: 4px; padding: 12px 20px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.wiz-step { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; color: var(--text-3); white-space: nowrap; padding: 2px 6px; }

.wiz-step .dot svg { width: 12px; height: 12px; }
.wiz-step.active { color: var(--brand-600); }
.wiz-step.active .dot { border-color: var(--brand); color: var(--brand); }
.wiz-step.done { color: var(--green); }

.opt-card.sel { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.opt-ic { width: 42px; height: 42px; border-radius: 12px; background: var(--brand-soft); color: var(--brand-600); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 8px; }
.opt-ic svg { width: 22px; height: 22px; }
.opt-card b { display: block; font-size: 14px; }
.opt-card small { color: var(--text-3); font-size: 11.5px; }

/* בחירת גורם מטפל */
.emp-list { display: flex; flex-direction: column; gap: 8px; }
.emp-row { display: flex; align-items: center; gap: 11px; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: 11px 13px; text-align: right; transition: .15s; }
.emp-row:hover { border-color: var(--brand-soft); }
.emp-row.sel { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.emp-row.busy { opacity: .7; }
.emp-av { width: 36px; height: 36px; border-radius: 50%; background: #8B93A7; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; }
.emp-av svg { width: 18px; height: 18px; }
.emp-info { flex: 1; } .emp-info b { display: block; } .emp-info small { color: var(--text-3); font-size: 11.5px; }

/* שיטת תיאום */
.method-list { display: flex; flex-direction: column; gap: 10px; }
.method { display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); background: var(--surface); border-radius: var(--radius); padding: 14px; text-align: right; transition: .15s; }
.method svg { width: 22px; height: 22px; color: var(--brand-600); flex-shrink: 0; }
.method div { flex: 1; } .method b { display: block; } .method small { color: var(--text-3); font-size: 11.5px; }
.method:hover { border-color: var(--brand-soft); }
.method.sel { border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.method.rec { background: var(--brand-soft-2); }

/* בחירת זמן (המלצות) */
.sched-split { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
.rec-slot { display: flex; align-items: center; gap: 10px; width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 11px 13px; margin-bottom: 8px; text-align: right; transition: .15s; }
.rec-slot b { font-size: 14px; }
.rec-slot small { color: var(--text-3); font-size: 11px; flex: 1; }
.rec-slot:hover { border-color: var(--brand-soft); }
.rec-slot.sel { border-color: var(--brand); background: var(--brand-soft-2); }
.rec-check { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--green); color: var(--green); display: inline-flex; align-items: center; justify-content: center; }
.rec-check svg { width: 13px; height: 13px; }
.rec-side { background: var(--surface-2); border-radius: var(--radius); padding: 14px; }
.set-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 7px; }
.set-list li { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-2); }
.set-list svg { width: 14px; height: 14px; color: var(--green); }

/* מסך הצלחה */
.modal-body.success { text-align: center; padding: 26px 24px; }
.succ-ring { width: 64px; height: 64px; border-radius: 50%; background: var(--green-bg); color: var(--green); display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px; }

.succ-card { border: 1px solid var(--border); border-radius: var(--radius); padding: 12px; text-align: right; }

/* ---- עורך "הפעולה הבאה" inline ---- */

.na-sel { width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 9px; font-family: inherit; font-size: 12.5px; margin-bottom: 10px; }

/* ---- כרטיס מידע מהיר (hover) ---- */
.hover-card { position: fixed; z-index: 65; width: 240px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 13px; animation: fadein .12s; }
@keyframes fadein { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; } }
.hc-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.hc-head b { display: block; } .hc-head small { color: var(--text-3); font-size: 11.5px; }
.hc-stats { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--text-2); padding-bottom: 10px; border-bottom: 1px solid var(--border-2); }
.hc-stats div { display: flex; align-items: center; gap: 7px; }
.hc-stats svg { width: 14px; height: 14px; color: var(--text-3); }
.hc-actions { display: flex; gap: 6px; margin-top: 10px; }

/* ---- סיום פגישה AI ---- */

.ai-badge svg { width: 14px; height: 14px; }

.out-btn:hover { border-color: var(--brand-soft); }
.out-btn.sel { border-color: var(--brand); background: var(--brand-soft); color: var(--brand-700); }
.ai-checklist { background: var(--surface-2); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 16px; }
.ai-item { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 0; cursor: pointer; }
.ai-item input { width: 16px; height: 16px; accent-color: var(--brand); }

/* ---- WhatsApp ---- */
.wa-head { background: #075E54; color: #fff; }
.wa-head .close-btn { background: rgba(255,255,255,.15); color: #fff; }
.wa-body { background: #ECE5DD; display: flex; flex-direction: column; gap: 8px; min-height: 260px; max-height: 50vh; }

/* ---- תזכורת צפה ---- */
.reminder-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 80;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-width: 460px; animation: rbup .25s; }
@keyframes rbup { from { transform: translate(-50%, 14px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
.rb-ic { width: 38px; height: 38px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-600); display: flex; align-items: center; justify-content: center; }

@media (max-width: 1100px) { .auto-grid { grid-template-columns: 1fr; } }
.auto-list { padding: 8px; display: flex; flex-direction: column; gap: 8px; }
.auto-item { display: flex; align-items: center; gap: 12px; border: 1px solid var(--border-2); border-radius: var(--radius); padding: 12px 14px; }
.auto-body { flex: 1; }
.auto-top { display: flex; align-items: center; gap: 8px; }
.auto-top b { font-size: 13.5px; }
.auto-desc { font-size: 11.5px; color: var(--text-2); margin-top: 3px; }

/* תרשים זרימה */
.flow-wrap { padding: 16px; }
.flow-node { display: flex; align-items: center; gap: 12px; border: 1px solid var(--border); border-radius: var(--radius); padding: 11px 14px; }
.flow-node .fn-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.flow-node.blue .fn-dot { background: var(--blue); } .flow-node.gray .fn-dot { background: var(--text-3); }
.flow-node.amber .fn-dot { background: var(--orange); } .flow-node.green .fn-dot { background: var(--green); }
.flow-node.brand .fn-dot { background: var(--brand); }
.fn-body b { display: block; font-size: 13px; } .fn-body small { color: var(--text-3); font-size: 11px; }
.flow-arrow { display: flex; justify-content: center; color: var(--text-3); padding: 3px 0; }
.flow-arrow svg { width: 18px; height: 18px; }

/* ---- יומן רב-עובדים ---- */
.mcal { display: grid; }
.mcal-corner { border-bottom: 1px solid var(--border); border-inline-start: 1px solid var(--border-2); }
.mcal-owner { padding: 12px; text-align: center; font-weight: 800; font-size: 13px; border-bottom: 1px solid var(--border); border-inline-start: 1px solid var(--border-2); }
.mcal-hour { padding: 6px 8px; font-size: 11px; color: var(--text-3); text-align: left; border-top: 1px solid var(--border-2); }
.mcal-cell { min-height: 42px; border-top: 1px solid var(--border-2); border-inline-start: 1px solid var(--border-2); padding: 3px; }
.mcal-ev { border-radius: 8px; padding: 6px 9px; font-size: 11px; font-weight: 700; border-inline-start: 3px solid; cursor: pointer; }
.mcal-ev small { display: block; font-weight: 500; opacity: .8; font-size: 10px; }
.mcal-ev.brand { background: var(--brand-soft); color: var(--brand-700); border-color: var(--brand); }
.mcal-ev.green { background: var(--green-bg); color: var(--green); border-color: var(--green); }
.mcal-ev.blue { background: var(--blue-bg); color: var(--blue); border-color: var(--blue); }
.mcal-ev.orange { background: var(--orange-bg); color: var(--orange); border-color: var(--orange); }
.mcal-ev.gray { background: #EFEFF4; color: var(--text-2); border-color: var(--text-3); }

/* ---- מנוע Workflow דינמי ---- */
.wf-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; margin-bottom: 16px; }
.wf-stages { padding: 10px 12px; display: flex; flex-direction: column; gap: 5px; }
.wf-stage { display: flex; align-items: center; gap: 9px; font-size: 12.5px; padding: 6px 8px; border-radius: 8px; background: var(--surface-2); }
.wf-num { width: 20px; height: 20px; border-radius: 50%; background: var(--brand-soft); color: var(--brand-600); font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
/* ============================================================
   CallBiz Manager – v5: דוחות, KPI, משפך, AI, הרשאות, המתנה
   ============================================================ */

/* ---- אריחי KPI ---- */
.kpi-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 16px; }
@media (max-width: 1400px) { .kpi-grid { grid-template-columns: repeat(4, 1fr); } }
@media (max-width: 900px)  { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
.kpi-tile { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 13px 14px; box-shadow: var(--shadow-sm); }
.kpi-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.kpi-ic { width: 30px; height: 30px; border-radius: 9px; background: var(--brand-soft); color: var(--brand-600);
  display: inline-flex; align-items: center; justify-content: center; }
.kpi-ic svg { width: 16px; height: 16px; }
.trend { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 20px; }
.trend.green { color: var(--green); background: var(--green-bg); }
.trend.red { color: var(--red); background: var(--red-bg); }
.kpi-val { font-size: 24px; font-weight: 800; line-height: 1; }
.kpi-val small { font-size: 12px; font-weight: 600; color: var(--text-3); margin-inline-start: 3px; }
.kpi-label { font-size: 11.5px; color: var(--text-2); font-weight: 600; margin-top: 5px; }

/* ---- שורות דוח ---- */
.report-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; align-items: start; }
@media (max-width: 1000px) { .report-row { grid-template-columns: 1fr; } }

/* ---- משפך ---- */
.funnel { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.fn-row { display: flex; align-items: center; gap: 12px; }
.fn-label { width: 78px; font-size: 12.5px; display: flex; justify-content: space-between; }
.fn-label b { font-weight: 800; }
.fn-bar-wrap { flex: 1; background: var(--surface-2); border-radius: 8px; height: 26px; overflow: hidden; }
.fn-bar { height: 100%; border-radius: 8px; transition: width .4s; }
.fn-bar.blue { background: var(--blue); } .fn-bar.brand { background: var(--brand); }
.fn-bar.amber { background: var(--amber); } .fn-bar.green { background: var(--green); }
.fn-conv { width: 42px; text-align: center; font-size: 12px; font-weight: 800; color: var(--green); }

/* ---- פגישות לפי נציג ---- */
.repbars { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.rep-row { display: flex; align-items: center; gap: 12px; }
.rep-name { width: 78px; font-size: 12.5px; font-weight: 600; }
.rep-bar-wrap { flex: 1; }
.rep-bar { background: var(--brand); color: #fff; height: 26px; border-radius: 8px; display: flex; align-items: center;
  justify-content: flex-start; padding: 0 10px; font-size: 12px; font-weight: 800; min-width: 34px; transition: width .4s; }
.rep-util { width: 82px; text-align: left; }

/* ---- סטטיסטיקת פולו-אפ ---- */
.fu-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 18px; }
.fu-stat { text-align: center; border: 1px solid var(--border-2); border-radius: var(--radius); padding: 14px 8px; }
.fu-stat b { display: block; font-size: 26px; font-weight: 800; }
.fu-stat b.green { color: var(--green); } .fu-stat b.red { color: var(--red); } .fu-stat b.blue { color: var(--blue); }
.fu-stat span { font-size: 11.5px; color: var(--text-2); }

/* ---- תובנות AI ---- */
.card-head .ai-badge { margin: 0; }
.ai-insights { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.ai-ins { border: 1px solid var(--border-2); border-radius: var(--radius); padding: 12px 14px; border-inline-start: 3px solid var(--brand); }
.ai-ins.high { border-inline-start-color: var(--red); }
.ai-ins.medium { border-inline-start-color: var(--orange); }
.ai-ins.info { border-inline-start-color: var(--blue); }
.ai-ins-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
.ai-ins-type { font-size: 11px; font-weight: 800; color: var(--brand-600); }
.ai-ins-name { font-size: 12px; font-weight: 700; }
.ai-ins-text { font-size: 12px; color: var(--text-2); margin-bottom: 9px; }

/* ---- מטריצת הרשאות ---- */
.perm-table th:not(:first-child), .perm-table td:not(:first-child) { text-align: center; }
.perm-cell { text-align: center; }
.perm-table .toggle { transform: scale(.85); }
/* ============================================================
   CallBiz Manager – v6: יומן פונקציונלי (יום/שבוע/חודש + ניווט)
   ============================================================ */

/* ---- Segmented control יום/שבוע/חודש ---- */
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 9px; padding: 2px; }
.seg-btn { border: none; background: transparent; padding: 6px 14px; border-radius: 7px; font-size: 12.5px; font-weight: 700; color: var(--text-2); }
.seg-btn.on { background: var(--brand); color: #fff; }
.seg-btn:not(.on):hover { color: var(--text); }

/* ---- ניווט קדימה/אחורה + היום ---- */
.cal-nav { display: inline-flex; align-items: center; gap: 6px; }
.cal-nav .icon-btn { width: 32px; height: 32px; }
.cal-label { font-size: 13.5px; font-weight: 800; color: var(--text); }

/* ---- כותרת עובד/יום בשבוע ---- */
.mcal-owner.is-today { background: var(--brand-soft); color: var(--brand-700); }
.mcal-owner small { display: block; font-weight: 600; font-size: 11px; color: var(--text-3); }
.mcal-owner.is-today small { color: var(--brand-600); }

/* ---- משבצת פנויה לבחירה ---- */
.slot-free { cursor: pointer; transition: background .12s; }
.slot-free:hover { background: var(--brand-soft-2); }
.slot-free.sel { background: var(--brand-soft); }
.slot-pick { display: flex; align-items: center; justify-content: center; gap: 4px; height: 100%; min-height: 34px;
  color: var(--brand-600); font-size: 11px; font-weight: 800; border: 1px dashed var(--brand); border-radius: 8px; }
.slot-pick svg { width: 12px; height: 12px; }

/* ---- תצוגת חודש ---- */
.mo-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.mo-head { padding: 10px; text-align: center; font-weight: 800; font-size: 12px; color: var(--text-3);
  border-bottom: 1px solid var(--border); border-inline-start: 1px solid var(--border-2); }
.mo-head:first-child { border-inline-start: none; }
.mo-cell { min-height: 92px; border-top: 1px solid var(--border-2); border-inline-start: 1px solid var(--border-2);
  padding: 7px 8px; cursor: pointer; transition: background .12s; position: relative; }
.mo-cell:nth-child(7n+1) { border-inline-start: none; }
.mo-cell:hover { background: var(--brand-soft-2); }
.mo-cell.out { background: var(--surface-2); }
.mo-cell.out .mo-num { color: var(--text-3); opacity: .5; }
.mo-cell.today { background: var(--brand-soft); }
.mo-num { font-size: 13px; font-weight: 700; }
.mo-cell.today .mo-num { background: var(--brand); color: #fff; width: 24px; height: 24px; border-radius: 50%;
  display: inline-flex; align-items: center; justify-content: center; }
.mo-dots { display: flex; align-items: center; gap: 3px; margin-top: 8px; flex-wrap: wrap; }
.mo-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--brand); }
.mo-dots span { font-size: 10px; color: var(--text-3); font-weight: 700; }
.mo-cnt { font-size: 10.5px; color: var(--text-2); margin-top: 4px; }
@media (max-width: 700px) { .mo-cell { min-height: 62px; } .mo-cnt { display: none; } }
/* ============================================================
   CallBiz Manager – v7: הגדרות קומפקטיות (צמצום מרווחים + אריזה)
   ============================================================ */

/* פריסה צפופה יותר – 3 עמודות עם מילוי חכם של פערים */
.settings-grid {
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  grid-auto-flow: row dense;
  align-items: start;
}
.settings-grid .card { align-self: start; }
.set-card.wide { grid-column: span 2; }
@media (max-width: 1280px) { .settings-grid { grid-template-columns: repeat(2, 1fr); } .set-card.wide { grid-column: span 2; } }
@media (max-width: 860px)  { .settings-grid { grid-template-columns: 1fr; } .set-card.wide { grid-column: span 1; } }

/* כותרת מסך צמודה יותר */
.view-head { margin-bottom: 12px; }

/* פנים הכרטיס – מרווחים מצומצמים */
.settings-grid .card-head { padding: 9px 13px; }
.settings-grid .card-head .title { font-size: 13.5px; }
.set-body { padding: 6px 13px 8px; }
.set-row { padding: 5px 0; font-size: 12.5px; }

/* טבלאות מיני צפופות */
.settings-grid .mini-table th { padding: 5px 8px; font-size: 10.5px; }
.settings-grid .mini-table td { padding: 5px 8px; }

/* שדות קטנים */
.num-in { width: 52px; padding: 4px 7px; }
.toggle { width: 34px; height: 20px; }
.toggle i { width: 16px; height: 16px; }
.toggle.on i { right: 16px; }

/* צ'יפים/פילים צמודים */
.chips-title { margin-bottom: 6px; }
.chips-wrap { gap: 6px; }
.pill { padding: 4px 10px; font-size: 11.5px; }

/* רמזים קומפקטיים */
.settings-grid .hint { margin-top: 6px; padding: 6px 9px; }

/* מטריצת הרשאות – שורות נמוכות */
.perm-table td, .perm-table th { padding: 4px 6px; }
.perm-table .perm-cell { line-height: 1; }
/* ============================================================
   CallBiz Manager – v8: תיקוני אייקונים + טופס פנייה חדשה
   ============================================================ */

/* תיקון: אייקון ה-SVG בכותרות משנה התנפח (ללא width מפורש) */
.sec-title svg { width: 16px; height: 16px; flex-shrink: 0; }
.card-head .num svg,
.modal-head .title .num svg,
.vh-title .num svg { width: 14px; height: 14px; }

/* סדר עמודות RTL: לקוח בעמודה הימנית, צמוד לימין */
.client-cell { justify-content: flex-start; }
.client-cell .meta { text-align: right; }
.ent-dot { margin-inline-start: -6px; margin-inline-end: 2px; }

/* רמז כפילות בטופס פנייה חדשה */
.dup-hint { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2);
  background: var(--surface-2); border: 1px solid var(--border-2); border-radius: 9px; padding: 9px 12px; margin-bottom: 14px; }
.dup-hint svg { width: 15px; height: 15px; flex-shrink: 0; color: var(--text-3); }
.dup-hint.warn { background: var(--red-bg); border-color: #F3C9C9; color: var(--red); }
.dup-hint.warn svg { color: var(--red); }
.dup-hint.warn .btn { margin-inline-start: auto; }
/* ============================================================
   CallBiz Manager – v9: חלון צ'אט (הצלבה עם "צ'אט צוות · קוליביז")
   פלטת oklch תואמת לפלטפורמת הצ'אט
   ============================================================ */
.cbchat { display: flex; flex-direction: column; height: 100%; font-family: 'Heebo', var(--font); }

/* טאבים */
.cc-tabs { display: flex; align-items: center; gap: 4px; padding: 8px 10px; border-bottom: 1px solid oklch(93% 0.006 250); background: #fff; }
.cc-tab { border: none; background: transparent; padding: 8px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 700;
  color: oklch(50% 0.01 250); display: flex; align-items: center; gap: 6px; font-family: inherit; }
.cc-tab svg { width: 15px; height: 15px; }
.cc-tab.on { background: oklch(95% 0.03 250); color: oklch(48% 0.18 250); }
.cc-close { margin-inline-start: auto; }

/* כותרת */
.cc-head { display: flex; align-items: center; gap: 10px; padding: 13px 18px; color: #fff; }
.cc-head.client   { background: oklch(52% 0.15 145); }   /* לקוח – ירקרק (WhatsApp) */
.cc-head.internal { background: oklch(52% 0.18 250); }   /* פנימי – כחול הפלטפורמה */
.cc-recip { display: flex; align-items: center; gap: 9px; flex: 1; }
.cc-recip b { font-size: 15px; font-weight: 800; }
.cc-recip small { display: block; font-size: 11px; opacity: .9; }
.cc-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.cc-back { border: none; background: oklch(100% 0 0 / .18); color: #fff; width: 28px; height: 28px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.cc-back svg { width: 16px; height: 16px; }
.cc-badge { font-size: 10.5px; font-weight: 800; padding: 4px 9px; border-radius: 20px; display: inline-flex; align-items: center; gap: 4px; background: oklch(100% 0 0 / .2); }
.cc-badge svg { width: 12px; height: 12px; }

/* באנר הקשר (פנימי) */
.cc-context { background: oklch(97% 0.03 250); color: oklch(45% 0.06 250); font-size: 11.5px; padding: 8px 16px;
  display: flex; align-items: center; gap: 7px; border-bottom: 1px solid oklch(93% 0.01 250); }
.cc-context svg { width: 14px; height: 14px; }

/* תיל השיחה */
.cc-thread { flex: 1; min-height: 0; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px;
  background: oklch(98.5% 0.004 250); }
.cc-row { display: flex; flex-direction: column; max-width: 78%; }
.cc-row.me { align-self: flex-end; }        /* היוזר הנוכחי — תמיד משמאל */
.cc-row.them { align-self: flex-start; }    /* הצד השני (אדם/קבוצה) — תמיד מימין */
.cc-bubble { padding: 9px 13px; border-radius: 12px; font-size: 13px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
.cc-bubble.me { background: oklch(52% 0.18 250); color: #fff; border-top-left-radius: 3px; }
.cc-bubble.them { background: #fff; color: oklch(22% 0.01 250); border: 1px solid oklch(92% 0.006 250); border-top-right-radius: 3px; }
.cc-meta { font-size: 9.5px; color: oklch(58% 0.01 250); margin-top: 3px; }
.cc-row.me .cc-meta { text-align: left; }
.cc-row.them .cc-meta { text-align: right; }
.cc-empty { margin: auto; text-align: center; color: oklch(60% 0.01 250); }
.cc-empty svg { width: 34px; height: 34px; opacity: .5; }
.cc-empty p { font-size: 13px; margin-top: 8px; }

/* קומפוזר */
.cc-composer { background: #fff; border-top: 1px solid oklch(93% 0.006 250); padding: 10px 14px; }
.cc-emoji-row { display: flex; gap: 2px; flex-wrap: wrap; margin-bottom: 8px; }
.cc-emoji { border: none; background: transparent; font-size: 18px; cursor: pointer; padding: 3px; border-radius: 6px; line-height: 1; }
.cc-emoji:hover { background: oklch(95% 0.01 250); }
.cc-input-row { display: flex; gap: 8px; align-items: flex-end; }
.cc-input-row textarea { flex: 1; box-sizing: border-box; min-height: 42px; max-height: 100px; border: 1px solid oklch(88% 0.006 250);
  border-radius: 9px; padding: 10px 14px; font-size: 13px; font-family: inherit; outline: none; resize: none; line-height: 1.4; }
.cc-input-row textarea:focus { border-color: oklch(58% 0.16 250); }
.cc-send { border: none; background: oklch(52% 0.18 250); color: #fff; height: 42px; width: 46px; border-radius: 9px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.cc-send svg { width: 18px; height: 18px; }

/* בורר עמיתים (התייעצות) */
.cc-picker { flex: 1; overflow-y: auto; padding: 16px 18px; display: flex; flex-direction: column; }
.cc-note { display: flex; align-items: flex-start; gap: 7px; font-size: 11.5px; color: oklch(48% 0.08 70);
  background: oklch(97% 0.03 70); border: 1px solid oklch(90% 0.05 70); border-radius: 9px; padding: 9px 11px; margin-bottom: 12px; }
.cc-note svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 1px; }
.cc-search { width: 100%; box-sizing: border-box; border: 1px solid oklch(88% 0.006 250); border-radius: 9px; padding: 9px 12px;
  font-size: 13px; font-family: inherit; outline: none; margin-bottom: 12px; }
.cc-search:focus { border-color: oklch(58% 0.16 250); }
.cc-col-title { font-size: 12px; font-weight: 800; color: oklch(45% 0.01 250); margin-bottom: 8px; }
.cc-col-list { display: flex; flex-direction: column; gap: 8px; }
.cc-col { display: flex; align-items: center; gap: 11px; border: 1px solid oklch(93% 0.006 250); border-radius: 11px; padding: 10px;
  background: #fff; cursor: pointer; text-align: right; font-family: inherit; }
.cc-col:hover { border-color: oklch(80% 0.04 250); }
.cc-av { position: relative; width: 38px; height: 38px; border-radius: 50%; background: oklch(58% 0.14 250); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
.cc-av-dot { position: absolute; bottom: 0; right: 0; width: 11px; height: 11px; border-radius: 50%; border: 2px solid #fff; }
.cc-col-info { flex: 1; min-width: 0; }
.cc-col-info b { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.cc-col-info small { display: block; font-size: 11px; color: oklch(52% 0.01 250); }
.cc-shared { color: oklch(50% 0.12 145) !important; }
.cc-noshared { color: oklch(58% 0.13 70) !important; }
.cc-req { font-size: 9px; font-weight: 700; color: oklch(50% 0.14 70); background: oklch(95% 0.05 70); padding: 1px 6px; border-radius: 6px; }
.cc-legend { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 14px; font-size: 10px; color: oklch(52% 0.01 250); }
.cc-legend span { display: inline-flex; align-items: center; gap: 4px; }
.cc-legend i { width: 8px; height: 8px; border-radius: 50%; }
/* ============================================================
   CallBiz Manager – v10: הגדרות צרות + עורך שעות עבודה
   ============================================================ */

/* צמצום רוחב כולל של מסך ההגדרות */
.settings-grid { max-width: 1040px; }

/* עמודת פעולות בשורה – שני אייקונים צמודים (וואטסאפ + חיוג) */
.row-actions { gap: 5px; }

/* --- כרטיס שעות עבודה: עורך קומפקטי --- */
.wh-card { grid-column: span 2; }
.wh-body { display: flex; flex-direction: column; gap: 8px; padding: 10px 14px; }
.wh-day { border: 1px solid var(--border-2); border-radius: 10px; padding: 9px 11px; background: var(--surface); }
.wh-day.off { opacity: .55; }
.wh-day-head { display: flex; align-items: center; gap: 9px; }
.wh-name { font-size: 13.5px; min-width: 52px; }
.wh-del { margin-inline-start: auto; border: none; background: transparent; color: var(--text-3);
  width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.wh-del:hover { background: var(--red-bg); color: var(--red); }
.wh-del svg { width: 13px; height: 13px; }

.wh-fields { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 8px; padding-inline-start: 47px; }
.wh-day.off .wh-fields { display: none; }
.wh-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.wh-lbl { font-size: 11px; font-weight: 700; color: var(--text-3); min-width: 62px; }
.wh-ranges { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.wh-range { display: inline-flex; align-items: center; gap: 4px; }
.wh-range input[type=time] { border: 1px solid var(--border); border-radius: 7px; padding: 4px 7px; font-family: inherit;
  font-size: 12px; color: var(--text); background: var(--surface); }
.wh-range input[type=time]:focus { outline: none; border-color: var(--brand); }
.wh-range.brk input[type=time] { background: var(--amber-bg); border-color: #EAD9B0; }
.wh-sep { color: var(--text-3); font-size: 12px; }
.wh-none { font-size: 11.5px; color: var(--text-3); }
.wh-x { border: none; background: transparent; color: var(--text-3); width: 18px; height: 18px; border-radius: 5px; cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; }
.wh-x:hover { background: var(--red-bg); color: var(--red); }
.wh-x svg { width: 11px; height: 11px; }
.wh-add { border: 1px dashed var(--border); background: transparent; color: var(--brand-600); border-radius: 7px;
  padding: 3px 9px; font-size: 11px; font-weight: 700; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 3px; }
.wh-add svg { width: 11px; height: 11px; }
.wh-add:hover { background: var(--brand-soft); }

/* --- טבלת משכי תיאום: צרה + עריכה --- */
.dur-table { width: auto; min-width: 0; }
.dur-table th, .dur-table td { padding: 5px 12px; white-space: nowrap; }
.dur-in { display: inline-flex; align-items: center; gap: 3px; }
.dur-in input { width: 44px; border: 1px solid var(--border); border-radius: 7px; padding: 4px 6px; font-family: inherit;
  font-size: 12.5px; text-align: center; color: var(--text); background: var(--surface); }
.dur-in input:focus { outline: none; border-color: var(--brand); }
.dur-in em { font-style: normal; font-size: 10.5px; color: var(--text-3); }
/* ============================================================
   CallBiz Manager – v11: ניהול עובדים · פרופיל · תצוגת מנהל
   ============================================================ */

/* סרגל עובד בכותרת */
.emp-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.emp-select { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--text-2); }
.emp-select select { border: 1px solid var(--border); border-radius: 9px; padding: 7px 11px; font-family: inherit;
  font-size: 12.5px; font-weight: 600; color: var(--text); background: var(--surface); min-width: 190px; }
.emp-select select:focus { outline: none; border-color: var(--brand); }

/* כרטיס פרופיל עובד */
.emp-profile { max-width: 1040px; margin-bottom: 16px; }
.emp-profile-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border-2); flex-wrap: wrap; }
.emp-av-lg { position: relative; width: 44px; height: 44px; border-radius: 50%; background: var(--brand); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 800; flex-shrink: 0; }
.emp-av-dot { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; }
.emp-meta { flex: 1; } .emp-meta b { font-size: 16px; font-weight: 800; } .emp-meta small { display: block; color: var(--text-3); }
.perm-badge { background: var(--brand-soft); color: var(--brand-600); font-size: 11.5px; font-weight: 700; padding: 5px 11px;
  border-radius: 20px; display: inline-flex; align-items: center; gap: 5px; }
.perm-badge svg { width: 13px; height: 13px; }
.avail-sel { border: 1px solid var(--border); border-radius: 9px; padding: 6px 10px; font-family: inherit; font-size: 12px; font-weight: 600; background: var(--surface); color: var(--text); }
.emp-profile-body { padding: 12px 16px; display: flex; flex-direction: column; gap: 12px; }
.tag-group { display: flex; align-items: flex-start; gap: 10px; }
.tag-lbl { font-size: 11.5px; font-weight: 700; color: var(--text-3); min-width: 84px; padding-top: 5px; }
.tag-wrap { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; }
.tag-chip { border: 1px solid var(--border); background: var(--surface); color: var(--text-2); border-radius: 20px;
  padding: 5px 12px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; transition: .12s; }
.tag-chip:hover { border-color: #D9D9E6; }
.tag-chip.on { background: var(--brand); color: #fff; border-color: var(--brand); }
.emp-profile-note { display: flex; align-items: flex-start; gap: 7px; font-size: 11.5px; color: var(--text-2);
  background: var(--surface-2); padding: 9px 14px; border-top: 1px solid var(--border-2); }
.emp-profile-note svg { width: 14px; height: 14px; flex-shrink: 0; color: var(--brand-600); margin-top: 1px; }

/* בורר יום להוספה (popover) */
.day-pop { position: fixed; z-index: 70; background: var(--surface); border: 1px solid var(--border); border-radius: 11px;
  box-shadow: var(--shadow-lg); padding: 8px; min-width: 130px; display: flex; flex-direction: column; gap: 2px; }
.day-pop-title { font-size: 10.5px; font-weight: 700; color: var(--text-3); padding: 4px 8px 6px; }
.day-pop button { border: none; background: transparent; text-align: right; padding: 8px 10px; border-radius: 7px;
  font-family: inherit; font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; }
.day-pop button:hover { background: var(--brand-soft); color: var(--brand-600); }

/* תצוגת מנהל – טבלת עובדים */
.staff-table { min-width: 820px; }
.staff-table .cell-tags { max-width: 220px; }
.emp-av-sm { width: 28px; height: 28px; border-radius: 50%; background: #8B93A7; color: #fff; display: inline-flex;
  align-items: center; justify-content: center; font-size: 11px; font-weight: 700; }
.mini-tag { display: inline-block; background: var(--surface-2); border: 1px solid var(--border-2); border-radius: 6px;
  padding: 2px 7px; font-size: 10.5px; color: var(--text-2); margin: 2px 2px 0 0; }
.avail-pill { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; }
.avail-pill i { width: 8px; height: 8px; border-radius: 50%; }

/* צ'קבוקסים בטופס הוספת עובד */
.chk-wrap { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; cursor: pointer; }
.chk input { width: 15px; height: 15px; accent-color: var(--brand); }
/* ============================================================
   CallBiz Manager – v12: טיימליין משמרות/הפסקות + פריסה מאוזנת
   ============================================================ */

/* --- טיימליין עוקב: משמרת / הפסקה, אחד מעל השני --- */
.wh-segs { display: flex; flex-direction: column; gap: 6px; margin-top: 9px; padding-inline-start: 47px; }
.seg { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 9px; }
.seg.shift { background: var(--brand-soft-2); }
.seg.break { background: var(--amber-bg); }
.seg-lbl { font-size: 11.5px; font-weight: 800; min-width: 82px; }
.seg.shift .seg-lbl { color: var(--brand-600); }
.seg.break .seg-lbl { color: var(--amber); }
.seg-times { display: inline-flex; align-items: center; gap: 6px; }
.seg-times input[type=time] { border: 1px solid var(--border); border-radius: 7px; padding: 5px 8px; font-family: inherit;
  font-size: 12.5px; color: var(--text); background: #fff; }
.seg-times input[type=time]:focus { outline: none; border-color: var(--brand); }
.seg-times input[readonly] { background: var(--surface-2); color: var(--text-3); cursor: not-allowed; }
.seg-actions { margin-inline-start: auto; display: inline-flex; align-items: center; gap: 6px; }
.wh-add.shift { color: var(--brand-600); border-color: var(--brand-soft); }
.wh-add.brk { color: var(--amber); border-color: #EAD9B0; }
.wh-add.brk:hover { background: var(--amber-bg); }

/* --- פריסה מאוזנת: שעות פעילות מלא · שאר הכרטיסים masonry · גישה מלא --- */
.wh-card { max-width: 1040px; margin-bottom: 16px; }
.settings-grid {
  display: block;              /* דורס את ה-grid הקודם */
  column-count: 2;
  column-gap: 16px;
  max-width: 1040px;
}
.settings-grid > .card {
  break-inside: avoid;
  -webkit-column-break-inside: avoid;
  margin: 0 0 16px;
  width: 100%;
}
.settings-full { max-width: 1040px; display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
@media (max-width: 820px) { .settings-grid { column-count: 1; } }

/* הדגשת עמודת ההרשאה של העובד הנוכחי */
.perm-hl { background: var(--brand-soft-2); }
th.perm-hl { color: var(--brand-600); }
/* ============================================================
   CallBiz Manager – פלטפורמת "צ'אט צוות" (עיצוב מלא לפי ה-ZIP)
   ============================================================ */
:root { --pblue: oklch(52% 0.2 262); --pblue-soft: oklch(96% 0.03 262); --pblue-bd: oklch(88% 0.05 262); }
.plat { display: flex; flex-direction: column; height: calc(100vh - 130px); min-height: 560px; overflow: hidden;
  border: 1px solid oklch(92% 0.006 250); border-radius: 16px; background: oklch(98.5% 0.004 250); font-family: 'Heebo', var(--font); }

/* ---- כותרת ---- */
.plat-head { display: flex; align-items: center; gap: 16px; padding: 15px 24px; background: #fff; border-bottom: 1px solid oklch(92% 0.006 250); flex-wrap: wrap; }
.plat-brand { display: flex; align-items: center; gap: 11px; }
.plat-logo { width: 44px; height: 44px; border-radius: 12px; background: var(--pblue); color: #fff; display: flex; align-items: center; justify-content: center; }
.plat-logo svg { width: 23px; height: 23px; }
.plat-brand b { font-size: 19px; font-weight: 800; }
.plat-brand small { display: flex; align-items: center; gap: 5px; font-size: 12px; color: oklch(52% 0.01 250); }
.pdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.plat-head-actions { margin-inline-start: auto; display: flex; gap: 8px; flex-wrap: wrap; }
.pbtn { border: 1px solid var(--pblue); border-radius: 10px; padding: 9px 16px; font-size: 13px; font-weight: 700; font-family: inherit;
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.pbtn svg { width: 15px; height: 15px; }
.pbtn.solid { background: var(--pblue); color: #fff; }
.pbtn.ghost { background: #fff; color: var(--pblue); }
.pbtn.ghost:hover { background: var(--pblue-soft); }
.pbtn.block { width: 100%; justify-content: center; margin-top: 4px; border-color: oklch(88% 0.006 250); color: oklch(45% 0.01 250); }

/* ---- חיפוש ---- */
.plat-search { display: flex; align-items: center; gap: 9px; margin: 18px 24px 0; background: #fff; border: 1px solid oklch(90% 0.006 250);
  border-radius: 12px; padding: 12px 16px; }
.plat-search span { display: flex; } .plat-search svg { width: 17px; height: 17px; color: oklch(60% 0.01 250); }
.plat-search input { border: none; outline: none; background: transparent; font-family: inherit; font-size: 13.5px; width: 100%; }

/* ---- פילטרים ---- */
.plat-pills { display: flex; gap: 12px; padding: 16px 24px; flex-wrap: wrap; }
.ppill { flex: 1; min-width: 150px; display: flex; align-items: center; gap: 8px; background: #fff; border: 1px solid oklch(91% 0.006 250);
  border-radius: 12px; padding: 13px 16px; font-size: 13px; font-weight: 700; font-family: inherit; color: oklch(40% 0.01 250); cursor: pointer; }
.ppill svg { width: 16px; height: 16px; color: oklch(55% 0.01 250); }
.ppill .pc { margin-inline-start: auto; background: oklch(95% 0.01 250); color: oklch(45% 0.01 250); font-size: 12px; border-radius: 8px; padding: 1px 9px; }
.ppill.on { border-color: var(--pblue); color: var(--pblue); box-shadow: 0 0 0 1px var(--pblue); }
.ppill.on svg { color: var(--pblue); } .ppill.on .pc { background: var(--pblue-soft); color: var(--pblue); }

/* ---- כרטיס רשימה / ריק ---- */
.plat-list-card { flex: 1; min-height: 0; overflow-y: auto; margin: 0 24px 24px; background: #fff; border: 1px solid oklch(92% 0.006 250); border-radius: 16px; }
.plat-list-card.pad { padding: 16px; flex: none; }
.plat-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; min-height: 320px; gap: 6px; text-align: center; }
.pe-ic { width: 90px; height: 90px; color: oklch(70% 0.02 250); display: flex; align-items: center; justify-content: center; margin-bottom: 8px; }
.pe-ic svg { width: 62px; height: 62px; }
.plat-empty b { font-size: 22px; font-weight: 800; color: oklch(30% 0.01 250); }
.plat-empty small { font-size: 13px; color: oklch(55% 0.01 250); }

/* ---- שורות שיחה ---- */
.conv-list.wide { display: flex; flex-direction: column; }
.conv { width: 100%; display: flex; align-items: center; gap: 12px; padding: 13px 18px; border: none; background: transparent;
  border-bottom: 1px solid oklch(95% 0.005 250); text-align: right; font-family: inherit; cursor: pointer; }
.conv:hover { background: oklch(98% 0.006 250); }
.conv-av { position: relative; width: 42px; height: 42px; border-radius: 50%; background: var(--pblue); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex-shrink: 0; }
.conv-av.client { background: oklch(52% 0.15 145); } .conv-av.group { background: oklch(55% 0.12 300); }
.conv-av svg { width: 20px; height: 20px; }
.conv-dot { position: absolute; bottom: 0; right: 0; width: 12px; height: 12px; border-radius: 50%; border: 2px solid #fff; }
.conv-info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.conv-top { display: flex; align-items: center; justify-content: space-between; }
.conv-top b { font-size: 14px; } .conv-top small { font-size: 11px; color: oklch(58% 0.01 250); }
.conv-ctx { font-size: 11.5px; color: oklch(52% 0.01 250); display: flex; align-items: center; gap: 4px; }
.conv-ctx svg { width: 12px; height: 12px; color: oklch(52% 0.15 145); }
.conv-last { font-size: 12px; color: oklch(45% 0.01 250); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conv-badge { background: var(--pblue); color: #fff; font-size: 11px; font-weight: 800; min-width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 0 6px; flex-shrink: 0; }

/* ---- מסכי משנה ---- */
.plat-sub { flex: 1; min-height: 0; overflow-y: auto; padding: 22px 24px 26px; display: flex; flex-direction: column; }
.plat-sub-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.plat-sub-head b { font-size: 20px; font-weight: 800; }
.plat-back { margin-inline-start: auto; border: none; background: transparent; color: var(--pblue); font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.plat-back svg { width: 15px; height: 15px; }
.plat-back.light { color: #fff; margin: 0; }
.plat-sub .plat-search { margin: 0 0 14px; }
.plat-sec-title { font-size: 15px; font-weight: 800; margin: 8px 0 12px; }

/* שיחה כללית (מקווקו) */
.ct-general { display: flex; align-items: center; gap: 14px; width: 100%; text-align: right; font-family: inherit; cursor: pointer;
  border: 1.5px dashed var(--pblue); background: var(--pblue-soft); border-radius: 14px; padding: 18px; margin-bottom: 22px; }
.ct-general .ct-info { flex: 1; } .ct-general b { font-size: 16px; } .ct-general small { color: oklch(52% 0.01 250); font-size: 12px; }
.ct-gicon { width: 46px; height: 46px; border-radius: 11px; background: #fff; display: flex; align-items: center; justify-content: center; }
.ct-gicon svg { width: 24px; height: 24px; color: var(--pblue); }
.ct-arrow { color: oklch(40% 0.01 250); } .ct-arrow svg { width: 20px; height: 20px; }

/* כרטיסי איש קשר */
.ct-list { display: flex; flex-direction: column; gap: 12px; }
.ct-card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: right; font-family: inherit; cursor: pointer;
  background: #fff; border: 1px solid oklch(93% 0.006 250); border-radius: 14px; padding: 16px 18px; }
.ct-card:hover { border-color: var(--pblue-bd); box-shadow: 0 4px 14px oklch(52% 0.2 262 / 0.08); }
.ct-info { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.ct-info b { font-size: 17px; font-weight: 800; } .ct-info small { font-size: 13px; color: oklch(52% 0.01 250); }
.ct-avail { font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; gap: 5px; }
.ct-avail.on { color: oklch(52% 0.15 145); } .ct-avail.on::before { content: '●'; font-size: 9px; }
.ct-avail.off { color: oklch(60% 0.01 250); } .ct-avail.off::before { content: '●'; font-size: 9px; color: oklch(72% 0.02 250); }
.ct-moved { color: oklch(55% 0.13 70) !important; }
.ct-av { position: relative; width: 62px; height: 62px; border-radius: 50%; background: var(--pblue); color: #fff;
  display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; flex-shrink: 0; }
.ct-av.lg { width: 66px; height: 66px; } .ct-av.sm { width: 40px; height: 40px; font-size: 13px; }
.ct-dot { position: absolute; bottom: 3px; right: 3px; width: 14px; height: 14px; border-radius: 50%; border: 3px solid #fff; }

/* איש קשר נבחר (באנר) */
.ct-selected { display: flex; align-items: center; gap: 14px; background: var(--pblue-soft); border: 1px solid oklch(93% 0.02 262);
  border-radius: 14px; padding: 16px 18px; margin-bottom: 18px; }
.ct-selected > div { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.ct-selected b { font-size: 18px; font-weight: 800; } .ct-selected small { font-size: 13px; color: oklch(52% 0.01 250); }

/* בחירת פעילות */
.plat-open-title { margin-bottom: 14px; } .plat-open-title b { font-size: 17px; font-weight: 800; display: block; }
.plat-open-title small { font-size: 13px; color: oklch(55% 0.01 250); }
.act-card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: right; font-family: inherit; cursor: pointer;
  background: #fff; border: 1px solid oklch(93% 0.006 250); border-radius: 14px; padding: 18px; margin-bottom: 12px; }
.act-card:hover { border-color: var(--pblue-bd); }
.act-card b { flex: 1; font-size: 17px; font-weight: 800; }
.act-card.general { border-style: dashed; border-color: var(--pblue); }
.act-gen { flex: 1; } .act-gen b { font-size: 16px; } .act-gen small { display: block; font-size: 12px; color: oklch(55% 0.01 250); }
.act-ic { width: 46px; height: 46px; border-radius: 11px; background: var(--pblue-soft); display: flex; align-items: center; justify-content: center; }
.act-ic svg { width: 23px; height: 23px; color: var(--pblue); }

/* ---- קבוצה חדשה ---- */
.plat-sub-head.grp .grp-ic { width: 44px; height: 44px; border-radius: 12px; background: var(--pblue); color: #fff; display: flex; align-items: center; justify-content: center; }
.plat-sub-head.grp .grp-ic svg { width: 22px; height: 22px; }
.plat-sub-head.grp > div { flex: 1; } .plat-sub-head.grp small { display: block; font-size: 12px; color: oklch(55% 0.01 250); font-weight: 500; }
.plat-sub-head.grp .plat-back { background: oklch(95% 0.006 250); border-radius: 50%; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; color: oklch(45% 0.01 250); }
.grp-lbl { font-size: 13.5px; font-weight: 700; margin: 8px 0 8px; } .req { color: oklch(55% 0.2 25); }
.grp-in { border: 1px solid oklch(90% 0.006 250); border-radius: 12px; padding: 13px 16px; font-family: inherit; font-size: 14px; outline: none; margin-bottom: 6px; }

   CallBiz Manager – צ'אט מוצמד (Docked) + התראה לחיצה בצ'אט

/* כפתור צף בתחתית שמאל – מקובע; הפאנל נפתח מעליו (absolute) כך שה-X נשאר בדיוק במקום האייקון */
#chatDock { position: fixed; bottom: 20px; left: 20px; z-index: 85; width: 56px; height: 56px; }
.dock-btn { position: relative; width: 56px; height: 56px; border-radius: 50%; border: none; cursor: pointer;
  background: oklch(52% 0.18 250); color: #fff; box-shadow: 0 8px 24px oklch(52% 0.18 250 / 0.4);
  display: flex; align-items: center; justify-content: center; transition: transform .15s; }

.dock-btn svg { width: 26px; height: 26px; }
.dock-badge { position: absolute; top: -2px; right: -2px; background: oklch(55% 0.2 25); color: #fff; font-size: 11px; font-weight: 800;
  min-width: 20px; height: 20px; border-radius: 10px; display: flex; align-items: center; justify-content: center; padding: 0 5px; border: 2px solid #fff; }

/* פאנל – נפתח מעל הכפתור, מיושר לפינה השמאלית שלו */
.dock-panel { position: absolute; bottom: calc(100% + 12px); left: 0;
  width: 340px; max-width: calc(100vw - 40px); height: 560px; max-height: calc(100vh - 110px);
  background: #fff; border: 1px solid oklch(92% 0.006 250); border-radius: 16px; box-shadow: 0 18px 50px oklch(20% 0.02 250 / 0.28);
  display: flex; flex-direction: column; overflow: hidden; font-family: 'Heebo', var(--font); }

@keyframes dockUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

.dock-head { display: flex; align-items: center; gap: 10px; padding: 13px 16px; color: #fff; }
.dock-head.main { background: oklch(52% 0.18 250); }
.dock-head.internal { background: oklch(52% 0.18 250); }

/* ============================================================

/* פאנל הדוק – ראש לבן */

/* חיפוש */

.dp-search input { width: 100%; box-sizing: border-box; border: 1px solid oklch(90% 0.006 250); border-radius: 10px; padding: 10px 14px 10px 38px; font-family: inherit; font-size: 12.5px; outline: none; }
.dp-search input:focus { border-color: var(--pblue); }
.dp-search span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); display: flex; }
.dp-search svg { width: 15px; height: 15px; color: oklch(60% 0.01 250); }

/* פילטרים (טאבים) */
.dp-pills { display: flex; gap: 2px; margin: 12px 10px 0; padding: 0 4px; border-bottom: 1px solid oklch(93% 0.006 250); overflow-x: auto; }

.dp-pill span { background: oklch(95% 0.01 250); color: oklch(45% 0.01 250); font-size: 10px; border-radius: 8px; padding: 0 6px; min-width: 16px; text-align: center; }

/* גוף */

.dpe-ic { width: 60px; height: 60px; border-radius: 50%; background: oklch(93% 0.06 145); color: oklch(52% 0.15 145); display: flex; align-items: center; justify-content: center; margin-bottom: 6px; }

  background: var(--brand-soft); border-radius: 8px; padding: 6px 9px; margin-top: 8px; }

.fu2-day { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 9px; text-align: center; font-family: inherit; cursor: pointer; }

  border-radius: 10px; padding: 11px 14px; font-family: inherit; cursor: pointer; }

/* שינוי מהיר – עם מועד מתחת */
.fu2-quick { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.fu2-q { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 9px 6px; text-align: center; font-family: inherit; cursor: pointer; }
.fu2-q b { display: block; font-size: 12px; } .fu2-q small { color: var(--brand-600); font-size: 10.5px; font-weight: 700; }
.fu2-q:hover { border-color: var(--brand); background: var(--brand-soft-2); }
@media (max-width: 460px) { .fu2-quick { grid-template-columns: 1fr 1fr; } }
/* ============================================================
   CallBiz Manager – v16: צ'יפ זז · בקרה משודרגת · מסכי סיידבר
   ============================================================ */

/* ---- טאבים עליונים: segmented עם מחוון מחליק ---- */
.proc-seg { position: relative; display: inline-flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 3px; }
.proc-seg .seg-ind { position: absolute; top: 3px; bottom: 3px; width: 0; background: var(--brand); border-radius: 9px; transition: left .25s cubic-bezier(.4,0,.2,1), width .25s cubic-bezier(.4,0,.2,1); }
.proc-seg .proc-tab { position: relative; z-index: 1; border: none; background: transparent; color: var(--text-2); transition: color .2s; }
.proc-seg .proc-tab:hover { border: none; background: transparent; }
.proc-seg .proc-tab.active { background: transparent; border: none; color: #fff; }

/* ---- בקרה: 7 KPI + פילטרים ---- */

@media (max-width: 1250px) { .plat-kpis.seven { grid-template-columns: repeat(4, 1fr); } }

.ad-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-inline-start: auto; }

.ad-chip.on { background: var(--pblue); border-color: var(--pblue); color: #fff; }

/* ---- פאנל פירוט: סטטיסטיקות ראש ---- */
.ad-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 12px 22px 0; }
.ad-stat { background: oklch(97.5% 0.004 250); border: 1px solid oklch(93% 0.006 250); border-radius: 11px; padding: 10px; text-align: center; }
.ad-stat b { display: block; font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ad-stat small { font-size: 10.5px; color: oklch(52% 0.01 250); }

/* קופסאות פירוט */
.ad-box-head { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.ad-box-ic { width: 36px; height: 36px; border-radius: 10px; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
.ad-box-head b { display: block; font-size: 14px; } .ad-box-head small { font-size: 11px; color: oklch(52% 0.01 250); }
.ad-box.slow { background: oklch(97% 0.02 300); border: 1px solid oklch(90% 0.04 300); }
.ad-q { background: #fff; border: 1px solid oklch(92% 0.03 70); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }

.ad-q > *:not(summary) { margin: 0 12px 10px; }
.ad-warn { font-size: 11.5px; font-weight: 700; color: oklch(50% 0.16 25); }
